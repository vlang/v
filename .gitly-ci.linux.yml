# Each step runs in the allowlisted Linux image, in a disposable workspace.
# Build the exact pushed source, then exercise its compiler and test runner.
variables:
  VJOBS: '1'
  VTEST_FAIL_FAST: '1'
  V_MACOS_V3_NO_FALLBACK: '1'
  VFLAGS: '-cc tcc -no-retry-compilation'
  GITHUB_ACTIONS: 'true'
  GITHUB_JOB: tcc-linux
  RUNNER_OS: Linux

jobs:
  linux-tcc:
    timeout: 60m
    network: true
    steps:
      - name: Build V from the pushed source
        run: env -u GITHUB_JOB VFLAGS= make -j1
      - name: V doctor
        run: ./v run ci/linux_ci.vsh v_doctor_tcc
      - name: V self compilation
        run: ./v run ci/linux_ci.vsh v_self_compilation_tcc
      - name: Verify the V test runner
        run: ./v run ci/linux_ci.vsh verify_v_test_works_tcc
      - name: Test pure V math
        run: ./v run ci/linux_ci.vsh test_pure_v_math_module_tcc
      - name: Test inline assembly
        run: ./v run ci/linux_ci.vsh test_inline_assembly
      - name: V self tests
        run: ./v run ci/linux_ci.vsh self_tests_tcc
