name: Legacy musl C++ toolchain diagnostic
on:
  pull_request:
    paths:
      - .github/workflows/legacy_musl_cpp_toolchain_ci.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpp-toolchain:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    container:
      image: thevlang/vlang:ubuntu-build
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install build dependencies and identify original toolchain
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y g++ bison flex texinfo patch xz-utils wget ca-certificates binutils file
          cat /etc/os-release
          dpkg-query -W musl musl-dev musl-tools gcc g++
          musl-gcc --version
          musl-gcc -dumpspecs
          musl-gcc -v -E -x c++ /dev/null
          make -j4
          ./v version
      - name: Reproduce original fixture failure without changing the tests
        shell: bash
        run: |
          set -euo pipefail
          fixture=vlib/v/tests/project_with_cpp_code/compiling_cpp_files_with_a_cplusplus_compiler_test.c.v
          test "$(git hash-object "$fixture")" = 1a928bb60f08a66dd538e370afb131562cc1e682
          test "$(git hash-object vlib/v/tests/project_with_cpp_code/implementation.cpp)" = 7743bcee013aeaa3e52f5e7483d014dd59fcf685
          set +e
          env -u VFLAGS ./v -cc musl-gcc -gc none -d use_bundled_libgc -showcc -silent -b c "$fixture" > /tmp/musl-cpp-original.log 2>&1
          rc=$?
          set -e
          cat /tmp/musl-cpp-original.log
          test "$rc" -ne 0
          grep -F 'fatal error: type_traits: No such file or directory' /tmp/musl-cpp-original.log
      - name: Build pinned coherent musl C and C++ toolchain
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/richfelker/musl-cross-make.git /tmp/musl-cross-make
          cd /tmp/musl-cross-make
          git checkout --detach 5e8042e63de29f8473fc3b0b831a587ba284e1a8
          test "$(git rev-parse HEAD)" = 5e8042e63de29f8473fc3b0b831a587ba284e1a8
          # This is a C++ capability diagnostic, not a replacement for sanitizer coverage.
          # Use the original GCC generation, a pinned musl release and upstream source hashes.
          printf '%s\n' 'TARGET = x86_64-linux-musl' 'GCC_VER = 9.4.0' 'MUSL_VER = 1.1.24' 'OUTPUT = /tmp/musl-cpp-toolchain' 'COMMON_CONFIG += CFLAGS="-g0 -O2" CXXFLAGS="-g0 -O2"' > config.mak
          cat config.mak
          make -j4
          make -j4 install
      - name: Prove target and C++17 runtime before running V
        shell: bash
        run: |
          set -euo pipefail
          cc=/tmp/musl-cpp-toolchain/bin/x86_64-linux-musl-gcc
          cxx=/tmp/musl-cpp-toolchain/bin/x86_64-linux-musl-g++
          "$cc" --version
          "$cxx" --version
          test "$("$cc" -dumpmachine)" = x86_64-linux-musl
          test "$("$cxx" -dumpmachine)" = x86_64-linux-musl
          "$cxx" -print-sysroot
          "$cxx" -v -E -x c++ /dev/null
          "$cxx" -print-file-name=libstdc++.a
          test -f "$("$cxx" -print-file-name=libstdc++.a)"
          cat > /tmp/musl-cpp-smoke.cpp <<'CPP'
          #include <string>
          #include <type_traits>
          #include <stdexcept>
          #include <cassert>
          int main() {
            static_assert(std::is_same_v<char, char>);
            std::string s = "musl";
            try { throw std::runtime_error(s); }
            catch (const std::runtime_error& e) { assert(s == e.what()); return 0; }
            return 1;
          }
          CPP
          "$cxx" -std=c++17 -static /tmp/musl-cpp-smoke.cpp -o /tmp/musl-cpp-smoke
          file /tmp/musl-cpp-smoke
          readelf -lW /tmp/musl-cpp-smoke
          readelf -dW /tmp/musl-cpp-smoke
          if readelf -lW /tmp/musl-cpp-smoke | grep -q 'INTERP'; then exit 1; fi
          /tmp/musl-cpp-smoke
          "$cxx" -std=gnu++17 -c vlib/v/tests/project_with_cpp_code/implementation.cpp -o /tmp/musl-original-cpp.o
          nm -g /tmp/musl-original-cpp.o
          cat > /tmp/musl-cpp-caller.c <<'C'
          #include <assert.h>
          int sizeof_char(void);
          int cplusplus_17_feature(void);
          int main(void) {
            assert(sizeof_char() == sizeof(char));
            assert(cplusplus_17_feature() == 17);
            return 0;
          }
          C
          "$cc" -static /tmp/musl-cpp-caller.c /tmp/musl-original-cpp.o -lstdc++ -o /tmp/musl-cpp-caller
          /tmp/musl-cpp-caller
      - name: Run original V C++17 fixture with the candidate target toolchain
        shell: bash
        run: |
          set -euo pipefail
          cc=/tmp/musl-cpp-toolchain/bin/x86_64-linux-musl-gcc
          fixture=vlib/v/tests/project_with_cpp_code/compiling_cpp_files_with_a_cplusplus_compiler_test.c.v
          # Keep the original C++17 assertions and musl/GC flags. Static C++ and GCC
          # runtimes avoid loading the host's glibc-target libstdc++ into a musl process.
          env -u VFLAGS ./v -cc "$cc" -gc none -d use_bundled_libgc -ldflags '-static-libstdc++ -static-libgcc' -showcc -show-c-output -no-retry-compilation -b c "$fixture" 2>&1 | tee /tmp/musl-cpp-candidate.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: legacy-musl-cpp-diagnostic
          path: |
            /tmp/musl-cpp-original.log
            /tmp/musl-cpp-candidate.log
            /tmp/musl-cross-make/config.mak
