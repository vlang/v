name: Generic sort selector diagnostics

on:
  pull_request:
    paths:
      - '.github/workflows/generic_sort_selector_diagnostic_ci.yml'
      - 'vlib/v/transform/array.v'
      - 'vlib/v/gen/c/**'
      - 'vlib/json2/encode.v'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reduced:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-v
        with:
          symlink: 'false'
      - name: Reduce generic sort and JSON Any map independently
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sort-diagnostic"
          cd "$RUNNER_TEMP/sort-diagnostic"
          cat > generic_sort.v <<'V'
          struct SortKey[K] {
              name string
              key K
          }

          fn sort_keys[K](mut keys []SortKey[K]) {
              keys.sort(a.name < b.name)
          }

          fn main() {
              mut keys := [SortKey[int]{name: 'z', key: 1},
                  SortKey[int]{name: 'a', key: 2},
                  SortKey[int]{name: 'a', key: 3}]
              sort_keys(mut keys)
              assert keys[0].key == 2
              assert keys[1].key == 3
              assert keys[2].key == 1
          }
          V
          cat > any_map.v <<'V'
          import json2

          fn main() {
              val := json2.Any({'b': json2.Any(1), 'a': json2.Any(2)})
              assert json2.encode(val) == '{"a":2,"b":1}'
          }
          V
          v="$GITHUB_WORKSPACE/v"
          "$v" fmt -w generic_sort.v any_map.v
          failed=0
          for source in generic_sort any_map; do
            for cc in gcc clang; do
              if "$v" -cc "$cc" -no-retry-compilation -no-parallel -o "$source-$cc.c" "$source.v" > "$source-$cc.emit.log" 2>&1; then
                echo "Generated C for $source with $cc"
              else
                failed=1
              fi
              if "$v" -cc "$cc" -no-retry-compilation -no-parallel -keepc -showcc -o "$source-$cc" "$source.v" > "$source-$cc.build.log" 2>&1; then
                if ! "./$source-$cc" > "$source-$cc.run.log" 2>&1; then
                  failed=1
                fi
              else
                failed=1
              fi
              cat "$source-$cc.emit.log" "$source-$cc.build.log"
            done
          done
          exit "$failed"
      - name: Original JSON ordering suite
        if: always()
        run: |
          ./v -cc gcc -no-retry-compilation -no-parallel vlib/json2/encode_map_order_test.v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reduced-sort-generated-c
          path: ${{ runner.temp }}/sort-diagnostic
  original:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      VFLAGS: -no-parallel
      VJOBS: 1
      VSL_CI_REVISION: d60f9c36df5e9d3ef73e4c6876d83474b6e2953b
      VTL_CI_REVISION: 7ba41eb7ecb3fa206ff3ae0ed7b88350d45bdce9
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-v
      - name: Install original dependencies
        id: dependencies
        run: |
          .github/workflows/disable_azure_mirror.sh
          v retry -- sudo apt -qq update
          v retry -- sudo apt -qq install libgc-dev libgl1-mesa-dev mesa-common-dev liblapacke-dev libopenblas-dev libopenmpi-dev
          vtl_dir="$HOME/.vmodules/vtl"
          git init "$vtl_dir"
          git -C "$vtl_dir" remote add origin https://github.com/vlang/vtl.git
          v retry -- git -C "$vtl_dir" fetch --depth=1 origin "$VTL_CI_REVISION:refs/remotes/origin/ci-pinned"
          git -C "$vtl_dir" checkout --detach "$VTL_CI_REVISION"
          v retry -- git -C "$vtl_dir" submodule update --init --recursive --depth=1
          (cd "$vtl_dir" && v retry -- v install)
          vsl_dir="$HOME/.vmodules/vsl"
          v retry -- git -C "$vsl_dir" fetch --depth=1 origin "$VSL_CI_REVISION:refs/remotes/origin/ci-pinned"
          git -C "$vsl_dir" checkout --detach "$VSL_CI_REVISION"
          v retry -- git -C "$vsl_dir" submodule update --init --recursive --depth=1
      - name: Capture generated C and repeat the exact failing example
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/vtl-sort-diagnostic"
          example="$HOME/.vmodules/vtl/examples/vtl_basic_usage/main.v"
          ./v -d cblas -no-parallel -o "$RUNNER_TEMP/vtl-sort-diagnostic/original.c" "$example"
          ./v -d cblas -no-parallel -o "$example.bin" "$example"
          "$example.bin"
      - name: Bisect the pinned VTL example by semantic use
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/vtl-sort-diagnostic/prefixes"
          mkdir -p "$root"
          example="$HOME/.vmodules/vtl/examples/vtl_basic_usage/main.v"
          python3 - "$example" "$root" <<'PY'
          import pathlib
          import sys
          source = pathlib.Path(sys.argv[1]).read_text()
          root = pathlib.Path(sys.argv[2])
          # Keep original statements verbatim; each prefix ends at a complete statement.
          markers = {
              'construction': '\nb :=',
              'addition': '\nc.apply(',
              'apply': '\nd :=',
              'map': '\nvalues :=',
          }
          for label, marker in markers.items():
              assert source.count(marker) == 1, (label, marker)
              folder = root / label
              folder.mkdir()
              text = source.split(marker, 1)[0]
              if label == 'construction':
                  text += '\nprintln(a)\n'
              (folder / 'main.v').write_text(text + '\n')
          folder = root / 'direct_any_with_vtl'
          folder.mkdir()
          (folder / 'main.v').write_text("""import vtl
          import json2

          a := vtl.from_1d([1, 2, 3, 4])!
          println(a)
          val := json2.Any({'b': json2.Any(1), 'a': json2.Any(2)})
          assert json2.encode(val) == '{"a":2,"b":1}'
          """)
          # The failing prefixes have one arrow when only top-level a exists,
          # and two when both a and b exist. Test whether comparator placeholders
          # inherit unrelated main-scope pointer metadata.
          original = source.split('\nb :=', 1)[0]
          probes = {
              'vtl_renamed': original.replace('a :=', 'tensor_value :=', 1) + '\nprintln(tensor_value)\n',
              'vtl_no_print': original + '\n_ = a\n',
              'vtl_import_json_only': """import vtl
          import json2

          val := json2.Any({'b': json2.Any(1), 'a': json2.Any(2)})
          assert json2.encode(val) == '{"a":2,"b":1}'
          """,
          }
          # Keep the same map encoding in every control. Change only the names
          # of unrelated references, and independently vary one versus two.
          for label, first, second in [
              ('json_ref_a', 'a', 'unrelated_b'),
              ('json_ref_b', 'unrelated_a', 'b'),
              ('json_ref_ab', 'a', 'b'),
              ('json_ref_renamed', 'unrelated_a', 'unrelated_b'),
          ]:
              probes[label] = f"""import json2

          struct ProbeValue {{
              n int
          }}

          {first} := &ProbeValue{{n: 1}}
          {second} := &ProbeValue{{n: 2}}
          assert {first}.n + {second}.n == 3
          val := json2.Any({{'b': json2.Any(1), 'a': json2.Any(2)}})
          assert json2.encode(val) == '{{"a":2,"b":1}}'
          """
          for label, text in probes.items():
              folder = root / label
              folder.mkdir()
              (folder / 'main.v').write_text(text)
          PY
          failed=0
          printf 'case\temit\tbuild\trun\n' > "$root/results.tsv"
          for label in construction addition apply map direct_any_with_vtl vtl_renamed vtl_no_print vtl_import_json_only json_ref_a json_ref_b json_ref_ab json_ref_renamed; do
            folder="$root/$label"
            emit=0
            build=0
            ran=not-run
            ./v -cc gcc -no-retry-compilation -d cblas -no-parallel -o "$folder/generated.c" "$folder/main.v" > "$folder/emit.log" 2>&1 || emit=$?
            ./v -cc gcc -no-retry-compilation -d cblas -no-parallel -keepc -showcc -o "$folder/program" "$folder/main.v" > "$folder/build.log" 2>&1 || build=$?
            if [ "$build" -eq 0 ]; then
              ran=0
              "$folder/program" > "$folder/run.log" 2>&1 || ran=$?
            fi
            printf '%s\t%s\t%s\t%s\n' "$label" "$emit" "$build" "$ran" >> "$root/results.tsv"
            if [ -s "$folder/generated.c" ]; then
              grep -n 'EncoderMapKey_string.*__sort_.*name' "$folder/generated.c" > "$folder/selector-lines.txt" || :
              cat "$folder/selector-lines.txt"
            fi
            cat "$folder/emit.log" "$folder/build.log"
            if [ "$emit" -ne 0 ] || [ "$build" -ne 0 ] || [ "$ran" != 0 ]; then
              failed=1
            fi
          done
          cat "$root/results.tsv"
          exit "$failed"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-vtl-generated-c
          path: ${{ runner.temp }}/vtl-sort-diagnostic

  trace-selector:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-v
        with:
          symlink: 'false'
      - name: Build separate diagnostic compiler
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/selector-trace"
          mkdir -p "$root"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('vlib/v/transform/array.v')
          s = p.read_text()
          start = s.index('fn (mut t Transformer) substitute_array_sort_vars_named(')
          anchor = '\tstart := t.a.children.len\n'
          i = s.index(anchor, start)
          trace = """	if node.kind == .selector && node.value == 'name' && children.len > 0 {
          		old_base := t.a.child_node(&node, 0)
          		new_base := t.a.nodes[int(children[0])]
          		if old_base.kind == .ident && old_base.value in [a_name, b_name] {
          			eprintln('SORT_TRACE substitute name=${old_base.value} op=${node.op} selector_type=${node.typ} old_base_type=${old_base.typ} new_base_kind=${new_base.kind} new_base_op=${new_base.op} new_base_type=${new_base.typ}')
          		}
          	}
          """
          p.write_text(s[:i] + trace + s[i:])
          p = Path('vlib/v/gen/c/cleanc.v')
          s = p.read_text()
          anchor = '\t\t\t\tbase_is_deref := base.kind == .prefix && base.op == .mul\n'
          assert s.count(anchor) == 1
          trace = """				if node.value == 'name' && base.kind != .ident {
          					eprintln('SORT_TRACE cgen op=${node.op} selector_type=${node.typ} base_kind=${base.kind} base_op=${base.op} base_node_type=${base.typ} resolved_base_type=${base_type0.source_type_id()} resolved_pointer=${base_type0 is types.Pointer} explicit_deref=${base_is_deref}')
          				}
          """
          p.write_text(s.replace(anchor, anchor + trace))
          PY
          git diff -- vlib/v/transform/array.v vlib/v/gen/c/cleanc.v > "$root/instrumentation.diff"
          ./v -o "$GITHUB_WORKSPACE/vtrace" cmd/v
          git restore -- vlib/v/transform/array.v vlib/v/gen/c/cleanc.v
          git diff --exit-code
      - name: Trace independent name collision and pointer sort controls
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/selector-trace"
          python3 - "$root" <<'PY'
          from pathlib import Path
          import sys
          root = Path(sys.argv[1])
          for case, first, second in [('ref_a', 'a', 'other_b'), ('ref_b', 'other_a', 'b'), ('ref_ab', 'a', 'b'), ('renamed', 'other_a', 'other_b')]:
              (root / (case + '.v')).write_text(f"""import json2

          struct ProbeValue {{
              n int
          }}

          {first} := &ProbeValue{{n: 1}}
          {second} := &ProbeValue{{n: 2}}
          assert {first}.n + {second}.n == 3
          val := json2.Any({{'b': json2.Any(1), 'a': json2.Any(2)}})
          assert json2.encode(val) == '{{"a":2,"b":1}}'
          """)
          (root / 'pointer_sort.v').write_text("""struct SortKey {
              name string
          }

          fn main() {
              mut keys := [&SortKey{name: 'z'}, &SortKey{name: 'a'}]
              keys.sort(a.name < b.name)
              assert keys[0].name == 'a'
              assert keys[1].name == 'z'
          }
          """)
          PY
          failed=0
          printf 'case\tcompiler\temit\tbuild\trun\n' > "$root/results.tsv"
          for case in ref_a ref_b ref_ab renamed pointer_sort; do
            for role in baseline trace; do
              v="$GITHUB_WORKSPACE/v"
              if [ "$role" = trace ]; then v="$GITHUB_WORKSPACE/vtrace"; fi
              emit=0
              build=0
              ran=not-run
              "$v" -cc gcc -no-retry-compilation -no-parallel -o "$root/$case-$role.c" "$root/$case.v" > "$root/$case-$role.emit.log" 2>&1 || emit=$?
              "$v" -cc gcc -no-retry-compilation -no-parallel -o "$root/$case-$role.bin" "$root/$case.v" > "$root/$case-$role.build.log" 2>&1 || build=$?
              if [ "$build" -eq 0 ]; then
                ran=0
                "$root/$case-$role.bin" > "$root/$case-$role.run.log" 2>&1 || ran=$?
              fi
              printf '%s\t%s\t%s\t%s\t%s\n' "$case" "$role" "$emit" "$build" "$ran" >> "$root/results.tsv"
              if [ -s "$root/$case-$role.c" ]; then
                grep -nE '__sort_.*name' "$root/$case-$role.c" > "$root/$case-$role.selectors" || :
                cat "$root/$case-$role.selectors"
              fi
              cat "$root/$case-$role.emit.log" "$root/$case-$role.build.log"
              if [ "$emit" -ne 0 ] || [ "$build" -ne 0 ] || [ "$ran" != 0 ]; then failed=1; fi
            done
          done
          cat "$root/results.tsv"
          exit "$failed"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sort-selector-metadata-trace
          path: ${{ runner.temp }}/selector-trace

  compiler-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/cache-apt-packages-action
      - uses: ./.github/actions/setup-v
      - name: Rebuild and verify formatting
        run: |
          set -eu
          ./v self
          ./v fmt -w vlib/v/transform/array.v
          git diff -- vlib/v/transform/array.v
          git diff --exit-code -- vlib/v/transform/array.v
          ./v fmt -verify vlib/v/transform/array.v
          ./v -cc gcc -no-retry-compilation -no-parallel vlib/json2/encode_map_order_test.v
      - name: Full compiler and C backend tests
        run: |
          set -eu
          ./v run ci/linux_ci.vsh install_dependencies_for_examples_and_tools_gcc
          .github/workflows/disable_azure_mirror.sh
          ./v retry -- sudo apt update
          ./v retry -- sudo apt install --quiet -y gobjc libobjc-14-dev
          ./v -silent vlib/v/compiler_errors_test.v
          ./v -silent test vlib/v/
          ./v -silent test vlib/v/gen/c/

  matched_instructions:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 6e070cd3405acf9e93e969c6932aa2bca29ece31
          path: baseline
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: 5097e47b877a518aa8bb76c00cf6bcb9899f0b07
          path: candidate
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: 2d1367e589ed30c03325e586a8ddfd3bc96c8c3d
          path: fixture
          persist-credentials: false
      - name: Build matched production compilers
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          out="$RUNNER_TEMP/sort-selector-benchmark"
          mkdir -p "$out"
          {
            uname -a
            sw_vers
            sysctl -n hw.model hw.ncpu hw.memsize
            clang --version
            xcodebuild -version
          } > "$out/environment.txt"
          for role in baseline candidate; do
            (
              cd "$role"
              git rev-parse HEAD > "$out/$role.commit"
              env -u VFLAGS -u VEXE -u LLVM_PROFILE_FILE -u VJOBS make -j4
              env -u VFLAGS -u VEXE -u LLVM_PROFILE_FILE -u VJOBS SOURCE_DATE_EPOCH=0 ./v -prod -cc clang self
              cp ./v "$out/$role.v"
              shasum -a 256 "$out/$role.v" > "$out/$role.binary.sha256"
              ./v version
            ) 2>&1 | tee "$out/$role.build.log"
          done
          cd fixture
          git rev-parse HEAD > "$out/fixture.commit"
          git ls-tree -r HEAD > "$out/fixture.git-tree.txt"
          # The fixed checkout is input, not a third compiler to bootstrap.
          # Its historical source need not build with today's external VC.
          # The fixture Makefile enables legacy support only on Darwin <= 16.
          # macos-15 ARM64 uses the system SDK, so no legacy checkout is created.
          darwin_major="$(uname -r | cut -d. -f1)"
          test "$darwin_major" -gt 16
          env -u VFLAGS -u VEXE -u LLVM_PROFILE_FILE -u VJOBS make -j4 latest_tcc 2>&1 | tee "$out/fixture.setup.log"
          git -C thirdparty/tcc rev-parse HEAD > "$out/fixture.tcc.commit"
          printf "not applicable: Darwin %s uses the system SDK\n" "$darwin_major" > "$out/fixture.legacy.status"
          git diff --exit-code
      - name: Fixed fixture inventory, warmups and ten alternating pairs
        shell: bash
        working-directory: fixture
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/sort-selector-benchmark"
          # Historical cmd/v selected Wasm implicitly; #31367 made it opt-in.
          # Restore exactly the documented fixture workload, not a smaller denominator.
          args=(-nocache -gc none -prealloc -compile-backend fastc,wasm -building-v)
          printf '%s\n' "${args[@]}" > "$out/measurement-args.txt"
          run_role() {
            role="$1"
            sample="$2"
            cp "$out/$role.v" ./v
            shasum -a 256 ./v > "$out/$sample.binary.sha256"
            rm -f "$out/self.c"
            if env -u VFLAGS -u VEXE -u LLVM_PROFILE_FILE VJOBS=1 SOURCE_DATE_EPOCH=0 \
              /usr/bin/time -l -o "$out/$sample.time.txt" \
              ./v "${args[@]}" -o "$out/self.c" cmd/v \
              > "$out/$sample.stdout" 2> "$out/$sample.stderr"; then
              echo 0 > "$out/$sample.exit-status.txt"
            else
              status=$?
              echo "$status" > "$out/$sample.exit-status.txt"
              cat "$out/$sample.stderr"
              return "$status"
            fi
            cat "$out/$sample.time.txt"
            awk '/instructions retired/ { n++; if ($1+0>0) positive++ } END { exit !(n==1 && positive==1) }' "$out/$sample.time.txt"
            test -s "$out/self.c"
            shasum -a 256 "$out/self.c" > "$out/$sample.c.sha256"
            cmp "$out/$role.inventory.c" "$out/self.c"
          }
          # Collect BOTH inventories before enforcing the fixed denominator.
          # This preserves comparative evidence even when the historical count differs.
          for role in baseline candidate; do
            cp "$out/$role.v" ./v
            rm -f "$out/self.c"
            rc=0
            env -u VFLAGS -u VEXE -u LLVM_PROFILE_FILE VJOBS=1 SOURCE_DATE_EPOCH=0 \
              ./v "${args[@]}" -v -o "$out/self.c" cmd/v \
              > "$out/$role.inventory.stdout" 2> "$out/$role.inventory.stderr" || rc=$?
            echo "$rc" > "$out/$role.inventory.exit-status.txt"
            cat "$out/$role.inventory.stdout" "$out/$role.inventory.stderr"
            if [ -s "$out/self.c" ]; then
              cp "$out/self.c" "$out/$role.inventory.c"
            fi
          done
          python3 - "$out" <<'PY'
          import collections, hashlib, pathlib, re, subprocess, sys
          out = pathlib.Path(sys.argv[1])
          fixture = pathlib.Path.cwd().resolve()
          paths = sorted(p for p in subprocess.check_output(
              ['git', 'ls-files', '-z', '--', 'cmd/v', 'vlib']).decode().split('\0')
              if p and pathlib.Path(p).suffix in ('.v', '.vsh', '.c', '.h'))
          manifest = b''.join(p.encode() + b'\0' +
              hashlib.sha256((fixture / p).read_bytes()).hexdigest().encode() + b'\n'
              for p in paths)
          (out / 'fixture.source-manifest').write_bytes(manifest)
          digest = hashlib.sha256(manifest).hexdigest()
          print('fixture tracked source files:', len(paths), 'manifest SHA-256:', digest)
          expected_digest = 'f53a9b162657ba667fde1d8a00cd6f59c0f7e6c7f847985894d61189122a2966'
          inventories = {}
          errors = []
          if len(paths) != 8498 or digest != expected_digest:
              errors.append('fixture source manifest differs from documented fixed fixture')
          for role in ('baseline', 'candidate'):
              log = '\n'.join((out / f'{role}.inventory.{suffix}').read_text(errors='replace')
                              for suffix in ('stdout', 'stderr'))
              counts = re.findall(r'^\s*parsed \.(v|vh) files\s+(\d+) files\s*$', log, re.M)
              lines = re.findall(r'^\s*parsed \.(v|vh) lines\s+(\d+) lines\s*$', log, re.M)
              selected = []
              for _, entry in re.findall(r'^[ \t]*\.(v|vh) files:[ \t]*(.*)$', log, re.M):
                  for name in entry.split():
                      path = pathlib.Path(name).expanduser()
                      if not path.is_absolute():
                          path = fixture / path
                      try:
                          selected.append(path.resolve().relative_to(fixture).as_posix())
                      except ValueError:
                          errors.append(f'{role}: source outside fixture: {path}')
              selected.sort()
              inventories[role] = selected
              (out / f'{role}.parsed-paths.txt').write_text('\n'.join(selected) + '\n')
              groups = collections.Counter('/'.join(p.split('/')[:3]) for p in selected)
              print(role, 'files:', counts, 'lines:', lines, 'listed:', len(selected),
                    'modules:', sorted(groups.items()))
              if (out / f'{role}.inventory.exit-status.txt').read_text().strip() != '0':
                  errors.append(f'{role}: inventory compilation failed')
              if len(counts) != 2 or dict(counts) != {'v': '562', 'vh': '0'}:
                  errors.append(f'{role}: fixed file count mismatch')
              if len(lines) != 2 or sum(int(n) for _, n in lines) != 559990:
                  errors.append(f'{role}: fixed line denominator mismatch')
              if len(selected) != 562 or len(set(selected)) != 562:
                  errors.append(f'{role}: parsed file list mismatch')
              # Hash of the sorted relative paths from the successful historical
              # reference inventory (job 140137867851, 562 distinct paths).
              parsed_digest = hashlib.sha256(('\n'.join(selected) + '\n').encode()).hexdigest()
              print(role, 'parsed path SHA-256:', parsed_digest)
              if parsed_digest != '375b4ef5dd70a83db5cb3fed9c4c030ee43969e5961abf31b69ee48ca671827c':
                  errors.append(f'{role}: historical parsed-path manifest mismatch')
              if any(p not in paths for p in selected):
                  errors.append(f'{role}: parsed path not in tracked fixture manifest')
          a, b = inventories['baseline'], inventories['candidate']
          (out / 'parsed-path-difference.txt').write_text(
              'baseline only:\n' + '\n'.join(sorted(set(a)-set(b))) +
              '\ncandidate only:\n' + '\n'.join(sorted(set(b)-set(a))) + '\n')
          if a != b:
              errors.append('baseline and candidate parsed different files')
          if errors:
              print('\n'.join(errors), file=sys.stderr)
              raise SystemExit(1)
          PY
          # Keep the original syntax, output equality and counter requirements.
          for role in baseline candidate; do
            clang -std=gnu11 -fsyntax-only -I thirdparty -I thirdparty/stdatomic/nix \
              "$out/$role.inventory.c" > "$out/$role.syntax.log" 2>&1
          done
          cmp "$out/baseline.inventory.c" "$out/candidate.inventory.c"
          for role in baseline candidate; do
            run_role "$role" "$role-warmup"
          done
          for i in $(seq 1 10); do
            if [ "$((i % 2))" = 1 ]; then
              run_role baseline "baseline-$i"
              run_role candidate "candidate-$i"
            else
              run_role candidate "candidate-$i"
              run_role baseline "baseline-$i"
            fi
          done
          git diff --exit-code
          python3 - "$out" <<'PY'
          import pathlib, re, statistics, sys
          root = pathlib.Path(sys.argv[1])
          def counters(role):
              values = []
              for i in range(1, 11):
                  text = (root / f'{role}-{i}.time.txt').read_text()
                  found = re.findall(r'^\s*(\d+)\s+instructions retired\s*$', text, re.M)
                  assert len(found) == 1 and int(found[0]) > 0, (role, i)
                  values.append(int(found[0]))
              return values
          a, b = counters('baseline'), counters('candidate')
          diffs = [y-x for x,y in zip(a,b)]
          ma, mb = statistics.median(a), statistics.median(b)
          report = (f'559990 parsed lines; median instructions {ma} -> {mb}\n'
                    f'instructions/line {ma/559990:.2f} -> {mb/559990:.2f}\n'
                    f'change {(mb/ma-1)*100:.4f}%; median paired delta {statistics.median(diffs)}; '
                    f'regressing pairs {sum(d>0 for d in diffs)}/10\n')
          print(report)
          (root / 'summary.txt').write_text(report)
          PY
      - name: Preserve benchmark evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: sort-selector-matched-instruction-evidence
          path: ${{ runner.temp }}/sort-selector-benchmark/
          if-no-files-found: error
