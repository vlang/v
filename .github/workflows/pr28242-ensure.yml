name: Ensure PR 28242 review fixes

on:
  push:
    branches:
      - fix-master-ci-batch-7-array-runtime
    paths:
      - '.github/pr28242_ensure.trigger'

permissions:
  contents: write

jobs:
  ensure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-master-ci-batch-7-array-runtime
          fetch-depth: 0
      - name: Apply idempotent review patch
        run: |
          script_commit=$(git rev-list --all -- .github/pr28242_finalize.py | head -1)
          test -n "$script_commit"
          git show "$script_commit:.github/pr28242_finalize.py" > /tmp/pr28242_finalize.py
          python3 /tmp/pr28242_finalize.py
          python3 - <<'PY'
          from pathlib import Path

          path = Path('vlib/v3/tests/review_transform_regressions_test.v')
          text = path.read_text()
          marker = 'fn test_array_map_tracks_aggregate_pointer_origins_from_or_and_comptime_results()'
          start = text.find(marker)
          if start < 0:
              raise SystemExit('missing aggregate-origin regression')
          end = text.find('\nfn ', start + len(marker))
          if end < 0:
              end = len(text)
          block = text[start:end]
          lines = block.splitlines()
          for i, line in enumerate(lines):
              if not line.startswith("\tassert out == 'source"):
                  continue
              j = i + 1
              while j < len(lines) and not lines[j - 1].endswith("'"):
                  j += 1
              lines[i:j] = ["\tassert out == 'source\\nsource'"]
              break
          else:
              raise SystemExit('missing aggregate-origin runtime assertion')
          normalized = '\n'.join(lines)
          if block.endswith('\n'):
              normalized += '\n'
          path.write_text(text[:start] + normalized + text[end:])
          PY
      - name: Verify patch shape
        run: |
          grep -Fq 'node.kind in [.if_expr, .match_stmt, .or_expr, .comptime_if]' vlib/v3/transform/array.v
          grep -Fq 'storage_write_can_be_bypassed_by_goto' vlib/v3/types/checker_tail.v
          grep -Fq 'test_array_map_tracks_aggregate_pointer_origins_from_or_and_comptime_results' vlib/v3/tests/review_transform_regressions_test.v
          grep -Fq 'test_param_storage_sources_do_not_treat_goto_bypassed_write_as_definite' vlib/v3/types/storage_source_test.v
          git diff --check
      - name: Commit and push clean tree
        run: |
          rm -f .github/pr28242* .github/workflows/pr28242*
          git diff --check
          git config user.name openai-codex
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "v3: preserve array-map storage flow across joins"
          git push origin HEAD:fix-master-ci-batch-7-array-runtime
