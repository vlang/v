name: CI Linux

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths-ignore:
      # vlib/v/** is intentionally NOT ignored: V3 is the default compiler on
      # Linux, so changes to it must run this suite; the canary below stays strict.
      - '**.md'
      - '**.yml'
      - '!**/linux_ci.yml'
      - 'cmd/tools/**'
      - '!cmd/tools/builders/**.v'

concurrency:
  # Replace superseded master runs instead of queueing every commit separately.
  group: linux-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tcc-linux:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 121
    env:
      VFLAGS: -cc tcc -no-retry-compilation
      # Stop a failing test session at its first failure instead of running the
      # whole suite to completion; the remaining files add no signal.
      VTEST_FAIL_FAST: '1'
      # Four test workers fit comfortably: a worker peaks near 0.25 GB and the
      # runner has 4 CPUs and 16 GB, so this is CPU-bound, not memory-bound.
      VJOBS: '4'
      VTEST_SHOW_LONGEST_BY_RUNTIME: 3
      VTEST_SHOW_LONGEST_BY_COMPTIME: 3
      VTEST_SHOW_LONGEST_BY_TOTALTIME: 3
      # Keep every command on V3; the canary below also proves which compiler ran.
      V_MACOS_V3_NO_FALLBACK: 1
    steps:
      - uses: actions/checkout@v7
        id: uses_checkout_v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/cache-apt-packages-action
        id: uses_cache_apt_packages_action
        if: ${{ success() && !cancelled() && steps.uses_checkout_v7.outcome == 'success' }}
      - name: Build V
        if: ${{ success() && !cancelled() && steps.uses_cache_apt_packages_action.outcome == 'success' }}
        id: build
        # Bootstrap helpers must also compile with V3 once the fresh compiler exists.
        env:
          V_MACOS_V3_NO_FALLBACK: 1
        run: make -j4 && ./v symlink
      # Cheapest high-signal check first: a `v vet`/`v fmt -verify` failure must not
      # cost the whole compile matrix below, and this ordering costs no extra runner.
      - name: All code is formatted
        id: format
        if: ${{ success() && !cancelled() && steps.build.outcome == 'success' }}
        run: v run ci/linux_ci.vsh all_code_is_formatted_tcc
      - name: Assert V is the default compiler (fail if V1 is silently used)
        id: canary
        if: ${{ success() && !cancelled() && steps.format.outcome == 'success' }}
        run: |
          set -uo pipefail
          # A monumental default-compiler change should be provable, not assumed:
          # this canary fails loudly if the default compiler is not dispatched on Linux
          # or if it silently falls back to the compatibility compiler.
          printf 'fn main() { println(6 * 7) }\n' > "$RUNNER_TEMP/v3_canary.v"
          V_MACOS_V3_NO_FALLBACK=1 ./v -v run "$RUNNER_TEMP/v3_canary.v" > "$RUNNER_TEMP/v3_canary.out" 2>&1 || true
          cat "$RUNNER_TEMP/v3_canary.out"
          grep -q '=== V compiler benchmark ===' "$RUNNER_TEMP/v3_canary.out" || { echo '::error::the default compiler was not dispatched on Linux'; exit 1; }
          grep -qx '42' "$RUNNER_TEMP/v3_canary.out" || { echo '::error::the V-compiled canary did not build/run correctly'; exit 1; }
          if grep -qiE 'retrying with .-old-compiler|compatibility fallback|used the stable compiler' "$RUNNER_TEMP/v3_canary.out"; then echo '::error::the default compiler silently fell back to V1'; exit 1; fi
          echo 'OK: V compiled and ran this program in-process on Linux, with the fallback disabled'
      - name: Install dependencies for examples and tools
        id: install_dependencies
        if: ${{ success() && !cancelled() && steps.canary.outcome == 'success' }}
        run: v run ci/linux_ci.vsh install_dependencies_for_examples_and_tools_tcc
      - name: Test v->c
        id: test_v_to_c
        if: ${{ success() && !cancelled() && steps.install_dependencies.outcome == 'success' }}
        run: v run ci/linux_ci.vsh test_v_to_c_tcc
      - name: v self compilation
        id: v_self_compilation
        if: ${{ success() && !cancelled() && steps.test_v_to_c.outcome == 'success' }}
        run: v run ci/linux_ci.vsh v_self_compilation_tcc
      - name: v doctor
        id: v_doctor
        if: ${{ success() && !cancelled() && steps.v_self_compilation.outcome == 'success' }}
        run: v run ci/linux_ci.vsh v_doctor_tcc
      - name: Verify `v test` works
        id: verify_v_test_works
        if: ${{ success() && !cancelled() && steps.v_doctor.outcome == 'success' }}
        run: v run ci/linux_ci.vsh verify_v_test_works_tcc
      - name: Test pure V math module
        id: test_pure_v_math_module
        if: ${{ success() && !cancelled() && steps.verify_v_test_works.outcome == 'success' }}
        run: v run ci/linux_ci.vsh test_pure_v_math_module_tcc
      - name: Test inline assembly on linux
        id: test_inline_assembly
        if: ${{ success() && !cancelled() && steps.test_pure_v_math_module.outcome == 'success' }}
        run: v run ci/linux_ci.vsh test_inline_assembly
      - name: Self tests
        id: self_tests
        if: ${{ success() && !cancelled() && steps.test_inline_assembly.outcome == 'success' }}
        run: v run ci/linux_ci.vsh self_tests_tcc
      - name: Build examples
        # Keep the full examples corpus on V3 too.
        id: build_examples
        env:
          V_MACOS_V3_NO_FALLBACK: 1
        if: ${{ success() && !cancelled() && steps.self_tests.outcome == 'success' }}
        run: v run ci/linux_ci.vsh build_examples_tcc
      - name: Run the submodule example, using a relative path
        id: run_submodule_example
        if: ${{ success() && !cancelled() && steps.build_examples.outcome == 'success' }}
        run: v run ci/linux_ci.vsh run_submodule_example_tcc
      - name: Build v tools
        id: build_v_tools
        if: ${{ success() && !cancelled() && steps.run_submodule_example.outcome == 'success' }}
        run: v run ci/linux_ci.vsh build_tools_tcc
      - name: Build v binaries
        id: build_v_binaries
        if: ${{ success() && !cancelled() && steps.build_v_tools.outcome == 'success' }}
        run: v run ci/linux_ci.vsh build_vbinaries_tcc
      - name: Build benches
        id: build_benches
        if: ${{ success() && !cancelled() && steps.build_v_binaries.outcome == 'success' }}
        run: v run ci/linux_ci.vsh build_benches_tcc
      - name: Run a VSH script
        id: run_vsh_script
        if: ${{ success() && !cancelled() && steps.build_benches.outcome == 'success' }}
        run: v run ci/linux_ci.vsh run_vsh_script_tcc
      - name: Test v tutorials
        id: test_v_tutorials
        if: ${{ success() && !cancelled() && steps.run_vsh_script.outcome == 'success' }}
        run: v run ci/linux_ci.vsh test_v_tutorials_tcc
      - name: Build cmd/tools/fast
        id: build_fast
        if: ${{ success() && !cancelled() && steps.test_v_tutorials.outcome == 'success' }}
        run: v run ci/linux_ci.vsh build_fast_tcc
      - name: V self compilation with default caching
        id: v_self_compilation_usecache
        if: ${{ success() && !cancelled() && steps.build_fast.outcome == 'success' }}
        run: v run ci/linux_ci.vsh v_self_compilation_usecache_tcc
      - name: Test password input
        id: test_password_input
        if: ${{ success() && !cancelled() && steps.v_self_compilation_usecache.outcome == 'success' }}
        run: v run ci/linux_ci.vsh test_password_input_tcc
      - name: Test readline
        id: test_readline
        if: ${{ success() && !cancelled() && steps.test_password_input.outcome == 'success' }}
        run: v run ci/linux_ci.vsh test_readline_tcc
      - name: Test leak detector
        id: test_leak_detector
        if: ${{ success() && !cancelled() && steps.test_readline.outcome == 'success' }}
        run: v run ci/linux_ci.vsh test_leak_detector_tcc
      - name: Test leak detector not being active for normal compile
        id: test_leak_detector_not_active
        if: ${{ success() && !cancelled() && steps.test_leak_detector.outcome == 'success' }}
        run: v run ci/linux_ci.vsh test_leak_detector_not_active_tcc
      # Last on purpose: this task alone is five full compiler builds, and a checkout
      # that cannot build the compiler is already red from `test_v_to_c` by now.
      - name: Build v with -prealloc
        id: build_v_with_prealloc
        env:
          V_MACOS_V3_NO_FALLBACK: 1
        if: ${{ success() && !cancelled() && steps.test_leak_detector_not_active.outcome == 'success' }}
        run: v run ci/linux_ci.vsh build_v_with_prealloc

