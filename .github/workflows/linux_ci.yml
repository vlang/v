  package2-linux:
    if: github.ref == 'refs/heads/master'
    name: Linux ${{ matrix.compiler }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            vflags: '-cc gcc'
          - compiler: clang
            vflags: '-cc clang'
          - compiler: tcc
            vflags: '-cc tcc -no-retry-compilation'
    # Temporarily disabled: with the condition on the job, no runner is started.
    if: ${{ false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 121
    env:
      VFLAGS: ${{ matrix.vflags }}
    steps:
      - name: Multiwindow package 2 regressions (temporarily disabled)
        run: echo 'multiwindow package 2 CI is temporarily disabled on Linux'
