name: Release CI

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing weekly or version tag to publish; leave empty to build only'
        required: false
        type: string
        default: ''
  push:
    branches:
      - master
    paths:
      - '.github/workflows/release_ci.yml'
      - 'cmd/tools/builders/windows_arm64_release.ps1'
  pull_request:
    paths:
      - '.github/workflows/release_ci.yml'
      - 'cmd/tools/builders/windows_arm64_release.ps1'

concurrency:
  group: release-${{ github.workflow }}-${{ inputs.release_tag || (github.ref_type == 'tag' && github.ref_name) || github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' && inputs.release_tag == '' }}

permissions:
  contents: write

jobs:
  windows-arm64-smoke:
    if: github.event_name == 'pull_request'
    runs-on: windows-11-arm
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build and verify native ARM64 compiler and tools
        shell: pwsh
        run: ./cmd/tools/builders/windows_arm64_release.ps1

  release-build:
    if: github.ref == 'refs/heads/master'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      matrix:
        os:
          [
            ubuntu-22.04,
            ubuntu-22.04-arm,
            macos-15-intel,
            macos-15,
            windows-latest,
            windows-11-arm,
          ]
        include:
          - os: ubuntu-22.04
            cc: gcc
            target: linux
            artifact: v_linux.zip
          - os: ubuntu-22.04-arm
            cc: gcc
            target: linux_arm64
            artifact: v_linux_arm64.zip
          - os: macos-15-intel
            cc: clang
            target: macos_x86_64
            artifact: v_macos_x86_64.zip
          - os: macos-15
            cc: clang
            target: macos_arm64
            artifact: v_macos_arm64.zip
          - os: windows-latest
            cc: msvc
            target: windows
            artifact: v_windows.zip
          - os: windows-11-arm
            cc: msvc
            target: windows_arm64
            artifact: v_windows_arm64.zip
      fail-fast: false
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.release_tag || github.ref }}
      - name: Verify release tag
        if: github.ref_type == 'tag' || inputs.release_tag != ''
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          git check-ref-format "refs/tags/$RELEASE_TAG"
          case "$RELEASE_TAG" in
            weekly.*|0.*) ;;
            *) echo "Unsupported release tag: $RELEASE_TAG" >&2; exit 1 ;;
          esac
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
      - name: Check platform support in the selected source tree
        id: platform
        shell: bash
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          if [[ "$RELEASE_TARGET" == windows_arm64 && ! -f cmd/tools/builders/windows_arm64_release.ps1 ]]; then
            echo 'Skipping Windows ARM64: the selected tag predates its bootstrap script.'
            echo 'supported=false' >> "$GITHUB_OUTPUT"
          else
            echo 'supported=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Compile release binaries
        if: runner.os != 'Windows'
        run: |
          make
          ./v -cc ${{ matrix.cc }} -prod -o v cmd/v
          ./v -cc ${{ matrix.cc }} -prod cmd/tools/vup.v
          ./v -cc ${{ matrix.cc }} -prod cmd/tools/vdoctor.v
      - name: Compile release binaries (Windows)
        if: runner.os == 'Windows' && matrix.target == 'windows'
        run: |
          ./makev.bat -msvc
          ./v -prod -cc msvc -o cmd/vprod.exe cmd/v
          ./v -prod -cc msvc cmd/tools/vup.v
          ./v -prod -cc msvc cmd/tools/vdoctor.v
          del ./*.exe
          del ./*.tmp.obj
          move cmd/vprod.exe v.exe
      - name: Compile and verify release binaries (Windows ARM64)
        if: matrix.target == 'windows_arm64' && steps.platform.outputs.supported == 'true'
        shell: pwsh
        run: ./cmd/tools/builders/windows_arm64_release.ps1
      - name: Prepare artifact
        if: steps.platform.outputs.supported == 'true'
        shell: bash
        run: |
          if [[ ${{ matrix.os }} == 'macos-14' ]]; then
            rm -rf thirdparty/tcc
            git clone --branch thirdparty-macos-arm64 --depth=1 https://github.com/vlang/tccbin thirdparty/tcc
          fi
          # Remove excluded
          if [[ $RUNNER_OS == 'Windows' ]]; then
            find . -type f \( -name "*.ilk" -o -name "*.pdb" \) -exec rm -rf {} +
            rm -rf v_old.exe
          fi
          find . -type d -name ".git" -exec rm -rf {} +
          rm -rf vc/
          rm -rf v_old
          rm -rf vlib/v/tests/bench/gcboehm/*.svg.xz
      - name: Create ZIP archive
        if: steps.platform.outputs.supported == 'true'
        shell: bash
        run: |
          cd ..
          if [[ $RUNNER_OS == 'Windows' ]]; then
            7z a -tzip ${{ matrix.artifact }} v/
          else
            zip -r9 --symlinks ${{ matrix.artifact }} v/
          fi
          zipinfo ${{ matrix.artifact }}
          mv ${{ matrix.artifact }} v/
          cd v/
      - name: Create artifact
        if: steps.platform.outputs.supported == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: ${{ matrix.artifact }}

  release-publish:
    if: github.ref == 'refs/heads/master' && github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
    needs: release-build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/download-artifact@v8
      - name: Collect release archives
        id: archives
        shell: bash
        run: |
          {
            echo 'files<<RELEASE_ARCHIVES'
            for archive in windows/v_windows.zip linux/v_linux.zip linux_arm64/v_linux_arm64.zip macos_arm64/v_macos_arm64.zip macos_x86_64/v_macos_x86_64.zip; do
              test -f "$archive"
              echo "$GITHUB_WORKSPACE/$archive"
            done
            if [[ -f windows_arm64/v_windows_arm64.zip ]]; then
              echo "$GITHUB_WORKSPACE/windows_arm64/v_windows_arm64.zip"
            fi
            echo 'RELEASE_ARCHIVES'
          } >> "$GITHUB_OUTPUT"
      - name: Create release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          artifacts: ${{ steps.archives.outputs.files }}
          tag: ${{ inputs.release_tag || github.ref_name }}
          name: ${{ inputs.release_tag || github.ref_name }}
          allowUpdates: true
          replacesArtifacts: true
          artifactErrorsFailBuild: true
          omitBodyDuringUpdate: true
          omitNameDuringUpdate: true
          omitPrereleaseDuringUpdate: true
          draft: false
          prerelease: false
