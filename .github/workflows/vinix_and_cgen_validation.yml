name: Vinix and C generator validation
'on':
  push:
    branches:
      - ci/verify-vinix-and-cgen-20261031
permissions:
  contents: read
concurrency:
  group: vinix-and-cgen-${{ github.ref }}
  cancel-in-progress: true
env:
  VJOBS: '2'
  VFLAGS: ''
jobs:
  vinix-build:
    if: github.ref == 'refs/heads/ci/verify-vinix-and-cgen-20261031'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build V
        run: make -j4 && ./v symlink
      - name: Install dependencies
        run: |
          .github/workflows/disable_azure_mirror.sh
          v retry -- sudo apt update
          v retry -- sudo apt install build-essential -y
      - name: Clone current Vinix
        run: v retry -- git clone --depth=1 --branch master https://github.com/vlang/vinix.git
      - name: Download Vinix kernel dependencies
        run: cd vinix/kernel && v retry -- ./get-deps
      - name: Build the Vinix kernel (debug)
        run: |
          set -e
          cd vinix/kernel
          make PROD=false \
            CFLAGS="-Ulinux -U__linux -U__linux__ -U__gnu_linux__ -D__vinix__ -O2 -g -pipe" \
            V="$(realpath ../../v)"
          make clean
      - name: Build the Vinix kernel (prod)
        run: |
          set -e
          cd vinix/kernel
          make PROD=true \
            CFLAGS="-Ulinux -U__linux -U__linux__ -U__gnu_linux__ -D__vinix__ -O2 -g -pipe" \
            V="$(realpath ../../v)"
          make clean
      - name: Build util-vinix (debug)
        run: |
          set -e
          cd vinix/util-vinix
          make PROD=false \
            VFLAGS="-os vinix -gc none" \
            CFLAGS="-Ulinux -U__linux -U__linux__ -U__gnu_linux__ -D__vinix__ -O2 -g -pipe" \
            V="$(realpath ../../v)"
          make clean
      - name: Build util-vinix (prod)
        run: |
          set -e
          cd vinix/util-vinix
          make PROD=true \
            VFLAGS="-os vinix -gc none" \
            CFLAGS="-Ulinux -U__linux -U__linux__ -U__gnu_linux__ -D__vinix__ -O2 -g -pipe" \
            V="$(realpath ../../v)"
          make clean
  tcc-linux:
    if: github.ref == 'refs/heads/ci/verify-vinix-and-cgen-20261031'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install C generator and diagnostic dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang gobjc libssl-dev \
            libsqlite3-dev libpq-dev libx11-dev libxcursor-dev libxi-dev \
            libxrandr-dev libxinerama-dev libx11-xcb-dev libgl1-mesa-dev \
            libegl1-mesa-dev libgles2-mesa-dev
      - name: Build the combined compiler
        id: build
        run: |
          make -j4
          ./v -version
      - name: Verify nofloat selectors and reachable helpers
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          ./v -new-compiler -no-retry-compilation test \
            vlib/v/compiler_tests/vinix_selector_codegen_test.v \
            vlib/v/markused/reachable_runtime_helpers_test.v \
            vlib/v/transform/prelude_helper_callees_test.v
      - name: Run the complete C generator suite
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: ./v -new-compiler -no-retry-compilation -silent test vlib/v/gen/c/
      - name: Run normal compiler diagnostics
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: ./v -silent vlib/v/compiler_errors_test.v
