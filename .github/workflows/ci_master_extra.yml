name: CI master extra

on:
  push:
    branches: [master]

concurrency:
  group: ci-master-extra-${{ github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bootstrap:
    uses: ./.github/workflows/bootstrapping_ci.yml
    permissions:
      contents: read
      actions: read

  windows-bootstrap-contracts:
    uses: ./.github/workflows/makev_ci.yml
    permissions:
      contents: read

  formatting:
    needs: [bootstrap, windows-bootstrap-contracts]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      VFLAGS: -cc gcc
    outputs:
      periodic_ci: ${{ steps.paths.outputs.periodic_ci }}
      process_regressions_ci: ${{ steps.paths.outputs.process_regressions_ci }}
      puzzle_vibes_ci: ${{ steps.paths.outputs.puzzle_vibes_ci }}
      release_ci: ${{ steps.paths.outputs.release_ci }}
      riscv64_linux_ci: ${{ steps.paths.outputs.riscv64_linux_ci }}
      s390x_linux_ci: ${{ steps.paths.outputs.s390x_linux_ci }}
      sanitized_ci: ${{ steps.paths.outputs.sanitized_ci }}
      sdl_ci: ${{ steps.paths.outputs.sdl_ci }}
      symlink_ci: ${{ steps.paths.outputs.symlink_ci }}
      tccbin_automation_contract: ${{ steps.paths.outputs.tccbin_automation_contract }}
      termux_ci: ${{ steps.paths.outputs.termux_ci }}
      test_selection_ci: ${{ steps.paths.outputs.test_selection_ci }}
      time_ci: ${{ steps.paths.outputs.time_ci }}
      toml_ci: ${{ steps.paths.outputs.toml_ci }}
      tools_ci: ${{ steps.paths.outputs.tools_ci }}
      v_apps_and_modules_compile_ci: ${{ steps.paths.outputs.v_apps_and_modules_compile_ci }}
      vab_ci: ${{ steps.paths.outputs.vab_ci }}
      vinix_ci: ${{ steps.paths.outputs.vinix_ci }}
      vpm_ci: ${{ steps.paths.outputs.vpm_ci }}
      vsl_and_vtl_compile_ci: ${{ steps.paths.outputs.vsl_and_vtl_compile_ci }}
      vup_works: ${{ steps.paths.outputs.vup_works }}
      wasm_backend_ci: ${{ steps.paths.outputs.wasm_backend_ci }}
      websockets_ci: ${{ steps.paths.outputs.websockets_ci }}
      windows_ci_gcc: ${{ steps.paths.outputs.windows_ci_gcc }}
      windows_ci_msvc: ${{ steps.paths.outputs.windows_ci_msvc }}
      windows_ci_tcc: ${{ steps.paths.outputs.windows_ci_tcc }}
      workflow_lint: ${{ steps.paths.outputs.workflow_lint }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Build V for formatting
        run: make -j4 && ./v symlink
      - name: Check code formatting
        run: |
          ./v -silent test-cleancode
          ./v -silent test-fmt
      - name: Select suites using the original push path filters
        id: paths
        env:
          CI_BEFORE: ${{ github.event.before }}
          CI_AFTER: ${{ github.sha }}
        run: python3 .github/workflows/ci_gate_paths.py extra

  periodic_ci:
    needs: formatting
    if: needs.formatting.outputs.periodic_ci == 'true'
    uses: ./.github/workflows/periodic_ci.yml
    permissions:
      contents: read
    secrets: inherit

  process_regressions_ci:
    needs: formatting
    if: needs.formatting.outputs.process_regressions_ci == 'true'
    uses: ./.github/workflows/process_regressions_ci.yml
    permissions:
      contents: read
    secrets: inherit

  puzzle_vibes_ci:
    needs: formatting
    if: needs.formatting.outputs.puzzle_vibes_ci == 'true'
    uses: ./.github/workflows/puzzle_vibes_ci.yml
    permissions:
      contents: read
    secrets: inherit

  release_ci:
    needs: formatting
    if: needs.formatting.outputs.release_ci == 'true'
    uses: ./.github/workflows/release_ci.yml
    permissions:
      contents: write
    secrets: inherit

  riscv64_linux_ci:
    needs: formatting
    if: needs.formatting.outputs.riscv64_linux_ci == 'true'
    uses: ./.github/workflows/riscv64_linux_ci.yml
    permissions:
      contents: read
      packages: write
    secrets: inherit

  s390x_linux_ci:
