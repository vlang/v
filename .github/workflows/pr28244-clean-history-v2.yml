name: Clean PR 28244 repair history v2

on:
  push:
    branches:
      - v3-ownership-toml-value-copy

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: clean-pr-28244-history
  cancel-in-progress: true

jobs:
  clean:
    if: contains(github.event.head_commit.message, '[cleanup-pr-28244]')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PR_BRANCH: v3-ownership-toml-value-copy
      TEST_COMMIT_SUBJECT: v3: organize borrowed ownership regressions by context
      SOURCE_COMMIT_SUBJECT: v3: model borrowed owned-value copies explicitly
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wait for the validated semantic commits
        id: locate
        shell: bash
        run: |
          set -euxo pipefail
          target=''
          for _ in $(seq 1 240); do
            git fetch --force origin \
              "refs/heads/${PR_BRANCH}:refs/remotes/origin/${PR_BRANCH}"
            target=$(git log "origin/${PR_BRANCH}" --format='%H' \
              --grep="^${TEST_COMMIT_SUBJECT}$" -1 || true)
            if [ -n "$target" ]; then
              break
            fi
            sleep 30
          done
          test -n "$target"
          source_commit=$(git rev-parse "${target}^")
          test "$(git log -1 --format='%s' "$source_commit")" = "$SOURCE_COMMIT_SUBJECT"
          test "$(git log -1 --format='%s' "$target")" = "$TEST_COMMIT_SUBJECT"
          git cat-file -e "${target}:vlib/v3/tests/ownership_borrowed_projection_error_test.v"
          git cat-file -e "${target}:vlib/v3/tests/ownership_borrowed_projection_review_test.v"
          git cat-file -e "${target}:vlib/v3/tests/ownership_toml_decode_test.v"
          git cat-file -e "${target}:vlib/v3/tests/testdata/ownership_borrowed_projection/assignments.v.txt"
          git cat-file -e "${target}:vlib/v3/types/checker_ownership_d_ownership.v"
          git cat-file -e "${target}:vlib/v3/transform/array.v"
          if git cat-file -e "${target}:.github/workflows/repair-pr-28244.yml" 2>/dev/null; then
            echo 'temporary repair workflow leaked into semantic commit' >&2
            exit 1
          fi
          echo "target=$target" >> "$GITHUB_OUTPUT"

      - name: Publish exactly the semantic history
        shell: bash
        run: |
          set -euxo pipefail
          target='${{ steps.locate.outputs.target }}'
          git diff --check "${target}^" "$target"
          git push --force origin "${target}:refs/heads/${PR_BRANCH}"
          gh pr comment 28244 --body "Validated repair published as two semantic commits. Final head: \`${target}\`. Temporary repair workflows and CI markers were removed from the branch history."
        env:
          GH_TOKEN: ${{ github.token }}
