name: toml CI

on:
  push:
    branches:
      - master
    paths:
      - 'vlib/**'
      - '.github/actions/setup-v/**'
      - '**/toml_ci.yml'
      - '!**.md'
  pull_request:
    paths:
      - 'vlib/**'
      - '.github/actions/setup-v/**'
      - '**/toml_ci.yml'
      - '!**.md'

concurrency:
  group: toml-${{ github.workflow }}-${{ github.ref == 'refs/heads/master' && github.sha || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  toml-module-pass-external-test-suites:
    runs-on: ubuntu-latest
    env:
      # Stop a failing test session at its first failure instead of
      # running the whole suite to completion; the remaining files
      # add no signal.
      VTEST_FAIL_FAST: '1'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        id: uses_checkout_v7
        with:
          persist-credentials: false
      - name: Cache V toolchain
        if: ${{ success() && !cancelled() && steps.uses_checkout_v7.outcome == 'success' }}
        id: cache-v
        uses: actions/cache@v6
        with:
          path: |
            v
            thirdparty/tcc
          key: v-toml-${{ runner.os }}-${{ hashFiles('cmd/v/**', '!cmd/v/**/*_test*.v', 'cmd/tools/select_linux_tcc.sh', 'cmd/tools/git_argv.sh', 'cmd/tools/detect_tcc.v', 'vlib/**', '!vlib/toml/**', '!vlib/**/*_test*.v', '!vlib/**/tests/**', '!vlib/**/testdata/**', '!vlib/v/slow_tests/**', 'thirdparty/**', 'GNUmakefile', 'Makefile', '.github/actions/setup-v/**', '.github/workflows/toml_ci.yml') }}
      - uses: ./.github/actions/setup-v
        if: steps.cache-v.outputs.cache-hit != 'true'
        with:
          symlink: false
      - name: Register problem matchers
        if: steps.cache-v.outputs.cache-hit == 'true'
        run: ./v run .github/problem-matchers/register_all.vsh
      - name: Symlink V
        id: symlink_v
        if: ${{ success() && !cancelled() && steps.cache-v.outcome == 'success' }}
        run: ./v symlink
      - name: Install dependencies
        id: install_dependencies
        if: ${{ success() && !cancelled() && steps.symlink_v.outcome == 'success' }}
        run: |
          v retry -- v download https://github.com/jqlang/jq/releases/download/jq-1.6/jq-linux64
          sudo chmod 755 jq-linux64
          sudo mv jq-linux64 /usr/bin/jq

      - name: Show JQ Version
        id: show_jq_version
        if: ${{ success() && !cancelled() && steps.install_dependencies.outcome == 'success' }}
        run: jq --version

      - name: Download more TOML testsuits
        id: download_more_toml_testsuits
        if: ${{ success() && !cancelled() && steps.show_jq_version.outcome == 'success' }}
        run: .github/workflows/download_full_toml_test_suites.sh

      - name: Run TOML tests
        id: run_toml_tests
        if: ${{ success() && !cancelled() && steps.download_more_toml_testsuits.outcome == 'success' }}
        run: VTEST_TOML_DO_YAML_CONVERSION=1 VTEST_TOML_DO_LARGE_FILES=1 ./v test vlib/toml
