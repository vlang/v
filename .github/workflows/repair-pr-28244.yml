name: Repair PR 28244

on:
  push:
    branches:
      - v3-ownership-toml-value-copy

permissions:
  contents: write

concurrency:
  group: repair-pr-28244
  cancel-in-progress: true

jobs:
  repair:
    if: contains(github.event.head_commit.message, '[repair-pr-28244]')
    runs-on: [self-hosted, macOS, gitly-ci]
    timeout-minutes: 180
    env:
      ORIGINAL_BASE: cbf4e8509630da710d04cc9fd0f777761ebe55a7
      ORIGINAL_HEAD: 2a6677b34d621f7b44e48c73ad773180aa9d8ea8
      PR_BRANCH: v3-ownership-toml-value-copy
    steps:
      - name: Check out the repair trigger
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Rebuild the branch on current master
        shell: bash
        run: |
          set -euxo pipefail
          cat .github/pr28244-repair/*.py.part > /tmp/repair_pr_28244.py
          git fetch origin master
          git diff --binary "$ORIGINAL_BASE" "$ORIGINAL_HEAD" > /tmp/pr-28244.patch
          git checkout -B repaired origin/master
          git apply --3way --index --whitespace=nowarn /tmp/pr-28244.patch
          git reset
          REPO_ROOT="$GITHUB_WORKSPACE" python3 /tmp/repair_pr_28244.py
          git status --short

      - name: Bootstrap V
        shell: bash
        run: |
          set -euxo pipefail
          make -j2

      - name: Format the changed V sources
        shell: bash
        run: |
          set -euxo pipefail
          files=(
            vlib/v3/tests/ownership_borrowed_projection_error_test.v
            vlib/v3/tests/ownership_borrowed_projection_review_test.v
            vlib/v3/tests/ownership_toml_decode_test.v
            vlib/v3/transform/array.v
            vlib/v3/transform/fn.v
            vlib/v3/transform/fn_test.v
            vlib/v3/transform/if.v
            vlib/v3/transform/interface.v
            vlib/v3/transform/map.v
            vlib/v3/transform/or.v
            vlib/v3/transform/return.v
            vlib/v3/transform/struct.v
            vlib/v3/transform/transform.v
            vlib/v3/transform/transform_parallel_test.v
            vlib/v3/types/checker_ownership_alias_test.v
            vlib/v3/types/checker_ownership_d_ownership.v
            vlib/v3/types/checker_ownership_notd_ownership.v
          )
          for file in "${files[@]}"; do
            ./v fmt -w "$file"
          done

      - name: Build the ownership compiler
        shell: bash
        run: |
          set -euxo pipefail
          ./v -nocache -gc none -d ownership \
            -path "$PWD/vlib|@vlib|@vmodules" \
            -o /tmp/v3-pr-28244 vlib/v3/v3.v

      - name: Run focused ownership and TOML tests
        shell: bash
        run: |
          set -euxo pipefail
          ./v test vlib/v3/tests/ownership_borrowed_projection_review_test.v
          ./v test vlib/v3/tests/ownership_borrowed_projection_error_test.v
          ./v test vlib/v3/tests/ownership_toml_decode_test.v
          ./v test vlib/v3/tests/ownership/ownership_test.v
          ./v test vlib/v3/types/checker_ownership_alias_test.v
          ./v test vlib/v3/transform/fn_test.v
          ./v test vlib/v3/transform/transform_parallel_test.v
          ./v test vlib/v3/tests/type_checker_errors_test.v
          ./v test vlib/toml/
          ./v -nocache -gc none -path "$PWD/vlib|@vlib|@vmodules" \
            -o /tmp/v3-pr-28244-no-ownership vlib/v3/v3.v

      - name: Create semantic commits and publish the repaired head
        shell: bash
        run: |
          set -euxo pipefail
          git diff --check
          git config user.name "OpenAI Codex"
          git config user.email "codex@openai.com"
          git reset

          git add \
            vlib/v3/transform/array.v \
            vlib/v3/transform/fn.v \
            vlib/v3/transform/if.v \
            vlib/v3/transform/interface.v \
            vlib/v3/transform/map.v \
            vlib/v3/transform/or.v \
            vlib/v3/transform/return.v \
            vlib/v3/transform/struct.v \
            vlib/v3/transform/transform.v \
            vlib/v3/types/checker_ownership_d_ownership.v \
            vlib/v3/types/checker_ownership_notd_ownership.v
          git commit -m "v3: model borrowed owned-value copies explicitly"

          git add \
            vlib/v3/tests/ownership_borrowed_projection_error_test.v \
            vlib/v3/tests/ownership_borrowed_projection_review_test.v \
            vlib/v3/tests/ownership_toml_decode_test.v \
            vlib/v3/transform/fn_test.v \
            vlib/v3/transform/transform_parallel_test.v \
            vlib/v3/types/checker_ownership_alias_test.v
          git commit -m "v3: organize borrowed ownership regressions by context"

          test -z "$(git status --porcelain)"
          git log --oneline --decorate -4
          final_sha=$(git rev-parse HEAD)
          staging_branch=pr-28244-repair-staging
          echo "Final repaired SHA: $final_sha" >> "$GITHUB_STEP_SUMMARY"
          git push --force origin "HEAD:refs/heads/${staging_branch}"

          # The connected GitHub client advances the PR branch so the resulting push is made
          # by a normal repository credential and triggers the repository's standard PR CI.
          # Keep this job alive long enough to remove the staging ref after that handoff.
          for ((i = 0; i < 360; i++)); do
            current=$(git ls-remote origin "refs/heads/${PR_BRANCH}" | awk '{print $1}')
            if [[ "$current" == "$final_sha" ]]; then
              git push origin --delete "$staging_branch"
              exit 0
            fi
            sleep 5
          done
          echo "PR branch was not advanced to $final_sha" >&2
          exit 1
