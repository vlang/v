name: Legacy VRACE runtime diagnostic
on:
  pull_request:
    paths:
      - '.github/workflows/legacy_vrace_runtime_ci.yml'
      - 'vlib/builtin/race_options.c'
      - 'vlib/v/driver/race.v'
      - 'vlib/v/slow_tests/race_detector_test.v'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  legacy:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container:
      image: thevlang/vlang:ubuntu-build
      env:
        V_CI_UBUNTU_MUSL: 1
        V_CI_MUSL: 1
        VFLAGS: -cc musl-gcc -gc none -d use_bundled_libgc
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build original legacy V compiler
        run: |
          set -eu
          git config --global --add safe.directory "$(pwd -P)"
          make -j4
          ./v -prod -cg -o v cmd/v
      - name: Capture native hook capabilities and original runtime behavior
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/legacy-vrace"
          mkdir -p "$out"
          printf 'VFLAGS=%s\nVRACE=%s\nTSAN_OPTIONS=%s\n' "$VFLAGS" "${VRACE-<unset>}" "${TSAN_OPTIONS-<unset>}" | tee "$out/options.txt"
          cat /etc/os-release | tee "$out/os.txt"
          cat > "$out/hook.c" <<'C'
          #include <stdio.h>
          extern const char *__tsan_default_options(void);
          int main(void) { puts(__tsan_default_options()); return 0; }
          C
          for cc in clang gcc musl-gcc; do
            if ! command -v "$cc"; then
              echo "$cc unavailable" | tee "$out/$cc.unavailable"
              continue
            fi
            "$cc" --version | tee "$out/$cc.version"
            rc=0
            "$cc" -fsanitize=thread -dM -E vlib/builtin/race_options.c > "$out/$cc.macros" 2> "$out/$cc.preprocess.log" || rc=$?
            echo "$cc preprocess exit=$rc" | tee "$out/$cc.preprocess.status"
            cat "$out/$cc.preprocess.log"
            grep -E 'V_RACE_(NO_INSTRUMENTATION|TSAN)|__SANITIZE_THREAD__|__clang_(major|minor)__|__GNUC__' "$out/$cc.macros" || true
            rc=0
            "$cc" -std=gnu11 -O2 -fsanitize=thread vlib/builtin/race_options.c "$out/hook.c" -o "$out/$cc-hook" > "$out/$cc.build.log" 2>&1 || rc=$?
            echo "$cc hook build exit=$rc" | tee "$out/$cc.build.status"
            cat "$out/$cc.build.log"
            if [ "$rc" -eq 0 ]; then
              nm "$out/$cc-hook" | grep -E '__tsan_default_options|v_race_getenv|v_race_proc_environ' | tee "$out/$cc.symbols" || true
              rc=0
              env -u TSAN_OPTIONS VRACE='exitcode=7 atexit_sleep_ms=0' "$out/$cc-hook" > "$out/$cc.hook.log" 2>&1 || rc=$?
              echo "$cc hook execution exit=$rc" | tee "$out/$cc.hook.status"
              cat "$out/$cc.hook.log"
            fi
          done
          cat > "$out/racy.v" <<'V'
          struct Counter {
          mut:
              n int
          }
          fn inc(mut c Counter) {
              for _ in 0 .. 1000 {
                  c.n++
              }
          }
          fn main() {
              mut c := &Counter{}
              t1 := spawn inc(mut c)
              t2 := spawn inc(mut c)
              t1.wait()
              t2.wait()
              println('joined ${c.n > 0}')
          }
          V
          # vtest-self.v extracts the outer flags then unsets VFLAGS before
          # starting tests. Match that environment for nested race builds.
          # The outer test itself is still compiled with musl-gcc.
          build_rc=0
          env -u VFLAGS ./v -race -showcc -show-c-output -keepc -no-retry-compilation -o "$out/racy" "$out/racy.v" > "$out/v-build.log" 2>&1 || build_rc=$?
          echo "V race build exit=$build_rc"
          cat "$out/v-build.log"
          bad=0
          if [ "$build_rc" -eq 0 ]; then
            nm "$out/racy" | grep -E '__tsan_default_options|v_race_getenv|v_race_proc_environ' | tee "$out/v.symbols" || true
            ldd "$out/racy" > "$out/v.ldd" 2>&1 || true
            cat "$out/v.ldd"
            for mode in default vrace tsan both; do
              rc=0
              case "$mode" in
                default) expected=66; env -u VRACE -u TSAN_OPTIONS "$out/racy" > "$out/$mode.log" 2>&1 || rc=$? ;;
                vrace) expected=7; env -u TSAN_OPTIONS VRACE='exitcode=7 atexit_sleep_ms=0' "$out/racy" > "$out/$mode.log" 2>&1 || rc=$? ;;
                tsan) expected=8; env -u VRACE TSAN_OPTIONS='exitcode=8 atexit_sleep_ms=0' "$out/racy" > "$out/$mode.log" 2>&1 || rc=$? ;;
                both) expected=8; env VRACE='exitcode=7 atexit_sleep_ms=0' TSAN_OPTIONS='exitcode=8 atexit_sleep_ms=0' "$out/racy" > "$out/$mode.log" 2>&1 || rc=$? ;;
              esac
              echo "$mode actual=$rc expected=$expected" | tee "$out/$mode.status"
              cat "$out/$mode.log"
              if [ "$rc" -ne "$expected" ] || ! grep -Fq 'WARNING: ThreadSanitizer: data race' "$out/$mode.log" || ! grep -Fq 'joined true' "$out/$mode.log"; then bad=1; fi
            done
          else
            bad=1
          fi
          original_rc=0
          env -u VFLAGS ./v -cc musl-gcc -gc none -d use_bundled_libgc -silent vlib/v/slow_tests/race_detector_test.v > "$out/original.log" 2>&1 || original_rc=$?
          echo "original test exit=$original_rc"
          cat "$out/original.log"
          # A capability skip is not a passing original race regression.
          if grep -Fq 'skipping:' "$out/original.log"; then bad=1; fi
          test "$original_rc" -eq 0
          test "$bad" -eq 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: legacy-vrace-native-evidence
          path: ${{ runner.temp }}/legacy-vrace
