name: CI Termux

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths-ignore:
      - '**.md'
      - '**.yml'
      - '!**/termux_ci.yml'
      - 'cmd/tools/**'
      - '!cmd/tools/builders/**.v'

concurrency:
  group: termux-${{ github.workflow }}-${{ github.ref == 'refs/heads/master' && github.sha || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  termux-build:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build and test in Termux
        run: |
          set -o xtrace
          echo "$PWD"
          whoami
          touch outside_docker.txt
          git log -n4
          echo "running docker ..."
          docker run --rm --mount type=bind,source=/home/runner/work/v/v,destination=/src -w /src termux/termux-docker:latest bash -c '
            set -o xtrace
            echo "running inside docker"
            whoami
            cp -r /src ~/vproject; cd ~/vproject
            touch inside_docker.txt
            ls -la
            echo "previous TERMUX_VERSION: $TERMUX_VERSION"
            export TERMUX_VERSION=0.118.3
            echo "explicit TERMUX_VERSION: $TERMUX_VERSION"
            bash .github/workflows/retry.sh pkg update -y
            bash .github/workflows/retry.sh pkg install -y clang libexecinfo libgc libgc-static make git
            git log -n4
            VFLAGS="-cc cc" make
            ./v symlink
            export PATH="$HOME/.local/bin:/usr/local/bin:$PATH"
            v run examples/hello_world.v
            v run examples/primes.v
            termux_probe="$(mktemp)"
            printf "%s\n" "import os" "dump(os.user_os())" > "$termux_probe"
            v run "$termux_probe"
          '

  termux-build-arm64-tcc:
    if: github.ref == 'refs/heads/master'
    # Diagnostic job for vlang/v#27207: reproduces the Termux/AArch64 tcc
    # bootstrap failure on a real arm64 runner so we can collect logs without
    # local hardware. Allowed to fail until the upstream tcc AArch64 bug is
    # resolved.
    runs-on: ubuntu-24.04-arm
    continue-on-error: true
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build in Termux (arm64, default tcc)
        run: |
          set -o xtrace
          uname -a
          # The container runs as a non-root user that cannot write to the
          # runner-owned checkout mounted at /src, so the log gets its own
          # world-writable bind mount.
          mkdir -p "$RUNNER_TEMP/termux-logs"
          chmod 777 "$RUNNER_TEMP/termux-logs"
          docker run --rm --platform=linux/arm64 --mount type=bind,source=/home/runner/work/v/v,destination=/src --mount type=bind,source="$RUNNER_TEMP/termux-logs",destination=/logs -w /src termux/termux-docker:aarch64 bash -c '
            set -o xtrace
            uname -a
            cp -r /src ~/vproject; cd ~/vproject
            export TERMUX_VERSION=0.118.3
            bash .github/workflows/retry.sh pkg update -y
            bash .github/workflows/retry.sh pkg install -y clang libexecinfo libgc libgc-static make git gdb file
            git log -n4
            ulimit -c unlimited || true
            # Explicit `-cc tcc` is required: on Linux arm64 the Makefile
            # otherwise injects `-cc "$(CC)"` (see GNUmakefile:149-155) and
            # the bundled tcc path would never run — defeating the purpose
            # of this diagnostic job for #27207. The ANDROID block in the
            # Makefile applies the same override under Termux, so opt out
            # of it here (V_ANDROID_TCC=1) to keep tcc under test.
            # Capture every invocation via -showcc and the full build
            # output to build.log.
            export V_ANDROID_TCC=1
            set +e
            VFLAGS="-cc tcc -showcc -stats" make 2>&1 | tee build.log
            rc=${PIPESTATUS[0]}
            set -e
            echo "make exit code: $rc"
            # Always copy the log back to the bind-mounted dir so the runner
            # step that uploads the artifact can find it.
            cp build.log /logs/build.log || true
            if [ "$rc" -ne 0 ] || [ ! -x ./v ]; then
              echo "===== bootstrap failed; collecting diagnostics ====="
              echo "--- tcc binary ---"
              ls -la thirdparty/tcc/ 2>/dev/null || true
              for t in thirdparty/tcc/tcc.exe thirdparty/tcc/tcc; do
                if [ -x "$t" ]; then "$t" -v || true; fi
              done
              echo "--- last 120 lines of build.log ---"
              tail -n 120 build.log || true
              echo "--- v1/v2/v file info ---"
              file v1 v2 v 2>/dev/null || true
              echo "--- last tcc invocations from build.log ---"
              grep -E "tcc(\.exe)? " build.log | tail -n10 || true
              echo "--- core files (if any) ---"
              ls -la core* 2>/dev/null || true
              for c in core core.*; do
                if [ -f "$c" ] && [ -x ./v2 ]; then
                  echo "--- gdb backtrace from $c against v2 ---"
                  gdb --batch --ex bt --ex "info registers" ./v2 "$c" || true
                fi
              done
              # If make exited 0 but ./v is missing, force a nonzero exit so
              # the diagnostic job does not go green without a usable compiler.
              if [ "$rc" -eq 0 ]; then rc=1; fi
              exit "$rc"
            fi
            echo "===== bootstrap succeeded ====="
            ./v -version
            ./v run examples/hello_world.v
          '
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: termux-arm64-build-log
          path: ${{ runner.temp }}/termux-logs/build.log
          if-no-files-found: ignore

  termux-tcc-bionic:
    # Builds tcc from the tinycc `mob` branch inside Termux (bionic libc,
    # aarch64), then runs hello_world with that tcc. Manual trigger only.
    # The tcc install is uploaded so it can be published to vlang/tccbin
    # once this passes.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build tcc and run hello_world in Termux (arm64)
        run: |
          set -o xtrace
          mkdir -p "$RUNNER_TEMP/termux-logs"
          chmod 777 "$RUNNER_TEMP/termux-logs"
          docker run --rm --platform=linux/arm64 --mount type=bind,source=/home/runner/work/v/v,destination=/src --mount type=bind,source="$RUNNER_TEMP/termux-logs",destination=/logs -w /src termux/termux-docker:aarch64 bash -c '
            set -e
            set -o pipefail
            set -o xtrace
            uname -a
            cp -r /src ~/vproject; cd ~/vproject
            export TERMUX_VERSION=0.118.3
            bash .github/workflows/retry.sh pkg update -y
            bash .github/workflows/retry.sh pkg install -y clang make git libgc libgc-static
            bash .github/workflows/retry.sh git clone --depth 1 -b mob https://repo.or.cz/tinycc.git ~/tinycc
            cd ~/tinycc
            git log -n1 --format=%H
            echo "HOME=$HOME PWD=$PWD PREFIX=$PREFIX"
            ls -la ~/tinycc
            # tcc does not predefine the stdint limit macros that bionic stdint.h
            # expands, so mbedtls base64.c fails with '__SIZE_MAX__' undeclared and
            # V falls back to cc. Add the 64-bit set to tccdefs.h, the predefines
            # every tcc compile reads. The values are for an LP64 target like aarch64.
            printf "%s\n" "#define __SIZE_MAX__ 0xffffffffffffffffUL" "#define __UINTPTR_MAX__ 0xffffffffffffffffUL" "#define __INTPTR_MAX__ 0x7fffffffffffffffL" "#define __PTRDIFF_MAX__ 0x7fffffffffffffffL" "#define __INTMAX_MAX__ 0x7fffffffffffffffL" "#define __UINTMAX_MAX__ 0xffffffffffffffffUL" "#define __INT64_MAX__ 0x7fffffffffffffffL" "#define __UINT64_MAX__ 0xffffffffffffffffUL" "#define __INT32_MAX__ 0x7fffffffL" "#define __UINT32_MAX__ 0xffffffffU" "#define __INT16_MAX__ 0x7fff" "#define __UINT16_MAX__ 0xffff" "#define __INT8_MAX__ 0x7f" "#define __UINT8_MAX__ 0xff" >> include/tccdefs.h
            # Termux has no /bin/sh, so run configure and make with $PREFIX/bin/sh.
            sh ./configure --cc=clang --prefix="$HOME/tcc-install" \
              --crtprefix="$PREFIX/lib" \
              --libpaths="{B}:$PREFIX/lib:/system/lib64" \
              --sysincludepaths="{B}/include:$PREFIX/include:$PREFIX/include/aarch64-linux-android" \
              --elfinterp=/system/bin/linker64
            # bionic sys/cdefs.h rejects an unversioned target triple unless
            # __ANDROID_MIN_SDK_VERSION__ is set, and the tcc lib build is the
            # first place that includes it. Do not put apostrophes in this
            # block: it is inside a single-quoted bash -c string.
            pwd
            ls -la
            # Dry run: prints the commands make would run, saved to the log.
            # The lib/ build compiles its objects with tcc and takes its flags
            # from XFLAGS, not CFLAGS. Command-line XFLAGS replaces the lib
            # makefile value, so it also sets the -B and -I paths it normally
            # sets. This drops the -bt that lib makes add to bcheck.o.
            lib_xflags="XFLAGS=-B.. -I.. -D__ANDROID_MIN_SDK_VERSION__=24"
            make -n -j2 SHELL="$PREFIX/bin/sh" CFLAGS="-O2 -D__ANDROID_MIN_SDK_VERSION__=24" "$lib_xflags" > /logs/make-dry-run.log 2>&1 || true
            head -n 60 /logs/make-dry-run.log
            make -j2 SHELL="$PREFIX/bin/sh" CFLAGS="-O2 -D__ANDROID_MIN_SDK_VERSION__=24" "$lib_xflags"
            make install SHELL="$PREFIX/bin/sh" CFLAGS="-O2 -D__ANDROID_MIN_SDK_VERSION__=24" "$lib_xflags"
            echo "HOME=$HOME PWD=$PWD PREFIX=$PREFIX"
            ls -la "$HOME/tcc-install" || true
            ls -la "$HOME/tcc-install/bin" || true
            # The tcc binary rpath points at $PREFIX/lib, not the install lib
            # directory where libtcc.so went, so bionic cannot find libtcc.so.
            # Put the install lib directory on the search path for tcc and for
            # the V bootstrap that runs it.
            export LD_LIBRARY_PATH="$HOME/tcc-install/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
            tcc="$HOME/tcc-install/bin/tcc"
            "$tcc" -v
            cd ~/vproject
            # Bootstrap V with the tcc under test, not the Termux clang the
            # ANDROID block would otherwise force (V_ANDROID_TCC=1 opts out).
            # The Makefile only recognises a literal `-cc tcc`, so put the
            # built tcc first on PATH.
            export PATH="$HOME/tcc-install/bin:$PATH"
            # Diagnostic only: bionic headers need __ANDROID_MIN_SDK_VERSION__ on
            # every tcc compile, and V does not add it. Passing it here lets tcc
            # compile the C output of V. Users would need the same flag or a V change.
            tcc_cflags="-cflags -D__ANDROID_MIN_SDK_VERSION__=24"
            V_ANDROID_TCC=1 VFLAGS="-cc tcc $tcc_cflags" make 2>&1 | tee /logs/v-bootstrap.log
            ./v -cc "$tcc" $tcc_cflags run examples/hello_world.v 2>&1 | tee /logs/hello_world.log
            # The step that builds v2 runs the vc snapshot compiler v1, which
            # predates the driver fix, so its fallback warning is expected. Fail
            # only on a fallback in the hello_world run, which uses the final ./v.
            if grep -q "falling back" /logs/hello_world.log; then
              echo "tcc was not used: V fell back to cc"
              exit 1
            fi
            # net.http check: a real HTTPS request, so the TLS path is built and
            # run with tcc. Double quotes only, since this is a single-quoted bash -c string.
            printf "%s\n" "import net.http" "fn main() {" "    resp := http.get(\"https://example.com/\") or { panic(err) }" "    assert resp.status_code == 200" "    println(\"net.http ok\")" "}" > net_http_check.v
            ./v -cc "$tcc" $tcc_cflags run net_http_check.v 2>&1 | tee /logs/net_http.log
            if grep -q "falling back" /logs/net_http.log; then
              echo "tcc was not used for net.http: V fell back to cc"
              exit 1
            fi
            grep -q "net.http ok" /logs/net_http.log
            tar -C "$HOME" -czf /logs/tcc-install-aarch64-termux.tar.gz tcc-install
          '
      - name: Upload tcc build and log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: termux-arm64-tcc-bionic
          path: ${{ runner.temp }}/termux-logs/
          if-no-files-found: ignore
