name: Global shadow diagnostic scope

on:
  pull_request:
    paths:
      - 'vlib/v/tests/global_shadow_diagnostic_scope_test.v'
      - 'vlib/v/tests/sizeof_module_global_28888/**'
      - 'vlib/v/gen/c/cleanc.v'
      - '.github/workflows/global_shadow_diagnostic_ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Prepare tool cache
        run: .\.github\workflows\setup_windows_tool_cache.ps1
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        with:
          arch: x64
      - uses: ./.github/actions/setup-v
        with:
          symlink: 'false'
      - name: Run the original diagnostic suite
        shell: pwsh
        run: |
          .\v.exe fmt -verify vlib/v/tests/global_shadow_diagnostic_scope_test.v
          if ($LASTEXITCODE -ne 0) { throw "Format verification failed" }
          foreach ($cc in @('tcc', 'gcc', 'msvc')) {
            .\v.exe -cc $cc -no-retry-compilation -silent -enable-globals vlib/v/tests/global_shadow_diagnostic_scope_test.v
            if ($LASTEXITCODE -ne 0) { throw "$cc diagnostic regression failed" }
          }
      - name: Run original cached module global regression
        shell: pwsh
        run: |
          foreach ($cc in @('gcc', 'msvc', 'tcc')) {
            .\v.exe -cc $cc -silent -enable-globals vlib/v/tests/sizeof_module_global_28888/sizeof_module_global_28888_test.v
            if ($LASTEXITCODE -ne 0) { throw "$cc module global regression failed" }
          }
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-v
        with:
          symlink: 'false'
      - name: Verify formatting and run the original diagnostic suite
        run: |
          ./v fmt -w vlib/v/tests/global_shadow_diagnostic_scope_test.v
          git diff --exit-code
          ./v fmt -verify vlib/v/tests/global_shadow_diagnostic_scope_test.v
          ./v -cc gcc -silent -enable-globals vlib/v/tests/global_shadow_diagnostic_scope_test.v
          ./v -cc clang -silent -enable-globals vlib/v/tests/global_shadow_diagnostic_scope_test.v

      - name: Run original cached module global regression
        run: |
          ./v -cc gcc -silent -enable-globals vlib/v/tests/sizeof_module_global_28888/sizeof_module_global_28888_test.v
          ./v -cc clang -silent -enable-globals vlib/v/tests/sizeof_module_global_28888/sizeof_module_global_28888_test.v
