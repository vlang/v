name: Apply PR 28242 review fixes

on:
  push:
    branches:
      - fix-master-ci-batch-7-array-runtime

permissions:
  contents: write

jobs:
  apply-fixes:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-master-ci-batch-7-array-runtime
          fetch-depth: 0
      - name: Apply analyzer fixes and regressions
        shell: bash
        run: |
          python3 .github/pr28242_apply.py
          rm -f .github/pr28242_apply.py .github/workflows/pr28242-review-fixes.yml
          git diff --check
          git config user.name "OpenAI Codex"
          git config user.email "codex@openai.com"
          git add -A
          git commit -m "v3: preserve pointer origins across alternate exits"
          git push origin HEAD:fix-master-ci-batch-7-array-runtime
