name: Shy and PV CI

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - 'vlib/v/checker/**.v'
      - 'vlib/v/gen/c/**.v'
      - 'thirdparty/**'
      - 'cmd/tools/builders/**.v'
      - 'cmd/tools/vshader.v'
      - '**/puzzle_vibes_ci.yml'
      - '!**_test.v'
      - '!**.md'
  pull_request:
    paths:
      - 'vlib/v/checker/**'
      - 'vlib/v/gen/c/**'
      - 'thirdparty/**'
      - 'cmd/tools/builders/**.v'
      - 'cmd/tools/vshader.v'
      - '**/puzzle_vibes_ci.yml'
      - '!**_test.v'
      - '!**.md'

concurrency:
  group: puzzle_vibes-${{ github.workflow }}-${{ github.ref == 'refs/heads/master' && github.sha || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  v-compiles-puzzle-vibes:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        id: uses_checkout_v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/cache-apt-packages-action
        id: uses_cache_apt_packages_action
        if: ${{ success() && !cancelled() && steps.uses_checkout_v7.outcome == 'success' }}

      - name: Build V
        id: build_v
        if: ${{ success() && !cancelled() && steps.uses_cache_apt_packages_action.outcome == 'success' }}
        run: make && ./v symlink

      - name: Install & Setup SDL
        id: install_setup_sdl
        if: ${{ success() && !cancelled() && steps.build_v.outcome == 'success' }}
        run: v retry -- v install sdl && v ~/.vmodules/sdl/setup.vsh

      - name: Install Shy
        id: install_shy
        if: ${{ success() && !cancelled() && steps.install_setup_sdl.outcome == 'success' }}
        run: v retry -- v install https://github.com/medvednikov/shy

      - name: Clone Puzzle Vibes
        id: clone_puzzle_vibes
        if: ${{ success() && !cancelled() && steps.install_shy.outcome == 'success' }}
        run: v retry -- git clone https://github.com/medvednikov/puzzle_vibes/

      - name: Check PV compiles with -g
        id: check_pv_compiles_with_g
        if: ${{ success() && !cancelled() && steps.clone_puzzle_vibes.outcome == 'success' }}
        run: cd puzzle_vibes && v -g .

      - name: Check PV compiles
        id: check_pv_compiles
        if: ${{ success() && !cancelled() && steps.check_pv_compiles_with_g.outcome == 'success' }}
        run: cd puzzle_vibes && v .

      - name: Check PV compiles with -prod
        id: check_pv_compiles_with_prod
        if: ${{ success() && !cancelled() && steps.check_pv_compiles.outcome == 'success' }}
        run: cd puzzle_vibes && v -prod    -no-prod-options .

      - name: Check PV compiles with -prod and -g
        id: check_pv_compiles_with_prod_and_g
        if: ${{ success() && !cancelled() && steps.check_pv_compiles_with_prod.outcome == 'success' }}
        run: cd puzzle_vibes && v -prod -g -no-prod-options .
