name: Shy and PV CI

on:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: puzzle_vibes-puzzle_vibes_ci-${{ github.ref == 'refs/heads/master' && github.sha || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  v-compiles-puzzle-vibes:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/cache-apt-packages-action

      - name: Build V
        uses: ./.github/actions/setup-v

      # The apt cache action may restore an empty archive while reporting success.
      # Ensure the dependencies in its SDL profile before invoking setup.vsh.
      - name: Ensure SDL development dependencies
        run: ./v retry -- sudo apt install --quiet -y libsdl2-dev libsdl2-ttf-dev libsdl2-mixer-dev libsdl2-image-dev libsdl2-net-dev libpng-dev libsamplerate0-dev

      - name: Install & Setup SDL
        run: v retry -- v install sdl && v ~/.vmodules/sdl/setup.vsh

      - name: Install Shy
        run: v retry -- v install https://github.com/medvednikov/shy

      - name: Clone Puzzle Vibes
        run: v retry -- git clone https://github.com/medvednikov/puzzle_vibes/

      - name: Check PV compiles with -g
        run: cd puzzle_vibes && v -g .

      - name: Check PV compiles
        run: cd puzzle_vibes && v .

      - name: Check PV compiles with -prod
        run: cd puzzle_vibes && v -prod    -no-prod-options .

      - name: Check PV compiles with -prod and -g
        run: cd puzzle_vibes && v -prod -g -no-prod-options .
