    if: needs.formatting.outputs.openbsd_ci == 'true'
    uses: ./.github/workflows/openbsd_ci.yml
    permissions:
      contents: read
    secrets: inherit

  other_ci:
    needs: [formatting, gen_vc_ci]
    if: needs.formatting.outputs.other_ci == 'true'
    uses: ./.github/workflows/other_ci.yml
    permissions:
      contents: read
    secrets: inherit

  paths_ci:
    needs: [formatting, gen_vc_ci]
    if: needs.formatting.outputs.paths_ci == 'true'
    uses: ./.github/workflows/paths_ci.yml
    permissions:
      contents: read
    secrets: inherit

  periodic_ci:
    needs: [formatting, gen_vc_ci]
    if: needs.formatting.outputs.periodic_ci == 'true'
    uses: ./.github/workflows/periodic_ci.yml
    permissions:
      contents: read
    secrets: inherit

  process_regressions_ci:
    needs: [formatting, gen_vc_ci]
    if: needs.formatting.outputs.process_regressions_ci == 'true'
    uses: ./.github/workflows/process_regressions_ci.yml
    permissions:
      contents: read
    secrets: inherit

  puzzle_vibes_ci:
    needs: [formatting, gen_vc_ci]
    if: needs.formatting.outputs.puzzle_vibes_ci == 'true'
    uses: ./.github/workflows/puzzle_vibes_ci.yml
    permissions:
      contents: read
    secrets: inherit

  release_ci:
    needs: [formatting, gen_vc_ci, bootstrap-macos, bootstrap-windows, windows-bootstrap-contracts]
    if: needs.formatting.outputs.release_ci == 'true'
    uses: ./.github/workflows/release_ci.yml
    permissions:
      contents: write
    secrets: inherit

  riscv64_linux_ci:
    needs: [formatting, gen_vc_ci]
    if: needs.formatting.outputs.riscv64_linux_ci == 'true'
    uses: ./.github/workflows/riscv64_linux_ci.yml
    permissions:
      contents: read
      packages: write
    secrets: inherit

  s390x_linux_ci:
    needs: [formatting, gen_vc_ci]
    if: needs.formatting.outputs.s390x_linux_ci == 'true'
    uses: ./.github/workflows/s390x_linux_ci.yml
    permissions:
      contents: read
      packages: write
    secrets: inherit

  sanitized_ci:
    needs: [formatting, gen_vc_ci]
    if: needs.formatting.outputs.sanitized_ci == 'true'
