    if: needs.formatting.outputs.docs_ci == 'true'
    uses: ./.github/workflows/docs_ci.yml
    permissions:
      contents: read
    secrets: inherit

  docs_site_ci:
    needs: [formatting, gen_vc_ci]
    if: needs.formatting.outputs.docs_site_ci == 'true'
    uses: ./.github/workflows/docs_site_ci.yml
    permissions:
      contents: read
    secrets: inherit

  fastc_ci:
    needs: [formatting, gen_vc_ci]
    if: needs.formatting.outputs.fastc_ci == 'true'
    uses: ./.github/workflows/fastc_ci.yml
    permissions:
      contents: read
    secrets: inherit

  freebsd_ci:
    needs: [formatting, gen_vc_ci]
    if: needs.formatting.outputs.freebsd_ci == 'true'
    uses: ./.github/workflows/freebsd_ci.yml
    permissions:
      contents: read
    secrets: inherit

  gg_regressions_ci:
    needs: [formatting, gen_vc_ci]
    if: needs.formatting.outputs.gg_regressions_ci == 'true'
    uses: ./.github/workflows/gg_regressions_ci.yml
    permissions:
      contents: read
    secrets: inherit

  inline_h2spec:
    needs: [formatting, gen_vc_ci]
    if: needs.formatting.outputs.h2spec == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      H2SPEC_VERSION: v2.6.0
      H2SPEC_SHA256: 157ee0de702e01ad40e752dbf074b366027e550c8e7504f9450da2809e279318
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build the V compiler
        uses: ./.github/actions/setup-v
        with:
          symlink: false

      - name: Fetch pinned h2spec release
        run: |
          url="https://github.com/summerwind/h2spec/releases/download/${H2SPEC_VERSION}/h2spec_linux_amd64.tar.gz"
          curl -fsSL "$url" -o h2spec.tar.gz
          echo "${H2SPEC_SHA256}  h2spec.tar.gz" | sha256sum -c -
          tar -xzf h2spec.tar.gz
          sudo install -m 0755 h2spec /usr/local/bin/h2spec
          h2spec --version

      - name: Run h2spec conformance gate
        env:
          # VEXE: ./vnew
          VFLAGS_CC: -cc gcc # mbedtls needs a real C compiler, not tcc
        run: bash vlib/net/http/h2spec/run_h2spec.sh

      - name: Upload h2spec report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: h2spec-report
          path: |
            vlib/net/http/h2spec/h2spec_report.xml
            vlib/net/http/h2spec/h2spec_failed_now.txt

  linux_ci:
    needs: [formatting, gen_vc_ci]
    if: needs.formatting.outputs.linux_ci == 'true'
    uses: ./.github/workflows/linux_ci.yml
    permissions:
      contents: read
    secrets: inherit

  macos_ci:
    needs: [formatting, gen_vc_ci, bootstrap-macos]
    if: needs.formatting.outputs.macos_ci == 'true'
    uses: ./.github/workflows/macos_ci.yml
    permissions:
      contents: read
    secrets: inherit

  macos_gitly_ci:
    needs: [formatting, gen_vc_ci, bootstrap-macos]
    if: needs.formatting.outputs.macos_gitly_ci == 'true'
    uses: ./.github/workflows/macos_gitly_ci.yml
    permissions:
      contents: read
    secrets: inherit

  module_docs_ci:
    needs: [formatting, gen_vc_ci]
    if: needs.formatting.outputs.module_docs_ci == 'true'
    uses: ./.github/workflows/module_docs_ci.yml
    permissions:
      contents: read
    secrets: inherit

  inline_module_docs_lint:
    needs: [formatting, gen_vc_ci]
    if: needs.formatting.outputs.module_docs_lint == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check Formatting
        uses: creyD/prettier_action@8c18391fdc98ed0d884c6345f03975edac71b8f0 # v4.6
        with:
          prettier_options: --check cmd/tools/vdoc/theme

  more_extensive_but_slower_tests_ci:
    needs: [formatting, gen_vc_ci]
    if: needs.formatting.outputs.more_extensive_but_slower_tests_ci == 'true'
    uses: ./.github/workflows/more_extensive_but_slower_tests_ci.yml
    permissions:
      contents: read
    secrets: inherit

  multiwindow_musl_exclusion_smoke:
    needs: [formatting, gen_vc_ci]
    if: needs.formatting.outputs.multiwindow_musl_exclusion_smoke == 'true'
    uses: ./.github/workflows/multiwindow_musl_exclusion_smoke.yml
    permissions:
      contents: read
    secrets: inherit

  notices_ci:
    needs: [formatting, gen_vc_ci]
    if: needs.formatting.outputs.notices_ci == 'true'
    uses: ./.github/workflows/notices_ci.yml
    permissions:
      contents: read
    secrets: inherit

  openbsd_ci:
