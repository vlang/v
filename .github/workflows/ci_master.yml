    secrets: inherit

  sdl_ci:
    needs: [formatting, gen_vc_ci]
    if: needs.formatting.outputs.sdl_ci == 'true'
    uses: ./.github/workflows/sdl_ci.yml
    permissions:
      contents: read
    secrets: inherit

  symlink_ci:
    needs: [formatting, gen_vc_ci]
    if: needs.formatting.outputs.symlink_ci == 'true'
    uses: ./.github/workflows/symlink_ci.yml
    permissions:
      contents: read
    secrets: inherit

  tccbin_automation_contract:
    needs: [formatting, gen_vc_ci]
    if: needs.formatting.outputs.tccbin_automation_contract == 'true'
    uses: ./.github/workflows/tccbin_automation_contract.yml
    permissions:
      contents: read
    secrets: inherit

  termux_ci:
    needs: [formatting, gen_vc_ci, bootstrap-termux]
    if: needs.formatting.outputs.termux_ci == 'true'
    uses: ./.github/workflows/termux_ci.yml
    permissions:
      contents: read
    secrets: inherit

  test_selection_ci:
    needs: [formatting, gen_vc_ci]
    if: needs.formatting.outputs.test_selection_ci == 'true'
    uses: ./.github/workflows/test_selection_ci.yml
    permissions:
      contents: read
    secrets: inherit

  time_ci:
    needs: [formatting, gen_vc_ci]
    if: needs.formatting.outputs.time_ci == 'true'
    uses: ./.github/workflows/time_ci.yml
    permissions:
      contents: read
    secrets: inherit

  inline_toml_ci:
    needs: [formatting, gen_vc_ci]
    if: needs.formatting.outputs.toml_ci == 'true'
    runs-on: ubuntu-latest
    env:
      # Stop a failing test session at its first failure instead of
      # running the whole suite to completion; the remaining files
      # add no signal.
      VTEST_FAIL_FAST: '1'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-v
      - name: Install dependencies
        run: |
          v retry -- v download https://github.com/jqlang/jq/releases/download/jq-1.6/jq-linux64
          sudo chmod 755 jq-linux64
          sudo mv jq-linux64 /usr/bin/jq

      - name: Show JQ Version
        run: jq --version

      - name: Download more TOML testsuits
        run: .github/workflows/download_full_toml_test_suites.sh

      - name: Run TOML tests
        run: VTEST_TOML_DO_YAML_CONVERSION=1 VTEST_TOML_DO_LARGE_FILES=1 ./v test vlib/toml

  tools_ci:
    needs: [formatting, gen_vc_ci]
    if: needs.formatting.outputs.tools_ci == 'true'
    uses: ./.github/workflows/tools_ci.yml
    permissions:
      contents: read
    secrets: inherit

  v_apps_and_modules_compile_ci:
    needs: [formatting, gen_vc_ci]
    if: needs.formatting.outputs.v_apps_and_modules_compile_ci == 'true'
    uses: ./.github/workflows/v_apps_and_modules_compile_ci.yml
    permissions:
      contents: read
    secrets: inherit

  vab_ci:
    needs: [formatting, gen_vc_ci]
    if: needs.formatting.outputs.vab_ci == 'true'
    uses: ./.github/workflows/vab_ci.yml
    permissions:
      contents: read
    secrets: inherit

  inline_vinix_ci:
    needs: [formatting, gen_vc_ci]
    if: needs.formatting.outputs.vinix_ci == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build V
        uses: ./.github/actions/setup-v

      - name: Install dependencies
        run: |
          .github/workflows/disable_azure_mirror.sh
          v retry -- sudo apt update
          v retry -- sudo apt install build-essential libarchive-dev -y

      - name: Clone current Vinix
        run: v retry -- git clone --depth=1 --branch master https://github.com/vlang/vinix.git

      - name: Download Vinix kernel dependencies
        run: cd vinix/kernel && v retry -- ./get-deps

      - name: Attempt to build the Vinix kernel (debug)
        run: |
          set -e
          cd vinix/kernel
          make PROD=false \
            CFLAGS="-Ulinux -U__linux -U__linux__ -U__gnu_linux__ -D__vinix__ -O2 -g -pipe" \
            V="$(realpath ../../v)"
          make clean

      - name: Attempt to build the Vinix kernel (prod)
        run: |
          set -e
          cd vinix/kernel
          make PROD=true \
            CFLAGS="-Ulinux -U__linux -U__linux__ -U__gnu_linux__ -D__vinix__ -O2 -g -pipe" \
            V="$(realpath ../../v)"
          make clean

      - name: Attempt to build the util-vinix (debug)
        run: |
          set -e
          cd vinix/util-vinix
          make PROD=false \
            VFLAGS="-os vinix -gc none" \
            CFLAGS="-Ulinux -U__linux -U__linux__ -U__gnu_linux__ -D__vinix__ -O2 -g -pipe" \
            V="$(realpath ../../v)"
          make clean

      - name: Attempt to build the util-vinix (prod)
        run: |
          set -e
          cd vinix/util-vinix
          make PROD=true \
            VFLAGS="-os vinix -gc none" \
            CFLAGS="-Ulinux -U__linux -U__linux__ -U__gnu_linux__ -D__vinix__ -O2 -g -pipe" \
            V="$(realpath ../../v)"
          make clean

  vpm_ci:
    needs: [formatting, gen_vc_ci]
    if: needs.formatting.outputs.vpm_ci == 'true'
    uses: ./.github/workflows/vpm_ci.yml
    permissions:
      contents: read
    secrets: inherit

  vsl_and_vtl_compile_ci:
    needs: [formatting, gen_vc_ci]
    if: needs.formatting.outputs.vsl_and_vtl_compile_ci == 'true'
    uses: ./.github/workflows/vsl_and_vtl_compile_ci.yml
    permissions:
      contents: read
    secrets: inherit

  vup_works:
    needs: [formatting, gen_vc_ci]
    if: needs.formatting.outputs.vup_works == 'true'
    uses: ./.github/workflows/vup_works.yml
    permissions:
      contents: read
    secrets: inherit

  inline_wasm_backend_ci:
    needs: [formatting, gen_vc_ci]
    if: needs.formatting.outputs.wasm_backend_ci == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-22.04, windows-2022]
      fail-fast: false
    timeout-minutes: 20
    env:
      # Stop a failing test session at its first failure instead of
      # running the whole suite to completion; the remaining files
      # add no signal.
      VTEST_FAIL_FAST: '1'
      VTEST_ONLY: wasm
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Prepare private tool cache
        if: runner.os == 'Windows'
        run: .\.github\workflows\setup_windows_tool_cache.ps1

      - name: Build V
        if: runner.os != 'Windows'
        uses: ./.github/actions/setup-v
        with:
          symlink: false
      - name: Build V (Windows)
        if: runner.os == 'Windows'
        uses: ./.github/actions/setup-v
        with:
          symlink: false

      - name: Install WABT to get wasm-decompile
        if: runner.os != 'Windows'
        run: ./v retry -- sudo apt install wabt

      - name: Setup Wasmer
        uses: wasmerio/setup-wasmer@24b15c95293d23f89c68bd40dac76338f773e924 # v3.1
        with:
          version: v4.4.0

      - name: Prebuild the WASM backend
        run: ./v cmd/tools/builders/wasm_builder.v

      - name: Test the WASM backend
        run: ./v test vlib/v/gen/wasm/

      - name: Build examples
        run: ./v build-examples

