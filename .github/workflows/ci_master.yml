name: CI master

on:
  push:
    branches: [master]

concurrency:
  group: ci-master-${{ github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The reusable workflow is called separately so a slow macOS bootstrap
  # cannot hold Linux formatting, VC generation, and Linux CI in the queue.
  bootstrap-linux:
    uses: ./.github/workflows/bootstrapping_ci.yml
    with:
      platform: linux
    permissions:
      contents: read
      actions: read

  bootstrap-macos:
    uses: ./.github/workflows/bootstrapping_ci.yml
    with:
      platform: macos
    permissions:
      contents: read
      actions: read

  bootstrap-windows:
    uses: ./.github/workflows/bootstrapping_ci.yml
    with:
      platform: windows
    permissions:
      contents: read
      actions: read

  bootstrap-termux:
    uses: ./.github/workflows/bootstrapping_ci.yml
    with:
      platform: termux
    permissions:
      contents: read
      actions: read

  cleanup-vprod:
    # Never prune old artifacts before every new platform compiler exists.
    needs: [gen_vc_ci, bootstrap-macos, bootstrap-windows, bootstrap-termux, windows-bootstrap-contracts]
    if: github.repository == 'vlang/v' && github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Cleanup must not hold up the test gate if the artifact API is unavailable.
    continue-on-error: true
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Remove superseded compiler artifacts from completed runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/workflows/cleanup_vprod.py

  windows-bootstrap-contracts:
    uses: ./.github/workflows/makev_ci.yml
    permissions:
      contents: read

  formatting:
    needs: bootstrap-linux
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      VFLAGS: -cc gcc
    outputs:
      benchmark_footprint_json_decode: ${{ steps.paths.outputs.benchmark_footprint_json_decode }}
      benchmark_footprint_json_encode: ${{ steps.paths.outputs.benchmark_footprint_json_encode }}
      build_on_ubuntu_25_ci: ${{ steps.paths.outputs.build_on_ubuntu_25_ci }}
      c2v_ci: ${{ steps.paths.outputs.c2v_ci }}
      canvas_ci: ${{ steps.paths.outputs.canvas_ci }}
      compiler_ci: ${{ steps.paths.outputs.compiler_ci }}
      cross_ci: ${{ steps.paths.outputs.cross_ci }}
      db_ci: ${{ steps.paths.outputs.db_ci }}
      docker_ci: ${{ steps.paths.outputs.docker_ci }}
      docs_ci: ${{ steps.paths.outputs.docs_ci }}
      docs_site_ci: ${{ steps.paths.outputs.docs_site_ci }}
      fastc_ci: ${{ steps.paths.outputs.fastc_ci }}
      freebsd_ci: ${{ steps.paths.outputs.freebsd_ci }}
      gen_vc_ci: ${{ steps.paths.outputs.gen_vc_ci }}
      gg_regressions_ci: ${{ steps.paths.outputs.gg_regressions_ci }}
      h2spec: ${{ steps.paths.outputs.h2spec }}
      linux_ci: ${{ steps.paths.outputs.linux_ci }}
      macos_ci: ${{ steps.paths.outputs.macos_ci }}
      macos_gitly_ci: ${{ steps.paths.outputs.macos_gitly_ci }}
      module_docs_ci: ${{ steps.paths.outputs.module_docs_ci }}
      module_docs_lint: ${{ steps.paths.outputs.module_docs_lint }}
      more_extensive_but_slower_tests_ci: ${{ steps.paths.outputs.more_extensive_but_slower_tests_ci }}
      multiwindow_musl_exclusion_smoke: ${{ steps.paths.outputs.multiwindow_musl_exclusion_smoke }}
      notices_ci: ${{ steps.paths.outputs.notices_ci }}
      openbsd_ci: ${{ steps.paths.outputs.openbsd_ci }}
      other_ci: ${{ steps.paths.outputs.other_ci }}
      paths_ci: ${{ steps.paths.outputs.paths_ci }}
      periodic_ci: ${{ steps.paths.outputs.periodic_ci }}
      process_regressions_ci: ${{ steps.paths.outputs.process_regressions_ci }}
      puzzle_vibes_ci: ${{ steps.paths.outputs.puzzle_vibes_ci }}
      release_ci: ${{ steps.paths.outputs.release_ci }}
      riscv64_linux_ci: ${{ steps.paths.outputs.riscv64_linux_ci }}
      s390x_linux_ci: ${{ steps.paths.outputs.s390x_linux_ci }}
      sanitized_ci: ${{ steps.paths.outputs.sanitized_ci }}
      sdl_ci: ${{ steps.paths.outputs.sdl_ci }}
      symlink_ci: ${{ steps.paths.outputs.symlink_ci }}
      tccbin_automation_contract: ${{ steps.paths.outputs.tccbin_automation_contract }}
      termux_ci: ${{ steps.paths.outputs.termux_ci }}
      test_selection_ci: ${{ steps.paths.outputs.test_selection_ci }}
      time_ci: ${{ steps.paths.outputs.time_ci }}
      toml_ci: ${{ steps.paths.outputs.toml_ci }}
      tools_ci: ${{ steps.paths.outputs.tools_ci }}
      v_apps_and_modules_compile_ci: ${{ steps.paths.outputs.v_apps_and_modules_compile_ci }}
      vab_ci: ${{ steps.paths.outputs.vab_ci }}
      vinix_ci: ${{ steps.paths.outputs.vinix_ci }}
      vpm_ci: ${{ steps.paths.outputs.vpm_ci }}
      vsl_and_vtl_compile_ci: ${{ steps.paths.outputs.vsl_and_vtl_compile_ci }}
      vup_works: ${{ steps.paths.outputs.vup_works }}
      wasm_backend_ci: ${{ steps.paths.outputs.wasm_backend_ci }}
      websockets_ci: ${{ steps.paths.outputs.websockets_ci }}
      windows_ci_gcc: ${{ steps.paths.outputs.windows_ci_gcc }}
      windows_ci_msvc: ${{ steps.paths.outputs.windows_ci_msvc }}
      windows_ci_tcc: ${{ steps.paths.outputs.windows_ci_tcc }}
      workflow_lint: ${{ steps.paths.outputs.workflow_lint }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Build V for formatting
        uses: ./.github/actions/setup-v
      - name: Check code formatting
        run: |
          ./v -silent test-cleancode
          ./v -silent test-fmt
      - name: Test master-push path filter logic
        run: python3 .github/workflows/ci_gate_paths_test.py
      - name: Test optimized compiler setup
        run: python3 .github/workflows/prepare_v_test.py
      - name: Test compiler artifact cleanup
        run: python3 .github/workflows/cleanup_vprod_test.py
      - name: Select suites using the original push path filters
        id: paths
        env:
          CI_BEFORE: ${{ github.event.before }}
          CI_AFTER: ${{ github.sha }}
        run: python3 .github/workflows/ci_gate_paths.py master

  # Regenerate the bootstrap C sources before starting any other suites.
  gen_vc_ci:
    needs: formatting
    if: needs.formatting.outputs.gen_vc_ci == 'true'
    uses: ./.github/workflows/gen_vc_ci.yml
    permissions:
      contents: read
    secrets: inherit

  inline_benchmark_footprint_json_decode:
    needs: [formatting, gen_vc_ci]
    if: needs.formatting.outputs.benchmark_footprint_json_decode == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build V
        uses: ./.github/actions/setup-v

      - name: Run V benchmark and save output
        run: (echo '```txt'; v -prod -w crun vlib/json2/tests/bench.v; echo '```') > vlib/json2/tests/bench_out.md

      - name: Upload result file
        uses: actions/upload-artifact@v7
        with:
          name: json-decode-benchmark-output
          path: vlib/json2/tests/bench_out.md

  inline_benchmark_footprint_json_encode:
    needs: [formatting, gen_vc_ci]
    if: needs.formatting.outputs.benchmark_footprint_json_encode == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build V
        uses: ./.github/actions/setup-v

      - name: Run V benchmark and save output
        run: (echo '```sh'; v -prod crun vlib/v/tests/bench/bench_json_vs_json2.v; echo '```') > vlib/v/tests/bench/bench_json_vs_json2_out.md

      - name: Upload result file
        uses: actions/upload-artifact@v7
        with:
          name: json-encode-benchmark-output
          path: vlib/v/tests/bench/bench_json_vs_json2_out.md

  build_on_ubuntu_25_ci:
    needs: [formatting, gen_vc_ci]
    if: needs.formatting.outputs.build_on_ubuntu_25_ci == 'true'
    uses: ./.github/workflows/build_on_ubuntu_25_ci.yml
    permissions:
      contents: read
    secrets: inherit

  c2v_ci:
    needs: [formatting, gen_vc_ci]
    if: needs.formatting.outputs.c2v_ci == 'true'
    uses: ./.github/workflows/c2v_ci.yml
    permissions:
      contents: read
    secrets: inherit

  canvas_ci:
    needs: [formatting, gen_vc_ci]
    if: needs.formatting.outputs.canvas_ci == 'true'
    uses: ./.github/workflows/canvas_ci.yml
    permissions:
      contents: read
    secrets: inherit

  compiler_ci:
    needs: [formatting, gen_vc_ci]
    if: needs.formatting.outputs.compiler_ci == 'true'
    uses: ./.github/workflows/compiler_ci.yml
    permissions:
      contents: read
    secrets: inherit

  cross_ci:
    needs: [formatting, gen_vc_ci]
    if: needs.formatting.outputs.cross_ci == 'true'
    uses: ./.github/workflows/cross_ci.yml
    permissions:
      contents: read
    secrets: inherit

  db_ci:
    needs: [formatting, gen_vc_ci]
    if: needs.formatting.outputs.db_ci == 'true'
    uses: ./.github/workflows/db_ci.yml
    permissions:
      contents: read
    secrets: inherit

  docker_ci:
    needs: [formatting, gen_vc_ci]
    if: needs.formatting.outputs.docker_ci == 'true'
