name: Graphics CI

on:
  push:
    branches:
      - master
    paths:
      - 'vlib/**'
      - 'examples/gg/multiwindow.v'
      - 'thirdparty/**'
      - 'cmd/tools/builders/**.v'
      - '**/gg_regressions_ci.yml'
      - '!**.md'
  pull_request:
    paths:
      - 'vlib/**'
      - 'examples/gg/multiwindow.v'
      - 'thirdparty/**'
      - 'cmd/tools/builders/**.v'
      - '**/gg_regressions_ci.yml'
      - '!**.md'

concurrency:
  group: gg-regressions-${{ github.workflow }}-${{ github.ref == 'refs/heads/master' && github.sha || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gg-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # Stop a failing test session at its first failure instead of
      # running the whole suite to completion; the remaining files
      # add no signal.
      VTEST_FAIL_FAST: '1'
      VFLAGS: -cc tcc
      V_MACOS_V3_NO_FALLBACK: '1'
      DISPLAY: :99
      LIBGL_ALWAYS_SOFTWARE: true
      VTMP: /tmp
    steps:
      - name: Checkout V
        id: checkout_v
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/cache-apt-packages-action
        id: uses_cache_apt_packages_action
        if: ${{ success() && !cancelled() && steps.checkout_v.outcome == 'success' }}

      - name: Build local v
        id: build_local_v
        if: ${{ success() && !cancelled() && steps.uses_cache_apt_packages_action.outcome == 'success' }}
        run: make -j4 && ./v symlink

      - name: Clear module cache
        id: clear_module_cache
        if: ${{ success() && !cancelled() && steps.build_local_v.outcome == 'success' }}
        run: ./v wipe-cache

      - name: Setup dependencies
        id: setup_dependencies
        if: ${{ success() && !cancelled() && steps.clear_module_cache.outcome == 'success' }}
        run: |
          # imagemagick              : convert, mogrify
          # xvfb                     : xvfb
          # openimageio-tools        : idiff
          # libxcursor-dev libxi-dev : V gfx deps
          # libgl1-mesa-dri          : For headless rendering / software DRI driver (LIBGL_ALWAYS_SOFTWARE=true)
          # freeglut3-dev            : Fixes graphic apps compilation with tcc
          # libx11-dev               : X11 headers for opt-in x.multiwindow X11/Xvfb coverage
          # libx11-xcb-dev           : shared Xlib/XCB connection for checked same-client requests
          # libwayland-dev           : Wayland headers for x.multiwindow Wayland compile/probe tests
          .github/workflows/disable_azure_mirror.sh
          ./v retry -- sudo apt update
          ./v retry -- sudo apt install imagemagick openimageio-tools libgl1-mesa-dev libgl1-mesa-dri xvfb libxcursor-dev libxi-dev libxrandr-dev freeglut3-dev xsel xclip libx11-dev libx11-xcb-dev libegl-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev wayland-protocols
          ./v retry -- ./v download https://raw.githubusercontent.com/tremby/imgur.sh/c98345d/imgur.sh
          ./v retry -- git clone https://github.com/Larpon/gg-regression-images gg-regression-images
          chmod +x ./imgur.sh

      - name: Check Wayland pipe descriptor ABI
        id: check_wayland_pipe_descriptor_abi
        if: ${{ success() && !cancelled() && steps.setup_dependencies.outcome == 'success' }}
        run: env -u DISPLAY -u WAYLAND_DISPLAY -u XDG_SESSION_TYPE timeout --signal=TERM --kill-after=5s 120s ./v -new-compiler -no-retry-compilation -d gg_multiwindow -d sokol_wayland vlib/gg/wayland_pipe_abi_test.c.v

      - name: Legacy gg import multiwindow isolation
        id: legacy_gg_import_multiwindow_isolation
        if: ${{ success() && !cancelled() && steps.check_wayland_pipe_descriptor_abi.outcome == 'success' }}
        run: env -u DISPLAY -u WAYLAND_DISPLAY -u XDG_SESSION_TYPE ./v test vlib/gg/legacy_import_multiwindow_isolation_test.v

      - name: Multiwindow Linux checks
        id: multiwindow_linux_checks
        if: ${{ success() && !cancelled() && steps.legacy_gg_import_multiwindow_isolation.outcome == 'success' }}
        run: |
          set -euo pipefail
          env -u DISPLAY -u WAYLAND_DISPLAY -u XDG_SESSION_TYPE timeout --kill-after=5s 120s ./v -new-compiler -d sokol_wayland vlib/sokol/sapp/sapp_wayland_pipe_linux_test.c.v
          env -u DISPLAY -u WAYLAND_DISPLAY -u XDG_SESSION_TYPE ./v -d gg_multiwindow test vlib/x/multiwindow vlib/gg/multiwindow_api_d_gg_multiwindow_test.v vlib/gg/frame_pacing_test.v vlib/gg/draw_fns_api_test.v vlib/gg/draw_rect_empty_test.v
          env -u DISPLAY -u WAYLAND_DISPLAY -u XDG_SESSION_TYPE ./v -d gg_multiwindow -d sokol_wayland test vlib/x/multiwindow vlib/gg/multiwindow_api_d_gg_multiwindow_test.v vlib/gg/frame_pacing_test.v vlib/gg/draw_fns_api_test.v vlib/gg/draw_rect_empty_test.v
          xvfb-run -a -s "-screen 0 1280x1024x24 -noreset" env -u WAYLAND_DISPLAY -u XDG_SESSION_TYPE LIBGL_ALWAYS_SOFTWARE=true ./v -d gg_multiwindow -d x_multiwindow_x11 test vlib/x/multiwindow vlib/gg/multiwindow_api_d_gg_multiwindow_test.v vlib/gg/frame_pacing_test.v vlib/gg/draw_fns_api_test.v vlib/gg/draw_rect_empty_test.v
          ./v -d gg_multiwindow -o /tmp/gg_multiwindow_default examples/gg/multiwindow.v
          ./v -d gg_multiwindow -d x_multiwindow_x11 -o /tmp/gg_multiwindow_x11 examples/gg/multiwindow.v
          ./v -d gg_multiwindow -d sokol_wayland -o /tmp/gg_multiwindow_wayland examples/gg/multiwindow.v
          run_headless_example() {
            local label="$1"
            local binary="$2"
            local stdout
            local stderr
            local status
            stdout="$(mktemp)"
            stderr="$(mktemp)"
            set +e
            env -u DISPLAY -u WAYLAND_DISPLAY -u XDG_SESSION_TYPE \
              timeout 20s stdbuf -oL -eL "$binary" >"$stdout" 2>"$stderr"
            status=$?
            set -e
            echo "::group::${label} stdout"
            cat "$stdout"
            echo "::endgroup::"
            echo "::group::${label} stderr"
            cat "$stderr"
            echo "::endgroup::"
            grep -Fq "gg multi-window backend:" "$stdout"
            grep -Fq "mock backend selected; stopping after initial lifecycle events" "$stdout"
            grep -Fq "live windows:" "$stdout"
            grep -Fq "window created:" "$stdout"
            if [ "$status" -ne 0 ]; then
              echo "${label} failed with status $status"
              exit "$status"
            fi
          }
          run_x11_example() {
            local label="$1"
            local binary="$2"
            local stdout
            local stderr
            local status
            stdout="$(mktemp)"
            stderr="$(mktemp)"
            set +e
            xvfb-run -a -s "-screen 0 1280x1024x24" \
              env -u WAYLAND_DISPLAY -u XDG_SESSION_TYPE LIBGL_ALWAYS_SOFTWARE=true \
              timeout 12s stdbuf -oL -eL "$binary" >"$stdout" 2>"$stderr"
            status=$?
            set -e
            echo "::group::${label} stdout"
            cat "$stdout"
            echo "::endgroup::"
            echo "::group::${label} stderr"
            cat "$stderr"
            echo "::endgroup::"
            grep -Fq "gg multi-window backend:" "$stdout"
            grep -Fq "live windows:" "$stdout"
            grep -Fq "window created:" "$stdout"
            if [ "$status" -eq 124 ]; then
              echo "${label} reached the controlled timeout after producing expected launch logs."
              return 0
            fi
            return "$status"
          }
          run_headless_example "gg multiwindow headless mock" /tmp/gg_multiwindow_default
          run_headless_example "gg multiwindow Wayland-build headless mock" /tmp/gg_multiwindow_wayland
          run_x11_example "gg multiwindow Xvfb/X11" /tmp/gg_multiwindow_x11

      - name: Sample and compare
        if: ${{ success() && !cancelled() && steps.multiwindow_linux_checks.outcome == 'success' }}
        id: compare
        continue-on-error: true
        run: |
          xvfb-run -a -e /dev/stderr \
            -s "-screen 0 1280x1024x24 -fbdir /var/tmp/" \
            timeout --signal=TERM --kill-after=15s 10m \
            ./v gret -t ./gg-regression-images/vgret.v_examples.toml -v ./gg-sample_images ./gg-regression-images

      - name: Upload regression to imgur
        if: steps.compare.outcome != 'success'
        run: |
          ./imgur.sh /tmp/fail.png
          ./imgur.sh /tmp/diff.png
          exit 1
