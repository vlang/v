name: Windows GC, closure and translated pointer regressions

on:
  pull_request:
    paths:
      - '.github/workflows/windows_gc_closure_voidptr_ci.yml'
      - 'vlib/v/tests/gc_boehm_leak_array_displacement_test.v'
      - 'vlib/v/tests/fns/closure_lifetime_api_test.v'
      - 'vlib/v/tests/translated_scalar_promotions_test.v'
      - 'vlib/v/gen/c/translated_voidptr_offset_test.v'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        fixture: [boehm, closure, translated]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Prepare private Windows tool cache
        run: .\.github\workflows\setup_windows_tool_cache.ps1
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        with:
          arch: x64
      - uses: ./.github/actions/setup-v
        with:
          symlink: 'false'
      - name: Run original fixture on Windows GCC and MSVC
        shell: pwsh
        run: |
          $fixture = '${{ matrix.fixture }}'
          $test = switch ($fixture) {
            'boehm' { 'vlib/v/tests/gc_boehm_leak_array_displacement_test.v' }
            'closure' { 'vlib/v/tests/fns/closure_lifetime_api_test.v' }
            'translated' { 'vlib/v/tests/translated_scalar_promotions_test.v' }
          }
          .\v.exe fmt -verify $test
          if ($LASTEXITCODE -ne 0) { throw "Format verification failed: $test" }
          $extra = @()
          if ($fixture -eq 'boehm') { $extra = @('-gc', 'boehm_leak') }
          $failed = @()
          foreach ($cc in @('gcc', 'msvc')) {
            Write-Host "START $cc $test"
            .\v.exe -cc $cc -silent @extra $test
            if ($LASTEXITCODE -ne 0) {
              $failed += $cc
            } else {
              Write-Host "PASS $cc $test"
            }
          }
          if ($failed.Count -ne 0) { throw "$test failed: $failed" }
  linux-generated-c:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-v
        with:
          symlink: 'false'
      - name: Verify generated byte-pointer offsets
        run: |
          ./v fmt -verify vlib/v/gen/c/translated_voidptr_offset_test.v
          ./v -cc gcc -silent vlib/v/gen/c/translated_voidptr_offset_test.v
          ./v -cc clang -silent vlib/v/gen/c/translated_voidptr_offset_test.v
