name: json decoder benchmark CI

on:
  push:
    branches:
      - master
    paths:
      - 'vlib/json2/**' # Trigger on changes in this folder

permissions:
  contents: read

jobs:
  json-encode-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        id: checkout_repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build V
        id: build_v
        if: ${{ success() && !cancelled() && steps.checkout_repository.outcome == 'success' }}
        run: make -j4 && ./v symlink

      - name: Run V benchmark and save output
        id: run_v_benchmark_and_save_output
        if: ${{ success() && !cancelled() && steps.build_v.outcome == 'success' }}
        run: (echo '```txt'; v -prod -w crun vlib/json2/tests/bench.v; echo '```') > vlib/json2/tests/bench_out.md

      - name: Upload result file
        id: upload_result_file
        if: ${{ success() && !cancelled() && steps.run_v_benchmark_and_save_output.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: program-output
          path: vlib/json2/tests/bench_out.md
