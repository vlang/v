name: Deploy fast.vlang.io

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: fast-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, macOS, gitly-ci]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out generated site
        uses: actions/checkout@v4
        with:
          repository: vlang/website
          ref: gh-pages
          path: site
      - name: Assemble site
        run: |
          mkdir -p _site
          rsync -a --exclude='.git' --exclude='.github' site/ _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
