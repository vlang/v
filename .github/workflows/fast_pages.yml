name: Deploy fast.vlang.io

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: fast-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, macOS, gitly-ci]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out generated site
        uses: actions/checkout@v7
        with:
          repository: vlang/website
          ref: gh-pages
          path: site
      - name: Assemble site
        run: |
          mkdir -p _site
          rsync -aL --exclude='.git' --exclude='.github' site/ _site/
      - uses: actions/configure-pages@v6
      - name: Archive Pages artifact
        run: |
          chmod -R a+rX _site
          /usr/bin/tar -C _site -cvf "$RUNNER_TEMP/artifact.tar" .
      - name: Upload Pages artifact
        uses: actions/upload-artifact@v7
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error
      - id: deployment
        uses: actions/deploy-pages@v5
