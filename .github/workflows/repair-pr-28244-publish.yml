name: Publish repaired PR 28244

on:
  push:
    branches:
      - v3-ownership-toml-value-copy

permissions:
  contents: write

concurrency:
  group: publish-pr-28244
  cancel-in-progress: true

jobs:
  publish-windows:
    if: contains(github.event.head_commit.message, '[publish-pr-28244]')
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      ORIGINAL_BASE: cbf4e8509630da710d04cc9fd0f777761ebe55a7
      ORIGINAL_HEAD: 2a6677b34d621f7b44e48c73ad773180aa9d8ea8
      PR_BRANCH: v3-ownership-toml-value-copy
    steps:
      - name: Check out repair inputs
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Rebuild on current master
        shell: bash
        run: |
          set -euxo pipefail
          repair_script="$RUNNER_TEMP/repair_pr_28244.py"
          patch_file="$RUNNER_TEMP/pr-28244.patch"
          cat \
            .github/pr28244-repair/00.py.part \
            .github/pr28244-repair/00z.py.part \
            .github/pr28244-repair/01.py.part \
            .github/pr28244-repair/01z.py.part \
            .github/pr28244-repair/04.py.part \
            .github/pr28244-repair/05.py.part \
            .github/pr28244-repair/99.py.part \
            > "$repair_script"
          python -m py_compile "$repair_script"
          git fetch --no-tags origin master
          git diff --binary "$ORIGINAL_BASE" "$ORIGINAL_HEAD" > "$patch_file"
          git checkout -B repaired origin/master
          git apply --3way --index --whitespace=nowarn "$patch_file"
          git reset
          REPO_ROOT="$GITHUB_WORKSPACE" python "$repair_script"
          git diff --check

      - name: Bootstrap V with MSVC
        shell: pwsh
        run: |
          ./makev.bat -msvc
          if ($LASTEXITCODE -ne 0) { throw "makev.bat failed with exit code $LASTEXITCODE" }

      - name: Format changed V sources
        shell: pwsh
        run: |
          $files = @(
            'vlib/v3/tests/ownership_borrowed_projection_error_test.v',
            'vlib/v3/tests/ownership_borrowed_projection_review_test.v',
            'vlib/v3/tests/ownership_toml_decode_test.v',
            'vlib/v3/transform/array.v',
            'vlib/v3/transform/fn.v',
            'vlib/v3/transform/fn_test.v',
            'vlib/v3/transform/if.v',
            'vlib/v3/transform/interface.v',
            'vlib/v3/transform/map.v',
            'vlib/v3/transform/or.v',
            'vlib/v3/transform/return.v',
            'vlib/v3/transform/struct.v',
            'vlib/v3/transform/transform.v',
            'vlib/v3/transform/transform_parallel_test.v',
            'vlib/v3/types/checker_ownership_alias_test.v',
            'vlib/v3/types/checker_ownership_d_ownership.v',
            'vlib/v3/types/checker_ownership_notd_ownership.v'
          )
          foreach ($file in $files) {
            ./v.exe fmt -w $file
            if ($LASTEXITCODE -ne 0) { throw "v fmt failed for $file" }
          }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw "git diff --check failed" }

      - name: Compile V3 and run focused regressions
        shell: pwsh
        run: |
          $vlib = "$($PWD.Path)\vlib|@vlib|@vmodules"
          ./v.exe -nocache -gc none -d ownership -path $vlib -o "$env:RUNNER_TEMP\v3-pr-28244.exe" vlib/v3/v3.v
          if ($LASTEXITCODE -ne 0) { throw "ownership V3 build failed" }
          $tests = @(
            'vlib/v3/tests/ownership_borrowed_projection_review_test.v',
            'vlib/v3/tests/ownership_borrowed_projection_error_test.v',
            'vlib/v3/tests/ownership_toml_decode_test.v',
            'vlib/v3/types/checker_ownership_alias_test.v',
            'vlib/v3/transform/fn_test.v',
            'vlib/v3/transform/transform_parallel_test.v'
          )
          foreach ($test in $tests) {
            ./v.exe test $test
            if ($LASTEXITCODE -ne 0) { throw "test failed: $test" }
          }
          ./v.exe -nocache -gc none -path $vlib -o "$env:RUNNER_TEMP\v3-pr-28244-no-ownership.exe" vlib/v3/v3.v
          if ($LASTEXITCODE -ne 0) { throw "non-ownership V3 build failed" }

      - name: Create clean semantic commits
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "OpenAI Codex"
          git config user.email "codex@openai.com"
          git reset

          git add \
            vlib/v3/transform/array.v \
            vlib/v3/transform/fn.v \
            vlib/v3/transform/if.v \
            vlib/v3/transform/interface.v \
            vlib/v3/transform/map.v \
            vlib/v3/transform/or.v \
            vlib/v3/transform/return.v \
            vlib/v3/transform/struct.v \
            vlib/v3/transform/transform.v \
            vlib/v3/types/checker_ownership_d_ownership.v \
            vlib/v3/types/checker_ownership_notd_ownership.v
          git commit -m "v3: model borrowed owned-value copies explicitly"

          git add \
            vlib/v3/tests/ownership_borrowed_projection_error_test.v \
            vlib/v3/tests/ownership_borrowed_projection_review_test.v \
            vlib/v3/tests/ownership_toml_decode_test.v \
            vlib/v3/tests/testdata/ownership_borrowed_projection \
            vlib/v3/transform/fn_test.v \
            vlib/v3/transform/transform_parallel_test.v \
            vlib/v3/types/checker_ownership_alias_test.v
          git commit -m "v3: organize borrowed ownership regressions by context"

          test -z "$(git status --porcelain)"
          git log --oneline --decorate -4
          current=$(git ls-remote origin "refs/heads/${PR_BRANCH}" | awk '{print $1}')
          if [[ "$current" != "$GITHUB_SHA" ]]; then
            echo "PR branch moved from $GITHUB_SHA to $current; not publishing stale repair" >&2
            exit 1
          fi
          git push --force origin HEAD:refs/heads/pr-28244-repair-staging-windows
