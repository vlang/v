name: Sanitized CI

## Running these jobs is slow (over ~1 hour, sometimes even 2)
## so we run them only when there is a chance that the generated
## C code could have changed, or for some critical vlib modules,
## like `builtin`, `os`, `sync`, where they have demonstrated
## their usefulness by catching actual very hard to find bugs.
## The cost of this selective running is delayed feedback when
## there are bugs in other V modules.
## The positive is *much faster CI runs* for most V contributors,
## that make PRs that are not concerning V itself, or the critical
## V modules.

on:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: sanitized-sanitized_ci-${{ github.ref == 'refs/heads/master' && github.sha || github.ref }}
  cancel-in-progress: true

env:
  SANITIZER_BASE_PACKAGES: >-
    postgresql libpq-dev libssl-dev sqlite3 libsqlite3-dev valgrind
  SANITIZER_GRAPHICS_PACKAGES: >-
    libfreetype6-dev libxi-dev libxcursor-dev libgl-dev libxrandr-dev
    libasound2-dev libegl-dev
  SANITIZER_CLANG_PACKAGES: clang

permissions:
  contents: read

jobs:
  sanitize-linux:
    if: github.ref == 'refs/heads/master'
    # Ubuntu 22.04's Clang 14 lacks the stat64/lstat64 MSan interceptors used
    # by SQLite's large-file pathname checks. Keep all MSan builds on the
    # Ubuntu 24.04 Clang 18 toolchain, including the private database libraries.
    runs-on: ${{ matrix.sanitizer == 'memory' && 'ubuntu-24.04' || 'ubuntu-22.04' }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: undefined-clang
            cc: clang
            sanitizer: undefined
            gc: default
            timeout: 120
            vflags: -cc clang -cflags -fno-omit-frame-pointer
            ubsan_options: print_stacktrace=1:halt_on_error=1:print_suppressions=0:suppressions=/home/runner/work/v/v/.github/workflows/run_sanitizers_undefined.suppressions
          - name: undefined-gcc
            # The serial suite was still progressing after 135 minutes. Shard
            # across runners while retaining the sanitizer's single-worker mode.
            shard: 0
            cc: gcc
            sanitizer: undefined
            gc: default
            timeout: 150
            vflags: -cc gcc -cflags -fno-omit-frame-pointer
            ubsan_options: print_stacktrace=1:halt_on_error=1:print_suppressions=0:suppressions=/home/runner/work/v/v/.github/workflows/run_sanitizers_undefined.suppressions
          - name: undefined-gcc
            shard: 1
            cc: gcc
            sanitizer: undefined
            gc: default
            timeout: 150
            vflags: -cc gcc -cflags -fno-omit-frame-pointer
            ubsan_options: print_stacktrace=1:halt_on_error=1:print_suppressions=0:suppressions=/home/runner/work/v/v/.github/workflows/run_sanitizers_undefined.suppressions
          - name: undefined-gcc
            shard: 2
            cc: gcc
            sanitizer: undefined
            gc: default
            timeout: 150
            vflags: -cc gcc -cflags -fno-omit-frame-pointer
            ubsan_options: print_stacktrace=1:halt_on_error=1:print_suppressions=0:suppressions=/home/runner/work/v/v/.github/workflows/run_sanitizers_undefined.suppressions
          - name: undefined-gcc
            shard: 3
            cc: gcc
            sanitizer: undefined
            gc: default
            timeout: 150
            vflags: -cc gcc -cflags -fno-omit-frame-pointer
            ubsan_options: print_stacktrace=1:halt_on_error=1:print_suppressions=0:suppressions=/home/runner/work/v/v/.github/workflows/run_sanitizers_undefined.suppressions
          - name: address-clang
            cc: clang
            sanitizer: address
            gc: default
            timeout: 300
            vflags: -cc clang -cflags -fno-omit-frame-pointer
            asan_options: detect_leaks=1
            lsan_options: max_leaks=1:print_suppressions=0:suppressions=/home/runner/work/v/v/.github/workflows/run_sanitizers_leak.suppressions
          - name: address-gcc
            cc: gcc
            sanitizer: address
            gc: default
            timeout: 300
            vflags: -cc gcc -cflags -fno-omit-frame-pointer
            asan_options: detect_leaks=1
            lsan_options: max_leaks=1:print_suppressions=0:suppressions=/home/runner/work/v/v/.github/workflows/run_sanitizers_leak.suppressions
          - name: memory-clang
            cc: clang
            sanitizer: memory
            gc: none
            timeout: 300
            # Some tests explicitly select Boehm. Build its source with MSan too;
            # the prebuilt archive cannot update the sanitizer's shadow memory.
            # AES-NI intrinsics let MSan track mbedTLS output writes on this x86_64 runner.
            vflags: >-
              -cc clang -gc none -d use_bundled_libgc -cflags -fno-omit-frame-pointer
              -cflags -maes -cflags -mpclmul
          - name: memory-clang-compiler
            cc: clang
            sanitizer: memory
            gc: none
            timeout: 300
            vflags: -cc clang -gc none -cflags -fno-omit-frame-pointer
          - name: address-clang-without-gc
            cc: clang
            sanitizer: address
            gc: none
            timeout: 300
            vflags: -cc clang -gc none -cflags -fno-omit-frame-pointer
            lsan_options: detect_leaks=0
    name: sanitize-${{ matrix.name }}${{ matrix.name == 'undefined-gcc' && format(' (shard {0})', matrix.shard) || '' }}
    env:
      # Stop a failing test session at its first failure instead of
      # running the whole suite to completion; the remaining files
      # add no signal.
      VTEST_FAIL_FAST: '1'
      SANITIZER_GITHUB_JOB: sanitize-${{ matrix.name }}
      VFLAGS: ${{ matrix.vflags }}
      VJOBS: 1
      VTEST_SELF_SHARD_INDEX: ${{ matrix.shard || 0 }}
      VTEST_SELF_SHARD_COUNT: ${{ matrix.name == 'undefined-gcc' && '4' || '1' }}
      UBSAN_OPTIONS: ${{ matrix.ubsan_options }}
      ASAN_OPTIONS: ${{ matrix.asan_options }}
      LSAN_OPTIONS: ${{ matrix.lsan_options }}
      VNATIVE_SKIP_LIBC_VV: 1
      VTEST_SHOW_LONGEST_BY_RUNTIME: 3
      VTEST_SHOW_LONGEST_BY_COMPTIME: 3
      VTEST_SHOW_LONGEST_BY_TOTALTIME: 3
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/cache-apt-packages-action
        # The shared cache key does not include the Ubuntu version. MSan uses
        # the explicit install below to avoid restoring 22.04 packages on 24.04.
        if: ${{ matrix.sanitizer != 'memory' }}
        with:
          profile: sanitizers
      - uses: ./.github/actions/setup-v
        with:
          symlink: true
      - name: V doctor
        if: ${{ matrix.name != 'memory-clang-compiler' }}
        run: GITHUB_JOB="$SANITIZER_GITHUB_JOB" ./v doctor
      - name: Ensure code is well formatted
        if: ${{ matrix.name != 'memory-clang-compiler' }}
        run: GITHUB_JOB="$SANITIZER_GITHUB_JOB" ./v -silent test-cleancode
      - name: Install dependencies
        run: |
          export GITHUB_JOB="$SANITIZER_GITHUB_JOB"
          .github/workflows/disable_azure_mirror.sh
          ./v retry -- sudo apt update
          ./v retry -- sudo apt install --quiet -y $SANITIZER_BASE_PACKAGES
          ./v retry -- sudo apt install --quiet -y $SANITIZER_GRAPHICS_PACKAGES
          ./v retry -- sudo apt install $SANITIZER_CLANG_PACKAGES
      - name: Build instrumented libpq for MemorySanitizer
        if: ${{ matrix.name == 'memory-clang' }}
        run: |
          ./v retry -- sudo apt install --quiet -y bison flex
          prefix="$RUNNER_TEMP/v-msan-libpq"
          bash .github/workflows/build_msan_libpq.sh "$prefix"
          echo "PKG_CONFIG_PATH=$prefix/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$prefix/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
      - name: Build instrumented SQLite for MemorySanitizer
        if: ${{ matrix.name == 'memory-clang' }}
        run: |
          prefix="$RUNNER_TEMP/v-msan-sqlite"
          bash .github/workflows/build_msan_sqlite.sh "$prefix"
          echo "PKG_CONFIG_PATH=$prefix/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}" >> "$GITHUB_ENV"
      - name: Build instrumented FreeType for MemorySanitizer
        if: ${{ matrix.name == 'memory-clang' }}
        run: |
          prefix="$RUNNER_TEMP/v-msan-freetype"
          bash .github/workflows/build_msan_freetype.sh "$prefix"
          echo "PKG_CONFIG_PATH=$prefix/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}" >> "$GITHUB_ENV"
      - name: Recompile optimized V with -cstrict
        run: |
          export GITHUB_JOB="$SANITIZER_GITHUB_JOB"
          if [ "${{ matrix.sanitizer }}" = "memory" ]; then
            ./v -prod -cc clang -cg -cstrict -o v cmd/v
          else
            ./v -prod -cg -cstrict -o v cmd/v
          fi
      - name: Self tests (-fsanitize=undefined)
        if: ${{ matrix.sanitizer == 'undefined' }}
        run: |
          export GITHUB_JOB="$SANITIZER_GITHUB_JOB"
          ./v -prod -cflags -fsanitize=undefined -o v2 cmd/v
          ./v2 -cflags -fsanitize=undefined -silent test-self vlib
      - name: Build examples (V compiled with -fsanitize=undefined)
        if: ${{ matrix.sanitizer == 'undefined' && (matrix.name != 'undefined-gcc' || matrix.shard == 0) }}
        run: GITHUB_JOB="$SANITIZER_GITHUB_JOB" ./v2 -silent build-examples
      - name: Self tests (-fsanitize=address)
        if: ${{ matrix.sanitizer == 'address' && matrix.name != 'memory-clang-compiler' && matrix.name != 'memory-clang' }}
        run: |
          export GITHUB_JOB="$SANITIZER_GITHUB_JOB"
          if [ "${{ matrix.cc }}" = "clang" ] && [ "${{ matrix.name }}" = "address-clang" ]; then
            ./v -cflags -fsanitize=address,pointer-compare,pointer-subtract -silent test-self vlib
          elif [ "${{ matrix.cc }}" = "gcc" ] && [ "${{ matrix.name }}" = "address-gcc" ]; then
            ./v -cflags -fsanitize=address -silent test-self vlib
          else
            ./v -cflags -fsanitize=address -silent test-self vlib
          fi
      - name: Test vlib/v/tests/ (V compiled with -fsanitize=address)
        if: ${{ matrix.sanitizer == 'address' && (matrix.name == 'address-clang' || matrix.name == 'address-gcc') }}
        run: |
          export GITHUB_JOB="$SANITIZER_GITHUB_JOB"
          if [ "${{ matrix.name }}" = "address-clang" ]; then
            ./v -prod -cflags -fsanitize=address -o v cmd/v
            ./v -cc tcc -silent test-self -asan-compiler vlib/v/tests/
          else
            ./v -prod -cflags -fsanitize=address,pointer-compare,pointer-subtract -o v cmd/v
            ./v -cc tcc -silent test-self -asan-compiler vlib/v/tests/
          fi
      - name: Build examples (V compiled with -fsanitize=address)
        if: ${{ matrix.name == 'address-clang' || matrix.name == 'address-gcc' }}
        run: GITHUB_JOB="$SANITIZER_GITHUB_JOB" ./v -silent build-examples
      - name: Self tests (-fsanitize=memory)
        if: ${{ matrix.name == 'memory-clang' }}
        run: GITHUB_JOB="$SANITIZER_GITHUB_JOB" ./v -cflags -fsanitize=memory -silent test-self -msan-compiler vlib
      - name: Test vlib/v/tests/ (V compiled with -fsanitize=memory)
        if: ${{ matrix.name == 'memory-clang-compiler' }}
        run: |
          GITHUB_JOB=sanitize-memory-clang ./v -prod -cflags -fsanitize=memory -o v cmd/v
          GITHUB_JOB=sanitize-memory-clang ./v -cc tcc -silent test-self -msan-compiler vlib/v/tests/
      - name: Build examples (V compiled with -fsanitize=memory)
        if: ${{ matrix.name == 'memory-clang-compiler' }}
        run: GITHUB_JOB=sanitize-memory-clang ./v -silent build-examples

  sanitize-address-msvc:
    if: github.ref == 'refs/heads/master'
    runs-on: windows-2025
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Vet alone consumed the old job's remaining 19 minutes after bootstrap.
        # Keep both cleancode sessions, with independent workers and deadlines.
        stage: [vet, fmt]
    env:
      # Stop a failing test session at its first failure instead of
      # running the whole suite to completion; the remaining files
      # add no signal.
      VTEST_FAIL_FAST: '1'
      VFLAGS: -cc msvc
      VJOBS: 4
      VTEST_CLEANCODE_STAGE: ${{ matrix.stage }}
      VTEST_SHOW_START: '1'
      VNATIVE_SKIP_LIBC_VV: 1
      VTEST_SHOW_LONGEST_BY_RUNTIME: 3
      VTEST_SHOW_LONGEST_BY_COMPTIME: 3
      VTEST_SHOW_LONGEST_BY_TOTALTIME: 3
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build
        run: |
          echo %VFLAGS%
          echo $VFLAGS
          .\makev.bat -msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\v.exe -prod -cc msvc self
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: V doctor
        run: .\v.exe doctor
      - name: Check code (${{ matrix.stage }})
        run: .\v.exe -silent test-cleancode
        # - name: Install dependencies
        #   run: |
        #     .\v.exe setup-freetype
        #     .\.github\workflows\windows-install-sqlite.bat
        # - name: Self tests (/fsanitize=address) # TODO:
        #   run: .\v.exe -cflags "/fsanitize=address" -silent test-self vlib
