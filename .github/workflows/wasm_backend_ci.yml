name: wasm backend CI

on:
  push:
    branches:
      - master
    paths:
      - 'cmd/tools/builders/**.v'
      - 'vlib/builtin/**.v'
      - 'vlib/v/**.v'
      - 'vlib/old/ast/**.v'
      - 'vlib/old/scanner/**.v'
      - 'vlib/old/parser/**.v'
      - 'vlib/old/checker/**.v'
      - 'vlib/old/gen/c/**.v'
      - 'vlib/old/builder/**.v'
      - 'vlib/old/cflag/**.v'
      - 'vlib/v/live/**.v'
      - 'vlib/old/util/**.v'
      - 'vlib/old/markused/**.v'
      - 'vlib/old/gen/wasm/**.v'
      - 'vlib/old/gen/wasm/tests/**.v'
      - 'vlib/old/gen/wasm/tests/**.vv'
      - 'vlib/old/gen/wasm/tests_decompile/**.v'
      - 'vlib/old/gen/wasm/tests_decompile/**.vv'
      - '**/wasm_backend_ci.yml'
  pull_request:
    paths:
      - 'cmd/tools/builders/**.v'
      - 'vlib/builtin/**.v'
      - 'vlib/v/**.v'
      - 'vlib/old/ast/**.v'
      - 'vlib/old/scanner/**.v'
      - 'vlib/old/parser/**.v'
      - 'vlib/old/checker/**.v'
      - 'vlib/old/gen/c/**.v'
      - 'vlib/old/builder/**.v'
      - 'vlib/old/cflag/**.v'
      - 'vlib/v/live/**.v'
      - 'vlib/old/util/**.v'
      - 'vlib/old/markused/**.v'
      - 'vlib/old/gen/wasm/**.v'
      - 'vlib/old/gen/wasm/tests/**.v'
      - 'vlib/old/gen/wasm/tests/**.vv'
      - 'vlib/old/gen/wasm/tests_decompile/**.v'
      - 'vlib/old/gen/wasm/tests_decompile/**.vv'
      - '**/wasm_backend_ci.yml'

concurrency:
  group: wasm-${{ github.workflow }}-${{ github.ref == 'refs/heads/master' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  wasm-backend:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-22.04, windows-2022]
      fail-fast: false
    timeout-minutes: 20
    env:
      VTEST_ONLY: wasm
    steps:
      - uses: actions/checkout@v7

      - name: Build V
        if: runner.os != 'Windows'
        run: make -j4
      - name: Build V (Windows)
        if: runner.os == 'Windows'
        run: ./makev.bat

      - name: Install WABT to get wasm-decompile
        if: runner.os != 'Windows'
        run: ./v retry -- sudo apt install wabt

      - name: Setup Wasmer
        uses: wasmerio/setup-wasmer@v3.1
        with:
          version: v4.4.0

      - name: Prebuild the WASM backend
        run: ./v cmd/tools/builders/wasm_builder.v

      - name: Test the WASM backend
        run: ./v test vlib/v/gen/wasm/

      - name: Build examples
        run: ./v build-examples
