name: wasm backend CI

on:
  push:
    branches:
      - master
    paths:
      - 'cmd/tools/builders/**.v'
      - 'vlib/builtin/**.v'
      - 'vlib/v/**.v'
      - 'vlib/v/ast/**.v'
      - 'vlib/v/scanner/**.v'
      - 'vlib/v/parser/**.v'
      - 'vlib/v/checker/**.v'
      - 'vlib/v/gen/c/**.v'
      - 'vlib/v/builder/**.v'
      - 'vlib/v/cflag/**.v'
      - 'vlib/v/live/**.v'
      - 'vlib/v/util/**.v'
      - 'vlib/v/markused/**.v'
      - 'vlib/v/gen/wasm/**.v'
      - 'vlib/v/gen/wasm/tests/**.v'
      - 'vlib/v/gen/wasm/tests/**.vv'
      - 'vlib/v/gen/wasm/tests_decompile/**.v'
      - 'vlib/v/gen/wasm/tests_decompile/**.vv'
      - '**/wasm_backend_ci.yml'
  pull_request:
    paths:
      - 'cmd/tools/builders/**.v'
      - 'vlib/builtin/**.v'
      - 'vlib/v/**.v'
      - 'vlib/v/ast/**.v'
      - 'vlib/v/scanner/**.v'
      - 'vlib/v/parser/**.v'
      - 'vlib/v/checker/**.v'
      - 'vlib/v/gen/c/**.v'
      - 'vlib/v/builder/**.v'
      - 'vlib/v/cflag/**.v'
      - 'vlib/v/live/**.v'
      - 'vlib/v/util/**.v'
      - 'vlib/v/markused/**.v'
      - 'vlib/v/gen/wasm/**.v'
      - 'vlib/v/gen/wasm/tests/**.v'
      - 'vlib/v/gen/wasm/tests/**.vv'
      - 'vlib/v/gen/wasm/tests_decompile/**.v'
      - 'vlib/v/gen/wasm/tests_decompile/**.vv'
      - '**/wasm_backend_ci.yml'

concurrency:
  group: wasm-${{ github.workflow }}-${{ github.ref == 'refs/heads/master' && github.sha || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  wasm-backend:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-22.04, windows-2022]
      fail-fast: false
    timeout-minutes: 20
    env:
      # Stop a failing test session at its first failure instead of
      # running the whole suite to completion; the remaining files
      # add no signal.
      VTEST_FAIL_FAST: '1'
      VTEST_ONLY: wasm
    steps:
      - uses: actions/checkout@v7
        id: uses_checkout_v7
        with:
          persist-credentials: false

      - name: Build V
        if: runner.os != 'Windows'
        run: make -j4
      - name: Build V (Windows)
        if: runner.os == 'Windows'
        run: ./makev.bat

      - name: Install WABT to get wasm-decompile
        if: runner.os != 'Windows'
        run: ./v retry -- sudo apt install wabt

      - name: Setup Wasmer
        id: setup_wasmer
        if: ${{ success() && !cancelled() && steps.uses_checkout_v7.outcome == 'success' }}
        uses: wasmerio/setup-wasmer@24b15c95293d23f89c68bd40dac76338f773e924 # v3.1
        with:
          version: v4.4.0

      - name: Prebuild the WASM backend
        id: prebuild_the_wasm_backend
        if: ${{ success() && !cancelled() && steps.setup_wasmer.outcome == 'success' }}
        run: ./v cmd/tools/builders/wasm_builder.v

      - name: Test the WASM backend
        id: test_the_wasm_backend
        if: ${{ success() && !cancelled() && steps.prebuild_the_wasm_backend.outcome == 'success' }}
        run: ./v test vlib/v/gen/wasm/

      - name: Build examples
        id: build_examples
        if: ${{ success() && !cancelled() && steps.test_the_wasm_backend.outcome == 'success' }}
        run: ./v build-examples
