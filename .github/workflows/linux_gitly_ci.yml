name: Linux CI (gitly_ci on play)

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# One dedicated runner queues every push; do not cancel earlier commits.
jobs:
  linux-gitly-ci:
    if: github.repository == 'vlang/v' && github.ref == 'refs/heads/master'
    runs-on: [self-hosted, Linux, X64, gitly-ci-play]
    timeout-minutes: 70
    env:
      GITLY_CI_URL: http://127.0.0.1:8081
      GITLY_CI_CONFIG_FILE: .gitly-ci.linux.yml
      GITLY_REPO_ID: ${{ github.repository_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Register V problem matchers from the runner checkout
        run: |
          for matcher in "$GITHUB_WORKSPACE"/.github/problem-matchers/*.json; do
            printf '::add-matcher::%s\n' "$matcher"
          done
      - name: Start isolated Gitly pipeline
        id: gitly_start
        run: python3 /opt/gitly-ci/github_ci_steps.py start
      - name: Build V from the pushed source
        run: python3 /opt/gitly-ci/github_ci_steps.py wait 1
      - name: V doctor
        run: python3 /opt/gitly-ci/github_ci_steps.py wait 2
      - name: V self compilation
        run: python3 /opt/gitly-ci/github_ci_steps.py wait 3
      - name: Verify the V test runner
        run: python3 /opt/gitly-ci/github_ci_steps.py wait 4
      - name: Test pure V math
        run: python3 /opt/gitly-ci/github_ci_steps.py wait 5
      - name: Test inline assembly
        run: python3 /opt/gitly-ci/github_ci_steps.py wait 6
      - name: V self tests
        run: python3 /opt/gitly-ci/github_ci_steps.py wait 7
      - name: Finish Gitly pipeline
        if: ${{ always() && steps.gitly_start.outcome == 'success' }}
        run: python3 /opt/gitly-ci/github_ci_steps.py finish
