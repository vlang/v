name: Update tccbin

run-name: ${{ inputs.resume_handoff_id && format('tccbin-recovery-{0}', inputs.resume_handoff_id) || inputs.native_gate_consumer_id && format('tccbin-gate-{0}', inputs.native_gate_consumer_id) || 'Update tccbin' }}

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Platform bundle to rebuild'
        type: choice
        required: true
        default: none
        options:
          - none
          - linux-amd64
          - macos-amd64
          - macos-arm64
          - freebsd-amd64
          - openbsd-amd64
          - all
      tcc_commit:
        description: 'TinyCC ref, branch, or commit to build'
        required: false
        default: mob
      libgc_commit:
        description: 'bdwgc (Boehm GC) ref, branch, or commit to build - macOS amd64 only for now'
        required: false
        default: master
      libatomic_ops_commit:
        description: 'libatomic_ops ref, branch, or commit to build - macOS amd64 only for now'
        required: false
        default: master
      expected_tccbin_head:
        description: 'Expected current tccbin branch HEAD (required for a targeted publish)'
        required: false
        default: ''
      publish:
        description: 'Push the rebuilt bundle to vlang/tccbin'
        type: boolean
        required: false
        default: false
      force_rebuild:
        description: 'Rebuild even when tccbin already records the same TinyCC hash'
        type: boolean
        required: false
        default: false
      native_gate_consumer_id:
        description: 'Opaque persisted native-gate consumer identifier (dark mode)'
        required: false
        default: ''
      resume_handoff_id:
        description: 'Opaque persisted source-recovery handoff identifier (dark mode)'
        required: false
        default: ''
  schedule:
    - cron: '17 3 1 * *'

permissions:
  contents: read

concurrency:
  group: update-tccbin
  cancel-in-progress: false
  queue: max

jobs:
  control:
    runs-on: ubuntu-latest
    outputs:
      target: ${{ steps.control.outputs.target }}
      publish: ${{ steps.control.outputs.publish }}
      force_rebuild: ${{ steps.control.outputs.force_rebuild }}
      hosted_matrix: ${{ steps.control.outputs.hosted_matrix }}
      bsd_matrix: ${{ steps.control.outputs.bsd_matrix }}
      has_hosted: ${{ steps.control.outputs.has_hosted }}
      has_bsd: ${{ steps.control.outputs.has_bsd }}
      phase_a_dark_mode: ${{ steps.control.outputs.phase_a_dark_mode }}
      phase_a_receiver_id: ${{ steps.control.outputs.phase_a_receiver_id }}
    steps:
      - name: Validate request and select build matrices
        id: control
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_TARGET: ${{ inputs.target || 'none' }}
          REQUESTED_PUBLISH: ${{ inputs.publish && 'true' || 'false' }}
          REQUESTED_FORCE_REBUILD: ${{ inputs.force_rebuild && 'true' || 'false' }}
          EXPECTED_TCCBIN_HEAD: ${{ inputs.expected_tccbin_head || '' }}
          TCC_COMMIT: ${{ inputs.tcc_commit || 'mob' }}
          LIBGC_COMMIT: ${{ inputs.libgc_commit || 'master' }}
          LIBATOMIC_OPS_COMMIT: ${{ inputs.libatomic_ops_commit || 'master' }}
          SCHEDULE_PUBLISH_UNLOCKED: ${{ vars.TCCBIN_SCHEDULE_PUBLISH_UNLOCKED }}
          NATIVE_GATE_CONSUMER_ID: ${{ inputs.native_gate_consumer_id || '' }}
          RESUME_HANDOFF_ID: ${{ inputs.resume_handoff_id || '' }}
        run: |
          set -euo pipefail

          if [ -n "$NATIVE_GATE_CONSUMER_ID" ] || [ -n "$RESUME_HANDOFF_ID" ]; then
            [ "$EVENT_NAME" = workflow_dispatch ]
            case "$GITHUB_REPOSITORY" in
              vlang/v|GGRei/v) ;;
              *) exit 1 ;;
            esac
            [ "$GITHUB_REF" = refs/heads/master ]
            [ "$REQUESTED_TARGET" = none ]
            [ "$REQUESTED_PUBLISH" = false ]
            [ "$REQUESTED_FORCE_REBUILD" = false ]
            [ -z "$EXPECTED_TCCBIN_HEAD" ]
            if [ -n "$NATIVE_GATE_CONSUMER_ID" ] && [ -n "$RESUME_HANDOFF_ID" ]; then
              echo "::error::select exactly one persisted consumer or recovery handoff"
              exit 1
            fi
            opaque_id="${NATIVE_GATE_CONSUMER_ID:-$RESUME_HANDOFF_ID}"
            if [[ ! "$opaque_id" =~ ^[0-9a-f]{64}$ ]]; then
              echo "::error::dark-mode identifier must be a lowercase SHA-256"
              exit 1
            fi
            {
              echo 'target=none'
              echo 'publish=false'
              echo 'force_rebuild=false'
              echo 'hosted_matrix={"include":[]}'
              echo 'bsd_matrix={"include":[]}'
              echo 'has_hosted=false'
              echo 'has_bsd=false'
              echo 'phase_a_dark_mode=true'
              echo "phase_a_receiver_id=$opaque_id"
            } >> "$GITHUB_OUTPUT"
            echo 'phase_a_dark_mode=true'
            exit 0
          fi

          # Keep execution authorization here. A fork-only validation
          # commit may change the workflow_dispatch repository literal;
          # the independent push guards below must remain vlang/v-only.
          case "$EVENT_NAME:$GITHUB_REPOSITORY" in
            workflow_dispatch:vlang/v)
              ;;
            schedule:vlang/v)
              if [ "$GITHUB_REF" != 'refs/heads/master' ]; then
                echo "::error::scheduled runs are only allowed on refs/heads/master"
                exit 1
              fi
              ;;
            *)
              echo "::error::this workflow event/repository combination is not authorized"
              exit 1
              ;;
          esac

          case "$REQUESTED_PUBLISH:$REQUESTED_FORCE_REBUILD" in
            true:true|true:false|false:true|false:false)
              ;;
            *)
              echo "::error::publish and force_rebuild must be booleans"
              exit 1
              ;;
          esac

          if [ "$EVENT_NAME" = 'schedule' ]; then
            target=all
            force_rebuild=false
            publish=false
            if [ "$SCHEDULE_PUBLISH_UNLOCKED" = 'true' ]; then
              publish=true
            fi
          else
            target=$REQUESTED_TARGET
            force_rebuild=$REQUESTED_FORCE_REBUILD
            publish=$REQUESTED_PUBLISH

            case "$target" in
              linux-amd64|macos-amd64|macos-arm64|freebsd-amd64|openbsd-amd64|all)
                ;;
              none)
                echo "::error::target=none is fail-closed; select an explicit target"
                exit 1
                ;;
              *)
                echo "::error::invalid target: $target"
                exit 1
                ;;
            esac

            if [ "$publish" = 'true' ] && [ "$GITHUB_REF" != 'refs/heads/master' ]; then
              echo "::error::manual publication is only allowed from refs/heads/master"
              exit 1
            fi
            if [ "$publish" = 'true' ] && [ "$target" = 'all' ]; then
              echo "::error::manual target=all publication is not supported"
              exit 1
            fi
            if [ "$publish" = 'true' ] && [ -z "$EXPECTED_TCCBIN_HEAD" ]; then
              echo "::error::expected_tccbin_head is required for publication"
              exit 1
            fi
          fi

          if [ -n "$EXPECTED_TCCBIN_HEAD" ] \
            && [[ ! "$EXPECTED_TCCBIN_HEAD" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::expected_tccbin_head must be a full lowercase commit SHA"
            exit 1
          fi

          hosted_matrix='{"include":[]}'
          bsd_matrix='{"include":[]}'
          has_hosted=false
          has_bsd=false

          case "$target" in
            linux-amd64)
              hosted_matrix='{"include":[{"id":"linux-amd64","publish_unlock_variable":"TCCBIN_LINUX_AMD64_PUBLISH_UNLOCKED","os":"ubuntu-latest","branch":"thirdparty-linux-amd64","script":"thirdparty/build_scripts/thirdparty-linux-amd64_tcc.sh"}]}'
              has_hosted=true
              ;;
            macos-amd64)
              hosted_matrix='{"include":[{"id":"macos-amd64","publish_unlock_variable":"TCCBIN_MACOS_AMD64_PUBLISH_UNLOCKED","os":"macos-15-intel","branch":"thirdparty-macos-amd64","script":"thirdparty/build_scripts/thirdparty-macos-amd64_tcc.sh"}]}'
              has_hosted=true
              ;;
            macos-arm64)
              hosted_matrix='{"include":[{"id":"macos-arm64","publish_unlock_variable":"TCCBIN_MACOS_ARM64_PUBLISH_UNLOCKED","os":"macos-latest","branch":"thirdparty-macos-arm64","script":"thirdparty/build_scripts/thirdparty-macos-arm64_tcc.sh"}]}'
              has_hosted=true
              ;;
            freebsd-amd64)
              bsd_matrix='{"include":[{"id":"freebsd-amd64","publish_unlock_variable":"TCCBIN_FREEBSD_AMD64_PUBLISH_UNLOCKED","operating_system":"freebsd","version":"15.1","branch":"thirdparty-freebsd-amd64","script":"thirdparty/build_scripts/thirdparty-freebsd-amd64_tcc.sh","install":"sudo pkg install -y bash git gmake rsync","cc":"cc"}]}'
              has_bsd=true
              ;;
            openbsd-amd64)
              bsd_matrix='{"include":[{"id":"openbsd-amd64","publish_unlock_variable":"TCCBIN_OPENBSD_AMD64_PUBLISH_UNLOCKED","operating_system":"openbsd","version":"7.8","branch":"thirdparty-openbsd-amd64","script":"thirdparty/build_scripts/thirdparty-openbsd-amd64_tcc.sh","install":"sudo pkg_add bash git gmake rsync","cc":"clang"}]}'
              has_bsd=true
              ;;
            all)
              hosted_matrix='{"include":[{"id":"linux-amd64","publish_unlock_variable":"TCCBIN_LINUX_AMD64_PUBLISH_UNLOCKED","os":"ubuntu-latest","branch":"thirdparty-linux-amd64","script":"thirdparty/build_scripts/thirdparty-linux-amd64_tcc.sh"},{"id":"macos-amd64","publish_unlock_variable":"TCCBIN_MACOS_AMD64_PUBLISH_UNLOCKED","os":"macos-15-intel","branch":"thirdparty-macos-amd64","script":"thirdparty/build_scripts/thirdparty-macos-amd64_tcc.sh"},{"id":"macos-arm64","publish_unlock_variable":"TCCBIN_MACOS_ARM64_PUBLISH_UNLOCKED","os":"macos-latest","branch":"thirdparty-macos-arm64","script":"thirdparty/build_scripts/thirdparty-macos-arm64_tcc.sh"}]}'
              bsd_matrix='{"include":[{"id":"freebsd-amd64","publish_unlock_variable":"TCCBIN_FREEBSD_AMD64_PUBLISH_UNLOCKED","operating_system":"freebsd","version":"15.1","branch":"thirdparty-freebsd-amd64","script":"thirdparty/build_scripts/thirdparty-freebsd-amd64_tcc.sh","install":"sudo pkg install -y bash git gmake rsync","cc":"cc"},{"id":"openbsd-amd64","publish_unlock_variable":"TCCBIN_OPENBSD_AMD64_PUBLISH_UNLOCKED","operating_system":"openbsd","version":"7.8","branch":"thirdparty-openbsd-amd64","script":"thirdparty/build_scripts/thirdparty-openbsd-amd64_tcc.sh","install":"sudo pkg_add bash git gmake rsync","cc":"clang"}]}'
              has_hosted=true
              has_bsd=true
              ;;
          esac

          {
            echo "target=$target"
            echo "publish=$publish"
            echo "force_rebuild=$force_rebuild"
            echo "hosted_matrix=$hosted_matrix"
            echo "bsd_matrix=$bsd_matrix"
            echo "has_hosted=$has_hosted"
            echo "has_bsd=$has_bsd"
            echo "phase_a_dark_mode=false"
          } >> "$GITHUB_OUTPUT"

          echo "event=$EVENT_NAME"
          echo "target=$target"
          echo "publish=$publish"
          echo "force_rebuild=$force_rebuild"
          echo "tcc_commit=$TCC_COMMIT"
          echo "libgc_commit=$LIBGC_COMMIT"
          echo "libatomic_ops_commit=$LIBATOMIC_OPS_COMMIT"
          if [ -n "$EXPECTED_TCCBIN_HEAD" ]; then
            echo "expected_tccbin_head=$EXPECTED_TCCBIN_HEAD"
          else
            echo "expected_tccbin_head=<unset>"
          fi

  phase-a-dark-mode:
    needs: control
    if: needs.control.outputs.phase_a_dark_mode == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout the trusted workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Build the local compiler
        run: |
          make
          ./v -o ./vnew cmd/v
      - name: Validate the persisted-consumer receiver without any write capability
        env:
          RECEIVER_ID: ${{ needs.control.outputs.phase_a_receiver_id }}
        run: |
          ./vnew run thirdparty/tccbin_automation/bin/cmd receiver \
            thirdparty/tccbin_automation/tests/fixtures/receiver-ledger.dark.json \
            "$RECEIVER_ID" vlang/v 1001 .github/workflows/update_tccbin.yml \
            master workflow_dispatch 0 0 none none \
            aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
            aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa false

  resolve-sources:
    needs: control
    if: needs.control.outputs.has_hosted == 'true' || needs.control.outputs.has_bsd == 'true'
    runs-on: ubuntu-latest
    outputs:
      tinycc_hash: ${{ steps.tinycc.outputs.hash }}
      libgc_hash: ${{ steps.bdwgc.outputs.libgc_hash }}
      libatomic_ops_hash: ${{ steps.bdwgc.outputs.libatomic_ops_hash }}
    steps:
      - name: Resolve TinyCC source hash
        id: tinycc
        shell: bash
        env:
          TCC_COMMIT: ${{ inputs.tcc_commit || 'mob' }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if git clone --quiet https://repo.or.cz/tinycc.git /tmp/tinycc-ref; then
              break
            fi
            rm -rf /tmp/tinycc-ref
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep "$((attempt * 5))"
          done
          git -C /tmp/tinycc-ref checkout --quiet "$TCC_COMMIT"
          hash="$(git -C /tmp/tinycc-ref rev-parse HEAD)"
          echo "hash=$hash" >> "$GITHUB_OUTPUT"
          echo "TinyCC $TCC_COMMIT resolves to $hash"

      - name: Resolve bdwgc and libatomic_ops source hashes
        if: needs.control.outputs.target == 'macos-amd64' || needs.control.outputs.target == 'all'
        id: bdwgc
        shell: bash
        env:
          LIBGC_COMMIT: ${{ inputs.libgc_commit || 'master' }}
          LIBATOMIC_OPS_COMMIT: ${{ inputs.libatomic_ops_commit || 'master' }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if git clone --quiet https://github.com/ivmai/bdwgc /tmp/bdwgc-ref; then
              break
            fi
            rm -rf /tmp/bdwgc-ref
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep "$((attempt * 5))"
          done
          git -C /tmp/bdwgc-ref checkout --quiet "$LIBGC_COMMIT"
          libgc_hash="$(git -C /tmp/bdwgc-ref rev-parse HEAD)"
          echo "libgc_hash=$libgc_hash" >> "$GITHUB_OUTPUT"
          echo "bdwgc $LIBGC_COMMIT resolves to $libgc_hash"

          for attempt in 1 2 3; do
            if git clone --quiet https://github.com/bdwgc/libatomic_ops /tmp/libatomic_ops-ref; then
              break
            fi
            rm -rf /tmp/libatomic_ops-ref
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep "$((attempt * 5))"
          done
          git -C /tmp/libatomic_ops-ref checkout --quiet "$LIBATOMIC_OPS_COMMIT"
          libatomic_ops_hash="$(git -C /tmp/libatomic_ops-ref rev-parse HEAD)"
          echo "libatomic_ops_hash=$libatomic_ops_hash" >> "$GITHUB_OUTPUT"
          echo "libatomic_ops $LIBATOMIC_OPS_COMMIT resolves to $libatomic_ops_hash"

  update-tccbin-hosted:
    needs:
      - control
      - resolve-sources
    if: needs.control.outputs.has_hosted == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.control.outputs.hosted_matrix) }}
    runs-on: ${{ matrix.os }}
    env:
      TARGET: ${{ needs.control.outputs.target }}
      TCC_COMMIT: ${{ needs.resolve-sources.outputs.tinycc_hash }}
      LIBGC_COMMIT: ${{ needs.resolve-sources.outputs.libgc_hash }}
      LIBATOMIC_OPS_COMMIT: ${{ needs.resolve-sources.outputs.libatomic_ops_hash }}
      EXPECTED_TCCBIN_HEAD: ${{ inputs.expected_tccbin_head || '' }}
      TCCBIN_REPO: vlang/tccbin
      PUBLISH: ${{ needs.control.outputs.publish }}
      FORCE_REBUILD: ${{ needs.control.outputs.force_rebuild }}
      ## Bump whenever the macos-amd64 paired-rebuild recipe (this
      ## workflow's macos-amd64-scoped steps, or the _bdwgc*.sh scripts
      ## they call) changes materially, independent of any upstream
      ## SHA - lets "Check whether rebuild is needed" force a rebuild on
      ## a recipe change alone.
      MACOS_AMD64_RECIPE_VERSION: '2'
      ## Single source of truth for both halves of the macos-amd64
      ## pair - passed explicitly to both scripts below rather than
      ## relying on their own internal defaults, so this check step
      ## and the actual build can never independently drift.
      MACOSX_DEPLOYMENT_TARGET: '10.13'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Checkout the immutable VC bootstrap snapshot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: vlang/vc
          ref: dfc458a13ba8923ebc249e262c331f8169aa728b
          path: .tccbin-bootstrap-vc
          fetch-depth: 0
          persist-credentials: false

      - name: Bootstrap the contract-bound Phase A validator before staging
        shell: bash
        run: |
          set -euo pipefail
          contract_input="$RUNNER_TEMP/tccbin-validator-contract-input"
          validator_work="$RUNNER_TEMP/tccbin-validator-work"
          vc_root="$GITHUB_WORKSPACE/.tccbin-bootstrap-vc"
          test ! -e "$contract_input"
          test ! -e "$validator_work"
          git -c protocol.file.allow=always clone --quiet --no-checkout --no-local \
            --no-hardlinks "$GITHUB_WORKSPACE" "$contract_input"
          git -C "$contract_input" config --local core.autocrlf false
          git -C "$contract_input" remote set-url origin \
            "https://github.com/${GITHUB_REPOSITORY}"
          git -C "$contract_input" checkout --quiet --detach --force "$GITHUB_SHA"
          git -C "$vc_root" config --local core.autocrlf false
          "$contract_input/thirdparty/tccbin_automation/bootstrap/bootstrap.sh" \
            "$contract_input" "$GITHUB_REPOSITORY" "$GITHUB_SHA" \
            "$vc_root" "$validator_work"
          validator_cli="$validator_work/tccbin-automation"
          validator_contract_root="$validator_work/contract-source"
          test -x "$validator_cli"
          test -d "$validator_contract_root"
          binding="$("$validator_cli" contract-binding)"
          test "$binding" = \
            "repository=${GITHUB_REPOSITORY} sha=${GITHUB_SHA}"
          {
            echo "TCCBIN_VALIDATOR_CLI=$validator_cli"
            echo "TCCBIN_VALIDATOR_CONTRACT_ROOT=$validator_contract_root"
          } >> "$GITHUB_ENV"

      - name: Test tccbin workflow preservation
        if: matrix.id == 'linux-amd64'
        run: bash thirdparty/build_scripts/tccbin_workflow_preservation_test.sh

      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: brew install make

      - name: Install macOS build dependencies (bdwgc rebuild)
        if: matrix.id == 'macos-amd64'
        ## automake/libtool are needed by bdwgc's autogen.sh (aclocal,
        ## libtoolize) - exact match to vlang/tccbin's own already-
        ## proven CI step for this same rebuild.
        run: brew install make automake libtool

      - name: Test macOS deployment-target load-command parser
        if: matrix.id == 'macos-amd64'
        shell: bash
        run: |
          set -euo pipefail
          validator=thirdparty/build_scripts/thirdparty-macos-amd64_bdwgc_validate.sh
          fixture_dir=$(mktemp -d)
          trap 'rm -rf "$fixture_dir"' EXIT

          cat > "$fixture_dir/build-version-10.13.txt" <<'EOF'
          Load command 8
                cmd LC_BUILD_VERSION
            cmdsize 32
           platform 1
              minos 10.13
                sdk 15.0
             ntools 1
          EOF
          cat > "$fixture_dir/version-min-10.13.txt" <<'EOF'
          Load command 8
                cmd LC_VERSION_MIN_MACOSX
            cmdsize 16
            version 10.13
                sdk 15.0
          EOF
          : > "$fixture_dir/empty.txt"
          cat > "$fixture_dir/duplicate.txt" <<'EOF'
          Load command 8
                cmd LC_BUILD_VERSION
            cmdsize 32
           platform 1
              minos 10.13
                sdk 15.0
             ntools 0
          Load command 9
                cmd LC_VERSION_MIN_MACOSX
            cmdsize 16
            version 10.13
                sdk 15.0
          EOF
          cat > "$fixture_dir/version-min-10.6.txt" <<'EOF'
          Load command 8
                cmd LC_VERSION_MIN_MACOSX
            cmdsize 16
            version 10.6
                sdk 15.0
          EOF
          cat > "$fixture_dir/build-version-ios.txt" <<'EOF'
          Load command 8
                cmd LC_BUILD_VERSION
            cmdsize 24
           platform 2
              minos 10.13
                sdk 15.0
             ntools 0
          EOF
          cat > "$fixture_dir/build-version-platform-missing.txt" <<'EOF'
          Load command 8
                cmd LC_BUILD_VERSION
            cmdsize 24
              minos 10.13
                sdk 15.0
             ntools 0
          EOF
          cat > "$fixture_dir/build-version-platform-duplicate.txt" <<'EOF'
          Load command 8
                cmd LC_BUILD_VERSION
            cmdsize 24
           platform 1
           platform 1
              minos 10.13
                sdk 15.0
             ntools 0
          EOF
          cat > "$fixture_dir/build-version-platform-malformed.txt" <<'EOF'
          Load command 8
                cmd LC_BUILD_VERSION
            cmdsize 24
           platform 1 trailing-field
              minos 10.13
                sdk 15.0
             ntools 0
          EOF
          cat > "$fixture_dir/build-version-platform-symbolic.txt" <<'EOF'
          Load command 8
                cmd LC_BUILD_VERSION
            cmdsize 24
           platform MACOS
              minos 10.13
                sdk 15.0
             ntools 0
          EOF
          cat > "$fixture_dir/build-version-cmd-malformed.txt" <<'EOF'
          Load command 8
                cmd LC_BUILD_VERSION trailing-field
            cmdsize 24
           platform 1
              minos 10.13
                sdk 15.0
             ntools 0
          EOF

          bash "$validator" --validate-macho-load-command-fixture \
            "$fixture_dir/build-version-10.13.txt"
          bash "$validator" --validate-macho-load-command-fixture \
            "$fixture_dir/version-min-10.13.txt"

          expect_rejected() {
            local fixture=$1
            local output
            local status
            set +e
            output=$(bash "$validator" --validate-macho-load-command-fixture "$fixture" 2>&1)
            status=$?
            set -e
            echo "$output"
            if [ "$status" -eq 0 ]; then
              echo "::error::deployment-target parser falsely accepted $fixture"
              return 1
            fi
          }

          expect_rejected "$fixture_dir/empty.txt"
          expect_rejected "$fixture_dir/duplicate.txt"
          expect_rejected "$fixture_dir/version-min-10.6.txt"
          expect_rejected "$fixture_dir/build-version-ios.txt"
          expect_rejected "$fixture_dir/build-version-platform-missing.txt"
          expect_rejected "$fixture_dir/build-version-platform-duplicate.txt"
          expect_rejected "$fixture_dir/build-version-platform-malformed.txt"
          expect_rejected "$fixture_dir/build-version-platform-symbolic.txt"
          expect_rejected "$fixture_dir/build-version-cmd-malformed.txt"

      - name: Clone resolved TinyCC source
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if git clone --quiet https://repo.or.cz/tinycc.git /tmp/tinycc-ref; then
              break
            fi
            rm -rf /tmp/tinycc-ref
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep "$((attempt * 5))"
          done
          git -C /tmp/tinycc-ref checkout --quiet "$TCC_COMMIT"
          test "$(git -C /tmp/tinycc-ref rev-parse HEAD)" = "$TCC_COMMIT"

      - name: Clone tccbin branch
        id: tccbin
        shell: bash
        run: |
          set -euo pipefail
          git clone --single-branch --branch "${{ matrix.branch }}" \
            "https://github.com/${TCCBIN_REPO}.git" thirdparty/tcc
          git -C thirdparty/tcc config --local core.autocrlf false
          echo "base_commit=$(git -C thirdparty/tcc rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "workflow_tree=$(git -C thirdparty/tcc rev-parse HEAD:.github/workflows)" >> "$GITHUB_OUTPUT"

      - name: Verify expected tccbin branch HEAD
        shell: bash
        run: |
          set -euo pipefail
          actual_head="$(git -C thirdparty/tcc rev-parse HEAD)"
          if [ -n "$EXPECTED_TCCBIN_HEAD" ] && [ "$actual_head" != "$EXPECTED_TCCBIN_HEAD" ]; then
            echo "::error::tccbin/${{ matrix.branch }} moved: expected $EXPECTED_TCCBIN_HEAD, got $actual_head"
            exit 1
          fi
          echo "tccbin/${{ matrix.branch }} base HEAD: $actual_head"

      - name: Check whether rebuild is needed
        id: rebuild
        shell: bash
        run: |
          set -euo pipefail
          skip=false
          if [ "$FORCE_REBUILD" != 'true' ] \
            && [ -f thirdparty/tcc/build_source_hash.txt ] \
            && [ "$(cat thirdparty/tcc/build_source_hash.txt)" = "$TCC_COMMIT" ]; then
            skip=true
            echo "tccbin/${{ matrix.branch }} already has TinyCC $TCC_COMMIT"
          fi

          # macos-amd64 ships a PAIR (tcc.exe + libgc) - a TinyCC-only
          # hash match isn't enough to skip, since libgc has its own
          # independent upstream (bdwgc/libatomic_ops), its own pinned
          # deployment target, and its own recipe. Fingerprint the whole
          # pair; skip only when every part of it, and the required
          # output files, are already exactly what a rebuild would
          # produce.
          if [ "${{ matrix.id }}" = 'macos-amd64' ] && [ "$skip" = 'true' ]; then
            reason=""
            if [ ! -f thirdparty/tcc/lib/libgc_build_source_hash.txt ] \
              || [ "$(cat thirdparty/tcc/lib/libgc_build_source_hash.txt)" != "$LIBGC_COMMIT" ]; then
              reason="bdwgc hash mismatch or missing"
            elif [ ! -f thirdparty/tcc/lib/libgc_build_libatomic_ops_source_hash.txt ] \
              || [ "$(cat thirdparty/tcc/lib/libgc_build_libatomic_ops_source_hash.txt)" != "$LIBATOMIC_OPS_COMMIT" ]; then
              reason="libatomic_ops hash mismatch or missing"
            elif [ ! -f thirdparty/tcc/build_macosx_deployment_target.txt ] \
              || [ "$(cat thirdparty/tcc/build_macosx_deployment_target.txt)" != "$MACOSX_DEPLOYMENT_TARGET" ]; then
              reason="deployment target mismatch or missing"
            elif [ ! -f thirdparty/tcc/build_toolchain_identity.txt ] \
              || [ "$(cat thirdparty/tcc/build_toolchain_identity.txt)" != "$(clang --version)" ]; then
              reason="toolchain identity mismatch or missing"
            elif [ ! -f thirdparty/tcc/lib/libgc_build_recipe_version.txt ] \
              || [ "$(cat thirdparty/tcc/lib/libgc_build_recipe_version.txt)" != "$MACOS_AMD64_RECIPE_VERSION" ]; then
              reason="recipe version mismatch or missing"
            elif [ ! -L thirdparty/tcc/lib/libgc.dylib ] \
              || [ ! -f "thirdparty/tcc/lib/$(readlink thirdparty/tcc/lib/libgc.dylib)" ]; then
              reason="libgc.dylib missing or not a valid symlink"
            elif [ ! -f thirdparty/tcc/bundle_checksums.txt ]; then
              reason="bundle_checksums.txt missing"
            elif ! (cd thirdparty/tcc && shasum -a 256 -c bundle_checksums.txt); then
              reason="bundle checksum verification failed"
            fi
            if [ -n "$reason" ]; then
              echo "macos-amd64 pair fingerprint mismatch ($reason) - forcing rebuild despite TinyCC hash match"
              skip=false
            fi
          fi

          if [ "$skip" = 'true' ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure git identity
        if: steps.rebuild.outputs.skip != 'true'
        run: |
          git config --global user.name vlang-bot
          git config --global user.email vlang-bot@users.noreply.github.com

      - name: Build TCC bundle
        if: steps.rebuild.outputs.skip != 'true'
        shell: bash
        env:
          BUILD_CMD: TCC_COMMIT=${{ env.TCC_COMMIT }} TCC_FOLDER=thirdparty/tcc bash ${{ matrix.script }}
          TCC_REPO: /tmp/tinycc-ref
        run: |
          set -euo pipefail
          TCC_FOLDER=thirdparty/tcc bash "${{ matrix.script }}"
          test "$(cat thirdparty/tcc/build_source_hash.txt)" = "$TCC_COMMIT"
          thirdparty/tcc/tcc.exe --version
          thirdparty/tcc/tcc.exe -v -v
          cat > /tmp/tcc-stdatomic-smoke.c <<'EOF'
          #include <stdatomic.h>
          int main(void) {
              atomic_int value = ATOMIC_VAR_INIT(0);
              atomic_store(&value, 1);
              return atomic_load(&value) == 1 ? 0 : 1;
          }
          EOF
          thirdparty/tcc/tcc.exe /tmp/tcc-stdatomic-smoke.c -o /tmp/tcc-stdatomic-smoke
          /tmp/tcc-stdatomic-smoke

      # macos-amd64 only, from here through the tar upload: rebuild
      # libgc.dylib in step with this same tcc.exe (the checked-in
      # libgc.a has been silently preserved untouched across every
      # prior rebuild, which is the root cause of the pair's
      # conformance failure this whole change addresses), validate the
      # pair, commit it separately from the tcc.exe commit above, then
      # re-validate against a genuinely independent fresh checkout
      # before ever considering it safe to upload/publish.
      - name: Build paired libgc (macOS amd64)
        if: matrix.id == 'macos-amd64' && steps.rebuild.outputs.skip != 'true'
        shell: bash
        env:
          CC: clang
          TCC_FOLDER: thirdparty/tcc
          RECIPE_VERSION: ${{ env.MACOS_AMD64_RECIPE_VERSION }}
        run: bash thirdparty/build_scripts/thirdparty-macos-amd64_bdwgc.sh

      - name: Validate staged tcc.exe + libgc pairing (build directory)
        if: matrix.id == 'macos-amd64' && steps.rebuild.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          validation_log="$(mktemp)"
          trap 'rm -f "$validation_log"' EXIT
          bash thirdparty/build_scripts/thirdparty-macos-amd64_bdwgc_validate.sh thirdparty/tcc \
            2>&1 | tee "$validation_log"
          if grep -Fq 'Static libgc.a linking now succeeds on macOS amd64' "$validation_log"; then
            echo "::error::static libgc.a XPASS requires a separate gate update before publication"
            exit 1
          fi

      - name: Record bundle checksums
        if: matrix.id == 'macos-amd64' && steps.rebuild.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd thirdparty/tcc
          libgc_dylib_target=$(readlink lib/libgc.dylib)
          # lib/libgc.dylib is a symlink - shasum follows it and hashes
          # the same content as lib/$libgc_dylib_target, but recording
          # it under this name too matters: it's the exact path V's
          # #flag @VEXEROOT/thirdparty/tcc/lib/libgc.dylib references,
          # so a consumer verifying the bundle checks the path that
          # actually gets used, not just its resolved target.
          shasum -a 256 tcc.exe lib/libgc.dylib "lib/$libgc_dylib_target" lib/libgc.a lib/libtcc.a lib/libtcc1.a > bundle_checksums.txt
          cat bundle_checksums.txt

      - name: Commit paired libgc rebuild
        if: matrix.id == 'macos-amd64' && steps.rebuild.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd thirdparty/tcc
          libgc_dylib_target=$(readlink lib/libgc.dylib)
          # -A (not a hardcoded file list) against these exact globs:
          # if bdwgc's SONAME bumped this run (e.g. libgc.1.dylib ->
          # libgc.2.dylib), the old versioned file was already removed
          # from disk by thirdparty-macos-amd64_bdwgc.sh's own cleanup
          # step, but a plain `git add <new-file-list>` never mentions
          # the old path, so its deletion would never get staged - the
          # stale file would keep reappearing from history on every
          # future checkout. `git add -A -- <pathspec>` stages adds AND
          # deletions matching the glob, so whatever SONAME disappeared
          # this run is captured without needing to know its name.
          #
          # Deliberately only libgc*.dylib/libgc*.a here, NOT libgc.la/
          # libgc.lai (which thirdparty-macos-amd64_bdwgc.sh's own
          # cleanup line also removes defensively, but rsyncs only from
          # bdwgc/.libs/ - libtool's .la/.lai wrapper files live one
          # level up and are never actually staged into lib/ in the
          # first place). `git add -A -- <pathspecs>` fails its ENTIRE
          # invocation (stages nothing, not even the globs that do
          # match) if even one pathspec matches zero files either
          # on disk or in the index - confirmed by testing. A glob for
          # a file that plausibly never exists here would turn this
          # into a hard failure on every single normal run, not just a
          # SONAME bump.
          git add -A -- 'lib/libgc*.dylib' 'lib/libgc*.a' lib/libgc_build_*.txt bundle_checksums.txt build_macosx_deployment_target.txt build_toolchain_identity.txt
          git status --porcelain
          git commit -m "pair libgc rebuild (bdwgc $LIBGC_COMMIT) with this tcc.exe rebuild"

      - name: Clone a fresh, independent checkout of the new commit
        if: matrix.id == 'macos-amd64' && steps.rebuild.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/tccbin-fresh-checkout
          # Clone from the LOCAL thirdparty/tcc, not GitHub - these
          # commits haven't been pushed yet, and the whole point is to
          # verify exactly what's about to be pushed, not what's
          # already public.
          git clone --quiet thirdparty/tcc /tmp/tccbin-fresh-checkout
          git -C /tmp/tccbin-fresh-checkout config --local core.autocrlf false
          if [ -n "$(git -C /tmp/tccbin-fresh-checkout status --porcelain)" ]; then
            echo "::error::fresh checkout of the new commit is not clean - something is untracked or modified that shouldn't be:"
            git -C /tmp/tccbin-fresh-checkout status
            exit 1
          fi
          echo "fresh checkout is clean at $(git -C /tmp/tccbin-fresh-checkout rev-parse HEAD)"

      - name: Re-validate against the fresh, independent checkout
        if: matrix.id == 'macos-amd64' && steps.rebuild.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          validation_log="$(mktemp)"
          trap 'rm -f "$validation_log"' EXIT
          bash thirdparty/build_scripts/thirdparty-macos-amd64_bdwgc_validate.sh /tmp/tccbin-fresh-checkout \
            2>&1 | tee "$validation_log"
          if grep -Fq 'Static libgc.a linking now succeeds on macOS amd64' "$validation_log"; then
            echo "::error::static libgc.a XPASS requires a separate gate update before publication"
            exit 1
          fi

      # This clone's own thirdparty/tcc has nothing to do with the
      # bundle staged above (a brand new clone doesn't have one yet),
      # so letting `make`'s default target bootstrap it normally here
      # is safe - unlike running `make` against the staged checkout
      # itself, which would `git clean -xf` away everything just built.
      #
      # Plain `make -j4`, deliberately NOT `make local=1`: both vc/ and
      # thirdparty/tcc are gitignored, so this fresh `git clone` starts
      # with neither. `local=1` makes the `latest_vc`/`latest_tcc`
      # targets skip their own git-clone bootstrap entirely (see
      # GNUmakefile's `ifndef local` branches) on the assumption that
      # vc/v.c already exists from an earlier step in the same
      # job - true in bootstrapping_ci.yml, which runs a plain `make`
      # first, but not true here. `make local=1` here would fail
      # outright with no vc/v.c to bootstrap v1 from. `latest_tcc`
      # cloning its own stock thirdparty/tcc under plain `make` is
      # harmless: the next step wholesale-replaces it with the staged,
      # fresh-checkout-validated bundle only after this `make` already
      # finished building ./v.
      - name: Build V from source in an isolated workspace
        if: matrix.id == 'macos-amd64' && steps.rebuild.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/v-bootstrap-workspace
          git clone --quiet "https://github.com/${{ github.repository }}" /tmp/v-bootstrap-workspace
          git -C /tmp/v-bootstrap-workspace checkout --quiet "${{ github.sha }}"

          (cd /tmp/v-bootstrap-workspace && make -j4)

      - name: Prove a failing TCC cannot fall back to another compiler
        if: matrix.id == 'macos-amd64' && steps.rebuild.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          failing_tcc_dir=/tmp/v-intentionally-failing-tcc
          failing_tcc="$failing_tcc_dir/tcc.exe"
          invocation_marker=/tmp/v-intentionally-failing-tcc-invoked
          negative_binary=/tmp/v-no-tcc-fallback-probe
          mkdir -p "$failing_tcc_dir"
          rm -f "$invocation_marker" "$negative_binary"
          cat > "$failing_tcc" <<'EOF'
          #!/bin/sh
          printf '%s\n' "$@" > /tmp/v-intentionally-failing-tcc-invoked
          echo "tcc: error: intentional no-fallback probe failure" >&2
          exit 86
          EOF
          chmod 700 "$failing_tcc"
          cat > /tmp/v-no-tcc-fallback-probe.v <<'EOF'
          module main

          fn main() {
              println('this binary must never be produced')
          }
          EOF

          set +e
          negative_output=$(
            /tmp/v-bootstrap-workspace/v \
              -cc "$failing_tcc" \
              -gc none \
              -showcc \
              -no-retry-compilation \
              -no-rsp \
              -o "$negative_binary" \
              /tmp/v-no-tcc-fallback-probe.v 2>&1
          )
          negative_status=$?
          set -e
          echo "$negative_output"

          if [ ! -f "$invocation_marker" ]; then
            echo "::error::the intentionally failing TCC was never invoked"
            exit 1
          fi
          if ! grep -Eq '\.c$' "$invocation_marker"; then
            echo "::error::the intentionally failing TCC did not receive a generated C source"
            exit 1
          fi
          if [ "$negative_status" -eq 0 ]; then
            echo "::error::V reported success after the intentionally failing TCC"
            exit 1
          fi
          if [ -e "$negative_binary" ]; then
            echo "::error::a binary was produced after the intentionally failing TCC"
            exit 1
          fi
          if ! grep -Fq 'intentional no-fallback probe failure' <<< "$negative_output"; then
            echo "::error::the intentionally failing TCC error was not propagated"
            exit 1
          fi
          if grep -Eiq 'falling back to|retrying with|fallback compiler|backup compiler' \
            <<< "$negative_output"; then
            echo "::error::V attempted a compiler fallback despite -no-retry-compilation"
            exit 1
          fi
          echo "confirmed: the failing TCC produced neither a fallback nor a binary"

      - name: Real V + tcc + boehm compile-and-execute smoke test
        if: matrix.id == 'macos-amd64' && steps.rebuild.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          # Point the isolated-workspace V's @VEXEROOT/thirdparty/tcc
          # resolution at the exact, fresh-checkout-validated staged
          # bundle - copied in only now, after `make` already built
          # ./v using its own unrelated bootstrap, never before.
          rm -rf /tmp/v-bootstrap-workspace/thirdparty/tcc
          cp -a /tmp/tccbin-fresh-checkout /tmp/v-bootstrap-workspace/thirdparty/tcc

          cat > /tmp/tcc_boehm_gc_smoke.v <<'EOF'
          module main

          fn main() {
              mut arrs := [][]int{}
              for i in 0 .. 20000 {
                  arrs << [i, i * 2, i * 3]
              }
              gc_collect()
              mut sum := i64(0)
              for a in arrs {
                  sum += a[0]
              }
              println('sum=${sum}')
              if sum != i64(20000) * 19999 / 2 {
                  eprintln('mismatch: got ${sum}')
                  exit(1)
              }
          }
          EOF

          showcc_output=$(
            /tmp/v-bootstrap-workspace/v \
              -cc tcc \
              -gc boehm \
              -showcc \
              -no-retry-compilation \
              -no-rsp \
              -o /tmp/tcc_boehm_gc_smoke \
              /tmp/tcc_boehm_gc_smoke.v 2>&1
          )
          echo "$showcc_output"

          # @VEXEROOT resolves relative to the isolated workspace (where
          # ./v itself lives and runs from), NOT this job's own working
          # directory - the staged bundle only got copied into the
          # isolated workspace's thirdparty/tcc, so that's the path a
          # correct run must actually reference.
          expected_tcc_root="$(cd /tmp/v-bootstrap-workspace/thirdparty/tcc && pwd -P)"
          expected_tcc="$expected_tcc_root/tcc.exe"
          expected_libgc="$expected_tcc_root/lib/libgc.dylib"
          expected_rpath="$expected_tcc_root/lib"
          if grep -Eiq 'falling back to|retrying with|fallback compiler|backup compiler' \
            <<< "$showcc_output"; then
            echo "::error::V attempted a compiler fallback during the real smoke test"
            exit 1
          fi

          SHOWCC_OUTPUT="$showcc_output" \
            EXPECTED_TCC="$expected_tcc" \
            EXPECTED_LIBGC="$expected_libgc" \
            EXPECTED_RPATH="$expected_rpath" \
            EXPECTED_BINARY=/tmp/tcc_boehm_gc_smoke \
            python3 - <<'PYEOF'
          import os
          import shlex
          import sys

          prefix = '> C compiler cmd: '
          expected_binary = os.environ['EXPECTED_BINARY']
          expected_tcc = os.environ['EXPECTED_TCC']
          expected_libgc = os.environ['EXPECTED_LIBGC']
          expected_rpath = f"-Wl,-rpath,{os.environ['EXPECTED_RPATH']}"


          class ValidationError(Exception):
              def __init__(self, kind, message):
                  super().__init__(message)
                  self.kind = kind


          # This raw allowlist is deliberately narrower than shell syntax and
          # applies even inside quotes. It admits only the ASCII characters
          # needed by this one fixed-format V compiler command. In particular,
          # glob/brace expansion cannot turn an apparently harmless token into
          # an @response-file token between validation and shell execution.
          allowed_ascii_punctuation = frozenset(" \t/._,+-=:'\"")


          def is_allowed_raw_character(character):
              return (
                  'a' <= character <= 'z'
                  or 'A' <= character <= 'Z'
                  or '0' <= character <= '9'
                  or character in allowed_ascii_punctuation
              )


          def validate_raw_command(raw_command):
              for index, character in enumerate(raw_command):
                  if not is_allowed_raw_character(character):
                      raise ValidationError(
                          'raw-character',
                          f'forbidden raw character U+{ord(character):04X} '
                          f'at offset {index} in -showcc command',
                      )


          def tokenize_command(raw_command):
              validate_raw_command(raw_command)
              try:
                  tokens = shlex.split(raw_command, comments=False, posix=True)
              except ValueError as error:
                  raise ValidationError(
                      'tokenization',
                      f'could not tokenize -showcc compiler command: {error}',
                  ) from error
              response_tokens = [token for token in tokens if token.startswith('@')]
              if response_tokens:
                  raise ValidationError(
                      'response-file',
                      f'response-file token(s) are forbidden: {response_tokens!r}',
                  )
              return tokens


          def validate_showcc(showcc_output):
              if '\n' in showcc_output or '\r' in showcc_output:
                  raise ValidationError(
                      'raw-character',
                      'line breaks are forbidden in -showcc output',
                  )
              if not showcc_output.startswith(prefix) or showcc_output.count(prefix) != 1:
                  raise ValidationError(
                      'command-count',
                      'expected exactly one standalone -showcc compiler command',
                  )
              tokens = tokenize_command(showcc_output[len(prefix):])

              joined_output_tokens = [
                  token for token in tokens
                  if token.startswith('-o') and token != '-o'
              ]
              if joined_output_tokens:
                  raise ValidationError(
                      'output-joined',
                      f'joined TinyCC output option(s) are forbidden: '
                      f'{joined_output_tokens!r}',
                  )
              output_count = tokens.count('-o')
              if output_count != 1:
                  raise ValidationError(
                      'output-arity',
                      f'expected exactly one -o token, found {output_count}',
                  )
              output_pair_count = sum(
                  tokens[index] == '-o' and tokens[index + 1] == expected_binary
                  for index in range(len(tokens) - 1)
              )
              if output_pair_count != 1:
                  raise ValidationError(
                      'output-pair',
                      f'expected exactly one adjacent -o {expected_binary!r} pair, '
                      f'found {output_pair_count}',
                  )

              tcc_count = tokens.count(expected_tcc)
              if tcc_count != 1:
                  raise ValidationError(
                      'compiler-arity',
                      f'expected exactly one TCC token {expected_tcc!r}, found {tcc_count}',
                  )
              if not tokens or tokens[0] != expected_tcc:
                  actual = tokens[0] if tokens else '<missing>'
                  raise ValidationError(
                      'compiler-position',
                      f'compiler token is {actual!r}, expected {expected_tcc!r}',
                  )

              failures = []
              if tokens.count(expected_libgc) != 1:
                  failures.append(
                      f'expected exactly one libgc token {expected_libgc!r}, '
                      f'found {tokens.count(expected_libgc)}'
                  )
              if tokens.count(expected_rpath) != 1:
                  failures.append(
                      f'expected exactly one rpath token {expected_rpath!r}, '
                      f'found {tokens.count(expected_rpath)}'
                  )
              near_tcc = [
                  token for token in tokens
                  if token.startswith(expected_tcc) and token != expected_tcc
              ]
              near_libgc = [
                  token for token in tokens
                  if token.startswith(expected_libgc) and token != expected_libgc
              ]
              near_rpath = [
                  token for token in tokens
                  if token.startswith(expected_rpath) and token != expected_rpath
              ]
              if near_tcc:
                  failures.append(f'rejected near-match TCC token(s): {near_tcc!r}')
              if near_libgc:
                  failures.append(f'rejected near-match libgc token(s): {near_libgc!r}')
              if near_rpath:
                  failures.append(f'rejected near-match rpath token(s): {near_rpath!r}')
              if any('libgc.a' in token for token in tokens):
                  failures.append('the compiler command contains a static libgc.a token')
              if failures:
                  raise ValidationError('link-contract', '; '.join(failures))
              return tokens


          def render_probe(tokens):
              return prefix + ' '.join(shlex.quote(token) for token in tokens)


          good_tokens = [
              expected_tcc,
              expected_rpath,
              expected_libgc,
              '-o',
              expected_binary,
              '/tmp/showcc-parser-probe.c',
          ]
          good_probe = render_probe(good_tokens)
          realistic_probe = (
              f'{prefix}"{expected_tcc}"  -O2 -D GC_THREADS=1\t'
              f'-I"{os.path.dirname(expected_libgc)}"  '
              f'{expected_rpath} "{expected_libgc}"  '
              f'-o "{expected_binary}" "/tmp/showcc-parser.123.tmp.c"'
          )
          adversarial_probes = [
              ('semicolon', good_probe + ' ; /usr/bin/clang', 'raw-character'),
              ('and-list', good_probe + ' && /usr/bin/clang', 'raw-character'),
              ('or-list', good_probe + ' || /usr/bin/clang', 'raw-character'),
              ('pipeline', good_probe + ' | /usr/bin/tee /tmp/evil', 'raw-character'),
              ('background', good_probe + ' & /usr/bin/clang', 'raw-character'),
              ('input-redirection', good_probe + ' < /tmp/evil', 'raw-character'),
              ('output-redirection', good_probe + ' > /tmp/evil', 'raw-character'),
              ('backticks', good_probe + ' `true`', 'raw-character'),
              ('command-substitution', good_probe + ' $(true)', 'raw-character'),
              ('comment', good_probe + ' # ignored', 'raw-character'),
              (
                  'raw-response-file',
                  render_probe(good_tokens[:3] + ['@/tmp/evil.rsp'] + good_tokens[3:]),
                  'raw-character',
              ),
              (
                  'glob-question-to-response-file',
                  render_probe(good_tokens[:3] + ['?evil.rsp'] + good_tokens[3:]),
                  'raw-character',
              ),
              (
                  'glob-class-to-response-file',
                  render_probe(good_tokens[:3] + ['[@]evil.rsp'] + good_tokens[3:]),
                  'raw-character',
              ),
              (
                  'glob-star-to-response-file',
                  render_probe(good_tokens[:3] + ['*evil.rsp'] + good_tokens[3:]),
                  'raw-character',
              ),
              (
                  'glob-libgc',
                  render_probe(
                      good_tokens[:3]
                      + [os.path.join(os.path.dirname(expected_libgc), 'libgc.*')]
                      + good_tokens[3:]
                  ),
                  'raw-character',
              ),
              (
                  'brace-expansion',
                  render_probe(
                      good_tokens[:3] + ['{evil,@evil.rsp}'] + good_tokens[3:]
                  ),
                  'raw-character',
              ),
              (
                  'tilde-expansion',
                  render_probe(good_tokens[:3] + ['~/evil.rsp'] + good_tokens[3:]),
                  'raw-character',
              ),
              (
                  'backslash-escape',
                  render_probe(good_tokens[:3] + [r'\@evil.rsp'] + good_tokens[3:]),
                  'raw-character',
              ),
              (
                  'line-feed',
                  good_probe + '\n@evil.rsp',
                  'raw-character',
              ),
              (
                  'carriage-return',
                  good_probe + '\r@evil.rsp',
                  'raw-character',
              ),
              (
                  'unicode',
                  render_probe(good_tokens[:3] + ['évil.rsp'] + good_tokens[3:]),
                  'raw-character',
              ),
              (
                  'control-nul',
                  good_probe + '\x00evil',
                  'raw-character',
              ),
              (
                  'parentheses',
                  render_probe(good_tokens[:3] + ['(evil)'] + good_tokens[3:]),
                  'raw-character',
              ),
              (
                  'bang',
                  render_probe(good_tokens[:3] + ['!evil'] + good_tokens[3:]),
                  'raw-character',
              ),
              (
                  'double-output',
                  render_probe(good_tokens[:3] + ['-o', '/tmp/evil'] + good_tokens[3:]),
                  'output-arity',
              ),
              (
                  'joined-output-path-before',
                  render_probe(good_tokens[:3] + ['-o/tmp/evil'] + good_tokens[3:]),
                  'output-joined',
              ),
              (
                  'joined-output-name-before',
                  render_probe(good_tokens[:3] + ['-otcc-output'] + good_tokens[3:]),
                  'output-joined',
              ),
              (
                  'joined-output-equals-before',
                  render_probe(good_tokens[:3] + ['-o=/tmp/evil'] + good_tokens[3:]),
                  'output-joined',
              ),
              (
                  'joined-output-format-before',
                  render_probe(good_tokens[:3] + ['-oformat=binary'] + good_tokens[3:]),
                  'output-joined',
              ),
              (
                  'joined-output-path-after',
                  render_probe(good_tokens + ['-o/tmp/evil']),
                  'output-joined',
              ),
              (
                  'joined-output-name-after',
                  render_probe(good_tokens + ['-otcc-output']),
                  'output-joined',
              ),
              (
                  'joined-output-equals-after',
                  render_probe(good_tokens + ['-o=/tmp/evil']),
                  'output-joined',
              ),
              (
                  'joined-output-format-after',
                  render_probe(good_tokens + ['-oformat=binary']),
                  'output-joined',
              ),
              (
                  'combined',
                  render_probe(
                      good_tokens[:3]
                      + ['@/tmp/evil.rsp', '-o', '/tmp/evil']
                      + good_tokens[3:]
                  )
                  + ' && /usr/bin/clang',
                  'raw-character',
              ),
              (
                  'tcc-suffix',
                  render_probe([expected_tcc + '.evil'] + good_tokens[1:]),
                  'compiler-arity',
              ),
              (
                  'tcc-good-plus-suffix',
                  render_probe(good_tokens[:1] + [expected_tcc + '.evil'] + good_tokens[1:]),
                  'link-contract',
              ),
              (
                  'duplicate-tcc',
                  render_probe(good_tokens[:1] + [expected_tcc] + good_tokens[1:]),
                  'compiler-arity',
              ),
              (
                  'libgc-suffix',
                  render_probe(good_tokens[:2] + [expected_libgc + '.evil'] + good_tokens[3:]),
                  'link-contract',
              ),
              (
                  'libgc-good-plus-suffix',
                  render_probe(good_tokens[:3] + [expected_libgc + '.evil'] + good_tokens[3:]),
                  'link-contract',
              ),
              (
                  'rpath-suffix',
                  render_probe(
                      [expected_tcc, expected_rpath + '-evil'] + good_tokens[2:]
                  ),
                  'link-contract',
              ),
              (
                  'rpath-good-plus-suffix',
                  render_probe(good_tokens[:2] + [expected_rpath + '-evil'] + good_tokens[2:]),
                  'link-contract',
              ),
              (
                  'duplicate-libgc',
                  render_probe(good_tokens[:3] + [expected_libgc] + good_tokens[3:]),
                  'link-contract',
              ),
              (
                  'static-libgc',
                  render_probe(
                      good_tokens[:3]
                      + [os.path.join(os.path.dirname(expected_libgc), 'libgc.a')]
                      + good_tokens[3:]
                  ),
                  'link-contract',
              ),
              (
                  'wrong-output',
                  render_probe(good_tokens[:4] + [expected_binary + '.evil'] + good_tokens[5:]),
                  'output-pair',
              ),
          ]

          try:
              validate_showcc(good_probe)
          except ValidationError as error:
              print(f'::error::valid parser self-probe was rejected: {error}')
              sys.exit(1)
          try:
              validate_showcc(realistic_probe)
          except ValidationError as error:
              print(f'::error::realistic V-format parser self-probe was rejected: {error}')
              sys.exit(1)
          for label, probe, expected_kind in adversarial_probes:
              try:
                  validate_showcc(probe)
              except ValidationError as error:
                  if error.kind != expected_kind:
                      print(
                          f'::error::parser self-probe {label!r} failed for '
                          f'{error.kind!r}, expected {expected_kind!r}: {error}'
                      )
                      sys.exit(1)
              else:
                  print(f'::error::parser self-probe {label!r} was falsely accepted')
                  sys.exit(1)
          print(
              f'confirmed: parser accepted both valid probes and rejected '
              f'{len(adversarial_probes)} adversarial probes'
          )

          logical_tcc_root = '/tmp/v-bootstrap-workspace/thirdparty/tcc'
          alias_tcc_root = logical_tcc_root
          if alias_tcc_root == os.path.dirname(expected_tcc):
              alias_tcc_root = os.path.join(alias_tcc_root, '..', 'tcc')
          alias_tcc = os.path.join(alias_tcc_root, 'tcc.exe')
          alias_libgc = os.path.join(alias_tcc_root, 'lib', 'libgc.dylib')
          alias_rpath = f'-Wl,-rpath,{os.path.join(alias_tcc_root, "lib")}'
          path_identity_probes = [
              (
                  'logical-alias-only',
                  render_probe(
                      [
                          alias_tcc,
                          alias_rpath,
                          alias_libgc,
                          '-o',
                          expected_binary,
                          '/tmp/showcc-parser-probe.c',
                      ]
                  ),
                  'compiler-arity',
              ),
              (
                  'physical-and-logical-mix',
                  render_probe(
                      [
                          expected_tcc,
                          alias_rpath,
                          alias_libgc,
                          '-o',
                          expected_binary,
                          '/tmp/showcc-parser-probe.c',
                      ]
                  ),
                  'link-contract',
              ),
              (
                  'arbitrary-root',
                  render_probe(
                      [
                          '/tmp/arbitrary-tcc-root/tcc.exe',
                          expected_rpath,
                          expected_libgc,
                          '-o',
                          expected_binary,
                          '/tmp/showcc-parser-probe.c',
                      ]
                  ),
                  'compiler-arity',
              ),
          ]
          for label, probe, expected_kind in path_identity_probes:
              try:
                  validate_showcc(probe)
              except ValidationError as error:
                  if error.kind != expected_kind:
                      print(
                          f'::error::path-identity probe {label!r} failed for '
                          f'{error.kind!r}, expected {expected_kind!r}: {error}'
                      )
                      sys.exit(1)
              else:
                  print(f'::error::path-identity probe {label!r} was falsely accepted')
                  sys.exit(1)
          print(
              'confirmed: physical-path command accepted; logical alias, '
              'mixed-root, and arbitrary-root commands rejected'
          )

          try:
              tokens = validate_showcc(os.environ['SHOWCC_OUTPUT'])
          except ValidationError as error:
              print(f'::error::{error}')
              sys.exit(1)

          print(f'confirmed exact compiler token: {expected_tcc}')
          print(f'confirmed exact libgc token: {expected_libgc}')
          print(f'confirmed exact rpath token: {expected_rpath}')
          print('confirmed: no static libgc.a token is present')
          PYEOF

          /tmp/tcc_boehm_gc_smoke

      - name: Authenticate the Phase A candidate with an independent payload export
        id: phase_a
        if: steps.rebuild.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          candidate_root="$GITHUB_WORKSPACE/thirdparty/tcc"
          if [ "${{ matrix.id }}" = macos-amd64 ]; then
            candidate_root=/tmp/tccbin-fresh-checkout
            test "$(git -C "$GITHUB_WORKSPACE/thirdparty/tcc" rev-parse HEAD)" = \
              "$(git -C "$candidate_root" rev-parse HEAD)"
          fi
          test -d "$candidate_root"
          test ! -L "$candidate_root"
          candidate_root="$(cd "$candidate_root" && pwd -P)"
          base_sha="${{ steps.tccbin.outputs.base_commit }}"
          candidate_sha="$(git -C "$candidate_root" rev-parse HEAD)"
          preflight_root="$RUNNER_TEMP/tccbin-candidate-preflight"
          test ! -e "$preflight_root"
          test ! -L "$preflight_root"
          manifest_path=automation/bundle-manifest.json
          manifest_entry="$(git -C "$candidate_root" ls-tree "$candidate_sha" -- "$manifest_path")"
          # Legacy branches remain explicitly ineligible until their reviewed manifests and
          # candidate-composition rollout land. A manifest-bearing direct-child candidate must
          # use candidate-preflight, which owns the detached source clone and payload-only export.
          if [ -z "$manifest_entry" ]; then
            test ! -L "$candidate_root/automation"
            if [ -e "$candidate_root/automation" ]; then
              test -d "$candidate_root/automation"
            fi
            test ! -e "$candidate_root/$manifest_path"
            test ! -L "$candidate_root/$manifest_path"
            if [ "$PUBLISH" = true ]; then
              echo '::error::publication requires a managed tccbin manifest'
              exit 1
            fi
            result='eligible=false reason=phase_a_material_absent publish_allowed=false manifest_hash= input_fingerprint= artifact_fingerprint='
          else
            case "$manifest_entry" in
              "100644 blob "*$'\t'"$manifest_path") ;;
              *)
                echo '::error::managed tccbin manifest must be an exact 100644 Git blob'
                exit 1
                ;;
            esac
            result="$(
              cd "$TCCBIN_VALIDATOR_CONTRACT_ROOT"
              "$TCCBIN_VALIDATOR_CLI" candidate-preflight \
                "${{ matrix.id }}" monthly "$candidate_root" \
                "$base_sha" "$candidate_sha" "$preflight_root" "$PUBLISH"
            )"
          fi
          printf '%s\n' "$result"
          case "$result" in
            eligible=true\ *publish_allowed=true\ *|eligible=true\ *publish_allowed=false\ *)
              payload_root="$preflight_root/payload"
              test -d "$payload_root"
              test ! -L "$payload_root"
              echo 'eligible=true' >> "$GITHUB_OUTPUT"
              echo "candidate_sha=$candidate_sha" >> "$GITHUB_OUTPUT"
              echo "payload_root=$payload_root" >> "$GITHUB_OUTPUT"
              ;;
            eligible=false\ *publish_allowed=false\ *)
              echo 'eligible=false' >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo '::error::staged provenance returned an unrecognized decision'
              exit 1
              ;;
          esac
          if [ "$PUBLISH" = true ] && [[ "$result" != *'publish_allowed=true'* ]]; then
            echo '::error::publication is not allowed without authenticated staging'
            exit 1
          fi

      - name: Upload tar archive (macOS amd64, preserves symlinks and executable bits)
        if: matrix.id == 'macos-amd64' && steps.rebuild.outputs.skip != 'true' && steps.phase_a.outputs.eligible == 'true'
        shell: bash
        env:
          PAYLOAD_ROOT: ${{ steps.phase_a.outputs.payload_root }}
        run: |
          set -euo pipefail
          test -n "$PAYLOAD_ROOT"
          tar -czf /tmp/tccbin-macos-amd64.tar.gz -C "$PAYLOAD_ROOT" .
      - name: Upload tar archive artifact (macOS amd64)
        if: matrix.id == 'macos-amd64' && steps.rebuild.outputs.skip != 'true' && steps.phase_a.outputs.eligible == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: tccbin-macos-amd64-tar
          path: /tmp/tccbin-macos-amd64.tar.gz
          if-no-files-found: error

      - name: Verify tccbin workflows were preserved
        if: steps.rebuild.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -d thirdparty/tcc/.github/workflows
          test -n "$(find thirdparty/tcc/.github/workflows -type f -print)"
          test "$(git -C thirdparty/tcc rev-parse HEAD:.github/workflows)" = "${{ steps.tccbin.outputs.workflow_tree }}"
          git -C thirdparty/tcc diff --exit-code \
            "${{ steps.tccbin.outputs.base_commit }}" HEAD -- .github/workflows

      - name: Upload TCC bundle artifact
        if: matrix.id != 'macos-amd64' && steps.rebuild.outputs.skip != 'true' && steps.phase_a.outputs.eligible == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: tccbin-${{ matrix.id }}
          path: ${{ steps.phase_a.outputs.payload_root }}

      # macos-amd64 additionally requires an explicit unlock: vlang/tccbin's
      # thirdparty-macos-amd64 build-and-test.yml currently hard-fails if the
      # checked-in package unexpectedly starts passing (today it's supposed
      # to still be broken) - that gate must flip to "must pass" (deliverable
      # B) BEFORE a working pair is ever pushed here, or the very next green
      # publish breaks that CI for the opposite reason. PUBLISH alone isn't
      # a safe gate for this platform: the global schedule/manual gate does
      # not prove that B has landed. Repo variable
      # MACOS_AMD64_LIBGC_PUBLISH_UNLOCKED defaults to unset (falsy), so this
      # stays closed until a maintainer sets it to 'true' after confirming B
      # is live and green - see the "Sequence" section of the PR description.
      - name: Recheck tccbin branch HEAD before publication
        if: >-
          github.repository == 'vlang/v' &&
          steps.rebuild.outputs.skip != 'true' && env.PUBLISH == 'true' &&
          steps.phase_a.outputs.eligible == 'true' &&
          (env.TARGET == matrix.id || env.TARGET == 'all') &&
          (github.event_name != 'schedule' || vars[matrix.publish_unlock_variable] == 'true') &&
          (matrix.id != 'macos-amd64' || vars.MACOS_AMD64_LIBGC_PUBLISH_UNLOCKED == 'true')
        shell: bash
        run: |
          set -euo pipefail
          expected_head="${{ steps.tccbin.outputs.base_commit }}"
          expected_ref="refs/heads/${{ matrix.branch }}"
          remote_head="$(
            git ls-remote --exit-code --refs \
              "https://github.com/${TCCBIN_REPO}.git" "$expected_ref" \
              | awk -v expected_ref="$expected_ref" '
                  $2 == expected_ref { count += 1; head = $1 }
                  END {
                    if (count != 1) {
                      exit 1
                    }
                    print head
                  }
                '
          )"
          if [ "$remote_head" != "$expected_head" ]; then
            echo "::error::tccbin/${{ matrix.branch }} moved during this run: expected $expected_head, got $remote_head"
            exit 1
          fi
          echo "confirmed: tccbin/${{ matrix.branch }} is still at $remote_head"

      - name: Push tccbin branch
        if: >-
          github.repository == 'vlang/v' &&
          steps.rebuild.outputs.skip != 'true' && env.PUBLISH == 'true' &&
          steps.phase_a.outputs.eligible == 'true' &&
          (env.TARGET == matrix.id || env.TARGET == 'all') &&
          (github.event_name != 'schedule' || vars[matrix.publish_unlock_variable] == 'true') &&
          (matrix.id != 'macos-amd64' || vars.MACOS_AMD64_LIBGC_PUBLISH_UNLOCKED == 'true')
        shell: bash
        env:
          TCCBIN_TOKEN: ${{ secrets.VLANG_BOT_SECRET }}
          SCHEDULE_PUBLISH_UNLOCKED: ${{ vars.TCCBIN_SCHEDULE_PUBLISH_UNLOCKED }}
          TARGET_PUBLISH_UNLOCKED: ${{ vars[matrix.publish_unlock_variable] }}
          MACOS_AMD64_PUBLISH_UNLOCKED: ${{ vars.MACOS_AMD64_LIBGC_PUBLISH_UNLOCKED }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REPOSITORY" != 'vlang/v' ]; then
            echo "::error::publication is only allowed from vlang/v"
            exit 1
          fi
          case "$TARGET" in
            "${{ matrix.id }}"|all)
              ;;
            *)
              echo "::error::target $TARGET cannot publish ${{ matrix.id }}"
              exit 1
              ;;
          esac
          if [ "$GITHUB_EVENT_NAME" = 'schedule' ] \
            && [ "$SCHEDULE_PUBLISH_UNLOCKED" != 'true' ]; then
            echo "::error::scheduled publication is locked"
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = 'schedule' ] \
            && [ "$TARGET_PUBLISH_UNLOCKED" != true ]; then
            echo "::error::scheduled publication for ${{ matrix.id }} is locked"
            exit 1
          fi
          if [ "${{ matrix.id }}" = 'macos-amd64' ] \
            && [ "$MACOS_AMD64_PUBLISH_UNLOCKED" != 'true' ]; then
            echo "::error::macOS amd64 publication is locked"
            exit 1
          fi
          if [ -z "$TCCBIN_TOKEN" ]; then
            echo "::error::VLANG_BOT_SECRET is required to publish to ${TCCBIN_REPO}"
            exit 1
          fi
          test "$(git -C thirdparty/tcc rev-parse HEAD)" = \
            "${{ steps.phase_a.outputs.candidate_sha }}"
          askpass="$(mktemp)"
          trap 'rm -f "$askpass"' EXIT
          cat > "$askpass" <<'EOF'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' "$GIT_USERNAME" ;;
            *Password*) printf '%s\n' "$GIT_PASSWORD" ;;
            *) exit 1 ;;
          esac
          EOF
          chmod 700 "$askpass"
          GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0 \
            GIT_USERNAME=vlang-bot GIT_PASSWORD="$TCCBIN_TOKEN" \
            git -C thirdparty/tcc push origin "HEAD:${{ matrix.branch }}"

  update-tccbin-bsd:
    needs:
      - control
      - resolve-sources
    if: needs.control.outputs.has_bsd == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.control.outputs.bsd_matrix) }}
    runs-on: ubuntu-latest
    env:
      TARGET: ${{ needs.control.outputs.target }}
      TCC_COMMIT: ${{ needs.resolve-sources.outputs.tinycc_hash }}
      EXPECTED_TCCBIN_HEAD: ${{ inputs.expected_tccbin_head || '' }}
      TCCBIN_REPO: vlang/tccbin
      PUBLISH: ${{ needs.control.outputs.publish }}
      FORCE_REBUILD: ${{ needs.control.outputs.force_rebuild }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Checkout the immutable VC bootstrap snapshot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: vlang/vc
          ref: dfc458a13ba8923ebc249e262c331f8169aa728b
          path: .tccbin-bootstrap-vc
          fetch-depth: 0
          persist-credentials: false

      - name: Bootstrap the contract-bound Phase A validator before BSD staging
        shell: bash
        run: |
          set -euo pipefail
          contract_input="$RUNNER_TEMP/tccbin-validator-contract-input"
          validator_work="$RUNNER_TEMP/tccbin-validator-work"
          vc_root="$GITHUB_WORKSPACE/.tccbin-bootstrap-vc"
          test ! -e "$contract_input"
          test ! -e "$validator_work"
          git -c protocol.file.allow=always clone --quiet --no-checkout --no-local \
            --no-hardlinks "$GITHUB_WORKSPACE" "$contract_input"
          git -C "$contract_input" config --local core.autocrlf false
          git -C "$contract_input" remote set-url origin \
            "https://github.com/${GITHUB_REPOSITORY}"
          git -C "$contract_input" checkout --quiet --detach --force "$GITHUB_SHA"
          git -C "$vc_root" config --local core.autocrlf false
          "$contract_input/thirdparty/tccbin_automation/bootstrap/bootstrap.sh" \
            "$contract_input" "$GITHUB_REPOSITORY" "$GITHUB_SHA" \
            "$vc_root" "$validator_work"
          validator_cli="$validator_work/tccbin-automation"
          validator_contract_root="$validator_work/contract-source"
          test -x "$validator_cli"
          test -d "$validator_contract_root"
          binding="$("$validator_cli" contract-binding)"
          test "$binding" = \
            "repository=${GITHUB_REPOSITORY} sha=${GITHUB_SHA}"
          {
            echo "TCCBIN_VALIDATOR_CLI=$validator_cli"
            echo "TCCBIN_VALIDATOR_CONTRACT_ROOT=$validator_contract_root"
          } >> "$GITHUB_ENV"

      - name: Start ${{ matrix.id }} VM
        uses: cross-platform-actions/action@faa0c6197e94aacf1c5956460152c8380d3560a5
        with:
          operating_system: ${{ matrix.operating_system }}
          version: ${{ matrix.version }}
          memory: 4G
          shell: sh
          sync_files: runner-to-vm
          environment_variables: TARGET TCC_COMMIT TCCBIN_REPO FORCE_REBUILD EXPECTED_TCCBIN_HEAD

      - name: Build ${{ matrix.id }} TCC bundle
        shell: cpa.sh {0} --sync-files both
        run: |
          set -eu
          case "$TARGET" in
            "${{ matrix.id }}"|all)
              ;;
            *)
              echo "target $TARGET cannot build ${{ matrix.id }}" >&2
              exit 1
              ;;
          esac

          rebuild_marker=".tccbin-${{ matrix.id }}-rebuilt"
          base_commit_file=".tccbin-${{ matrix.id }}-base-commit"
          rm -f "$rebuild_marker" "$base_commit_file"
          ${{ matrix.install }}
          git config --global user.name vlang-bot
          git config --global user.email vlang-bot@users.noreply.github.com
          git config --global --add safe.directory "$PWD"

          for attempt in 1 2 3; do
            if git clone --quiet https://repo.or.cz/tinycc.git /tmp/tinycc-ref; then
              break
            fi
            rm -rf /tmp/tinycc-ref
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep "$((attempt * 5))"
          done
          git -C /tmp/tinycc-ref checkout --quiet "$TCC_COMMIT"
          tinycc_hash="$(git -C /tmp/tinycc-ref rev-parse HEAD)"
          if [ "$tinycc_hash" != "$TCC_COMMIT" ]; then
            echo "resolved TinyCC checkout moved: expected $TCC_COMMIT, got $tinycc_hash" >&2
            exit 1
          fi
          echo "TinyCC source pinned at $tinycc_hash"

          git clone --single-branch --branch "${{ matrix.branch }}" \
            "https://github.com/${TCCBIN_REPO}.git" thirdparty/tcc
          git -C thirdparty/tcc config --local core.autocrlf false
          tccbin_base_commit="$(git -C thirdparty/tcc rev-parse HEAD)"
          tccbin_workflow_tree="$(git -C thirdparty/tcc rev-parse HEAD:.github/workflows)"
          if [ -n "$EXPECTED_TCCBIN_HEAD" ] \
            && [ "$tccbin_base_commit" != "$EXPECTED_TCCBIN_HEAD" ]; then
            echo "tccbin/${{ matrix.branch }} moved: expected $EXPECTED_TCCBIN_HEAD, got $tccbin_base_commit" >&2
            exit 1
          fi
          echo "tccbin/${{ matrix.branch }} base HEAD: $tccbin_base_commit"
          printf '%s\n' "$tccbin_base_commit" > "$base_commit_file"

          if [ "$FORCE_REBUILD" != 'true' ] \
            && [ -f thirdparty/tcc/build_source_hash.txt ] \
            && [ "$(cat thirdparty/tcc/build_source_hash.txt)" = "$tinycc_hash" ]; then
            echo "tccbin/${{ matrix.branch }} already has TinyCC $tinycc_hash"
            exit 0
          fi

          BUILD_CMD="TCC_COMMIT=$TCC_COMMIT TCC_FOLDER=thirdparty/tcc CC=${{ matrix.cc }} bash ${{ matrix.script }}" \
            TCC_REPO=/tmp/tinycc-ref TCC_FOLDER=thirdparty/tcc CC="${{ matrix.cc }}" bash "${{ matrix.script }}"
          test "$(cat thirdparty/tcc/build_source_hash.txt)" = "$tinycc_hash"
          thirdparty/tcc/tcc.exe --version
          thirdparty/tcc/tcc.exe -v -v
          cat > /tmp/tcc-stdatomic-smoke.c <<'EOF'
          #include <stdatomic.h>
          int main(void) {
              atomic_int value = ATOMIC_VAR_INIT(0);
              atomic_store(&value, 1);
              return atomic_load(&value) == 1 ? 0 : 1;
          }
          EOF
          thirdparty/tcc/tcc.exe /tmp/tcc-stdatomic-smoke.c -o /tmp/tcc-stdatomic-smoke
          /tmp/tcc-stdatomic-smoke

          test -d thirdparty/tcc/.github/workflows
          test -n "$(find thirdparty/tcc/.github/workflows -type f -print)"
          test "$(git -C thirdparty/tcc rev-parse HEAD:.github/workflows)" = "$tccbin_workflow_tree"
          git -C thirdparty/tcc diff --exit-code \
            "$tccbin_base_commit" HEAD -- .github/workflows

          touch "$rebuild_marker"

      - name: Record BSD rebuild result
        id: bsd_rebuild
        shell: bash
        run: |
          set -euo pipefail
          base_commit_file=".tccbin-${{ matrix.id }}-base-commit"
          if [ ! -f "$base_commit_file" ]; then
            echo "::error::BSD VM did not return the tccbin base commit"
            exit 1
          fi
          base_commit="$(cat "$base_commit_file")"
          if [[ ! "$base_commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::BSD VM returned an invalid tccbin base commit"
            exit 1
          fi
          echo "base_commit=$base_commit" >> "$GITHUB_OUTPUT"
          if [ -f ".tccbin-${{ matrix.id }}-rebuilt" ]; then
            echo "rebuilt=true" >> "$GITHUB_OUTPUT"
          else
            echo "rebuilt=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Authenticate the BSD Phase A candidate with an independent payload export
        id: phase_a
        if: steps.bsd_rebuild.outputs.rebuilt == 'true'
        shell: bash
        run: |
          set -euo pipefail
          candidate_root="$GITHUB_WORKSPACE/thirdparty/tcc"
          test -d "$candidate_root"
          test ! -L "$candidate_root"
          candidate_root="$(cd "$candidate_root" && pwd -P)"
          base_sha="${{ steps.bsd_rebuild.outputs.base_commit }}"
          candidate_sha="$(git -C "$candidate_root" rev-parse HEAD)"
          preflight_root="$RUNNER_TEMP/tccbin-candidate-preflight"
          test ! -e "$preflight_root"
          test ! -L "$preflight_root"
          manifest_path=automation/bundle-manifest.json
          manifest_entry="$(git -C "$candidate_root" ls-tree "$candidate_sha" -- "$manifest_path")"
          # Legacy branches remain explicitly ineligible until their reviewed manifests and
          # candidate-composition rollout land. A manifest-bearing direct-child candidate must
          # use candidate-preflight, which owns the detached source clone and payload-only export.
          if [ -z "$manifest_entry" ]; then
            test ! -L "$candidate_root/automation"
            if [ -e "$candidate_root/automation" ]; then
              test -d "$candidate_root/automation"
            fi
            test ! -e "$candidate_root/$manifest_path"
            test ! -L "$candidate_root/$manifest_path"
            if [ "$PUBLISH" = true ]; then
              echo 'publication requires a managed tccbin manifest' >&2
              exit 1
            fi
            result='eligible=false reason=phase_a_material_absent publish_allowed=false manifest_hash= input_fingerprint= artifact_fingerprint='
          else
            case "$manifest_entry" in
              "100644 blob "*$'\t'"$manifest_path") ;;
              *)
                echo 'managed tccbin manifest must be an exact 100644 Git blob' >&2
                exit 1
                ;;
            esac
            result="$(
              cd "$TCCBIN_VALIDATOR_CONTRACT_ROOT"
              "$TCCBIN_VALIDATOR_CLI" candidate-preflight \
                "${{ matrix.id }}" monthly "$candidate_root" \
                "$base_sha" "$candidate_sha" "$preflight_root" "$PUBLISH"
            )"
          fi
          printf '%s\n' "$result"
          case "$result" in
            eligible=true\ *publish_allowed=true\ *|eligible=true\ *publish_allowed=false\ *)
              payload_root="$preflight_root/payload"
              test -d "$payload_root"
              test ! -L "$payload_root"
              echo 'eligible=true' >> "$GITHUB_OUTPUT"
              echo "candidate_sha=$candidate_sha" >> "$GITHUB_OUTPUT"
              echo "payload_root=$payload_root" >> "$GITHUB_OUTPUT"
              ;;
            eligible=false\ *publish_allowed=false\ *)
              echo 'eligible=false' >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo 'staged provenance returned an unrecognized decision' >&2
              exit 1
              ;;
          esac
          if [ "$PUBLISH" = true ] && [[ "$result" != *'publish_allowed=true'* ]]; then
            echo 'publication is not allowed without authenticated staging' >&2
            exit 1
          fi

      - name: Recheck tccbin branch HEAD before publication
        if: >-
          github.repository == 'vlang/v' &&
          steps.bsd_rebuild.outputs.rebuilt == 'true' && env.PUBLISH == 'true' &&
          steps.phase_a.outputs.eligible == 'true' &&
          (env.TARGET == matrix.id || env.TARGET == 'all') &&
          (github.event_name != 'schedule' || vars[matrix.publish_unlock_variable] == 'true')
        shell: bash
        run: |
          set -euo pipefail
          expected_head="${{ steps.bsd_rebuild.outputs.base_commit }}"
          expected_ref="refs/heads/${{ matrix.branch }}"
          remote_head="$(
            git ls-remote --exit-code --refs \
              "https://github.com/${TCCBIN_REPO}.git" "$expected_ref" \
              | awk -v expected_ref="$expected_ref" '
                  $2 == expected_ref { count += 1; head = $1 }
                  END {
                    if (count != 1) {
                      exit 1
                    }
                    print head
                  }
                '
          )"
          if [ "$remote_head" != "$expected_head" ]; then
            echo "::error::tccbin/${{ matrix.branch }} moved during this run: expected $expected_head, got $remote_head"
            exit 1
          fi
          echo "confirmed: tccbin/${{ matrix.branch }} is still at $remote_head"

      - name: Push tccbin branch
        if: >-
          github.repository == 'vlang/v' &&
          steps.bsd_rebuild.outputs.rebuilt == 'true' && env.PUBLISH == 'true' &&
          steps.phase_a.outputs.eligible == 'true' &&
          (env.TARGET == matrix.id || env.TARGET == 'all') &&
          (github.event_name != 'schedule' || vars[matrix.publish_unlock_variable] == 'true')
        shell: sh
        env:
          TCCBIN_TOKEN: ${{ secrets.VLANG_BOT_SECRET }}
          SCHEDULE_PUBLISH_UNLOCKED: ${{ vars.TCCBIN_SCHEDULE_PUBLISH_UNLOCKED }}
          TARGET_PUBLISH_UNLOCKED: ${{ vars[matrix.publish_unlock_variable] }}
        run: |
          set -eu
          if [ "$GITHUB_REPOSITORY" != 'vlang/v' ]; then
            echo "publication is only allowed from vlang/v" >&2
            exit 1
          fi
          case "$TARGET" in
            "${{ matrix.id }}"|all)
              ;;
            *)
              echo "target $TARGET cannot publish ${{ matrix.id }}" >&2
              exit 1
              ;;
          esac
          if [ "$GITHUB_EVENT_NAME" = 'schedule' ] \
            && [ "$SCHEDULE_PUBLISH_UNLOCKED" != 'true' ]; then
            echo "scheduled publication is locked" >&2
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = 'schedule' ] \
            && [ "$TARGET_PUBLISH_UNLOCKED" != true ]; then
            echo "scheduled publication for ${{ matrix.id }} is locked" >&2
            exit 1
          fi
          if [ -z "$TCCBIN_TOKEN" ]; then
            echo "VLANG_BOT_SECRET is required to publish to ${TCCBIN_REPO}" >&2
            exit 1
          fi
          test "$(git -C thirdparty/tcc rev-parse HEAD)" = \
            "${{ steps.phase_a.outputs.candidate_sha }}"
          askpass="$(mktemp)"
          trap 'rm -f "$askpass"' EXIT
          cat > "$askpass" <<'EOF'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' "$GIT_USERNAME" ;;
            *Password*) printf '%s\n' "$GIT_PASSWORD" ;;
            *) exit 1 ;;
          esac
          EOF
          chmod 700 "$askpass"
          GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0 \
            GIT_USERNAME=vlang-bot GIT_PASSWORD="$TCCBIN_TOKEN" \
            git -C thirdparty/tcc push origin "HEAD:${{ matrix.branch }}"
