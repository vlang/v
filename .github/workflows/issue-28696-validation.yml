name: Issue 28696 validation

on:
  push:
    branches: [fix/28696-validation]

concurrency:
  group: issue-28696-validation
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    env:
      VJOBS: '2'
      VTEST_JOBS: '2'
      NO_COLOR: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 451ce34d6676b59b3246698d2195b8ff3309442d
          fetch-depth: 1
      - name: Bootstrap the baseline compiler
        id: bootstrap
        run: |
          set -o pipefail
          make -j2 2>&1 | tee /tmp/28696-bootstrap.log
      - name: Record baseline regression failures
        id: baseline
        if: steps.bootstrap.outcome == 'success'
        run: |
          set +e
          ./v -silent test vlib/v/driver/submodule_diagnostics_test.v > /tmp/28696-before.log 2>&1
          result=$?
          cat /tmp/28696-before.log
          echo "Baseline exit code: $result"
          test "$result" -ne 0
      - name: Check out the published fix and rebuild
        id: rebuild
        if: always() && steps.bootstrap.outcome == 'success'
        run: |
          set -o pipefail
          git fetch origin fix/28696-submodule-diagnostics
          git checkout --detach FETCH_HEAD
          git rev-parse HEAD | tee /tmp/28696-tested-commit.log
          ./v self 2>&1 | tee /tmp/28696-rebuild.log
      - name: Format regression tests
        if: always() && steps.rebuild.outcome == 'success'
        run: |
          ./v fmt -w vlib/v/driver/submodule_diagnostics_test.v
          git diff --check
          git diff -- vlib/v/driver/submodule_diagnostics_test.v | tee /tmp/28696-format.log
          cp vlib/v/driver/submodule_diagnostics_test.v /tmp/28696-formatted-test.v
      - name: Upload formatted regression source
        if: always() && steps.rebuild.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: issue-28696-formatted-test
          path: /tmp/28696-formatted-test.v
          retention-days: 7
      - name: Run focused regression tests
        id: focused
        if: always() && steps.rebuild.outcome == 'success'
        run: |
          set -o pipefail
          ./v -silent test vlib/v/driver/submodule_diagnostics_test.v 2>&1 | tee /tmp/28696-after.log
      - name: Compile the reported multi-file reproducer
        id: reproducer
        if: always() && steps.rebuild.outcome == 'success'
        run: |
          set -o pipefail
          python3 - <<'PY' 2>&1 | tee /tmp/28696-reproducer.log
          from pathlib import Path
          import subprocess
          import tempfile
          compiler = str(Path('v').resolve())
          with tempfile.TemporaryDirectory(prefix='v-issue-28696-') as directory:
              root = Path(directory)
              (root / 'foo').mkdir()
              main = root / 'main.v'
              main.write_text('import foo\n\nfn main() {\n\tprintln(foo.Foo{})\n}\n')
              module = root / 'foo' / 'foo.v'
              source = 'module foo\n\npub struct Foo {\npub mut:\n\tshould_error ThisIsNotARealStruct\n\te MyEnum = .maybe\n}\n\npub enum MyEnum {\n\tyes\n\tno\n}\n'
              module.write_text(source)
              for target in [main, root]:
                  result = subprocess.run([compiler, '-o', str(root / 'program'), str(target)], text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, timeout=120)
                  print(f'Target: {target}\nExit: {result.returncode}\n{result.stdout}', flush=True)
                  assert result.returncode != 0
                  assert 'unknown type' in result.stdout and 'ThisIsNotARealStruct' in result.stdout
                  assert 'unknown enum field `maybe`' in result.stdout
              module.write_text(source.replace('\tshould_error ThisIsNotARealStruct\n', '').replace('.maybe', '.yes'))
              for attempt in range(2):
                  result = subprocess.run([compiler, '-o', str(root / 'program'), str(main)], text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, timeout=120)
                  print(f'Valid source attempt {attempt + 1}\nExit: {result.returncode}\n{result.stdout}', flush=True)
                  assert result.returncode == 0
          PY
      - name: Run driver unit tests
        if: always() && steps.rebuild.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          timeout 300 ./v -silent test vlib/v/driver/ 2>&1 | tee /tmp/28696-driver-tests.log
      - name: Run type-checker unit tests
        if: always() && steps.rebuild.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          timeout 300 ./v -silent test vlib/v/types/ 2>&1 | tee /tmp/28696-types-tests.log
      - name: Run compiler diagnostic fixtures
        if: always() && steps.rebuild.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          timeout 300 ./v -silent vlib/v/compiler_errors_test.v 2>&1 | tee /tmp/28696-compiler-errors.log
      - name: Run compiler input-output fixtures
        if: always() && steps.rebuild.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          timeout 300 ./v vlib/v/slow_tests/inout/compiler_test.v 2>&1 | tee /tmp/28696-inout.log
      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-28696-validation
          path: /tmp/28696-*.log
          retention-days: 7
      - name: Remove the temporary validation branch
        if: success() && steps.focused.outcome == 'success' && steps.reproducer.outcome == 'success'
        run: git push origin --delete fix/28696-validation
