name: Issue 28696 validation

on:
  push:
    branches: [fix/28696-validation]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      VJOBS: '2'
      VTEST_JOBS: '2'
      NO_COLOR: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/28696-submodule-diagnostics
          fetch-depth: 1
      - name: Bootstrap baseline compiler
        id: bootstrap
        continue-on-error: true
        run: |
          set -o pipefail
          make -j2 2>&1 | tee /tmp/28696-bootstrap.log
      - name: Record baseline regression failures
        if: steps.bootstrap.outcome == 'success'
        run: |
          set +e
          ./v -silent test vlib/v/driver/submodule_diagnostics_test.v > /tmp/28696-before.log 2>&1
          result=$?
          cat /tmp/28696-before.log
          echo "Baseline exit code: $result"
          test "$result" -ne 0
      - name: Apply scoped diagnostic selection fix
        id: patch
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('vlib/v/driver/driver.v')
          old = 'fn set_diagnostic_files(mut tc types.TypeChecker, user_files []string) {\n\tfor uf in user_files {\n\t\ttc.diagnostic_files[uf] = true\n\t}\n}'
          new = '''fn set_diagnostic_files(mut tc types.TypeChecker, user_files []string) {
          \tfor uf in user_files {
          \t\ttc.diagnostic_files[uf] = true
          \t}
          \t// Exact-output fixtures deliberately diagnose only their selected input.
          \tif tc.checker_fixture_mode {
          \t\treturn
          \t}
          \t// Imported project modules need the same checks as the entry files.
          \t// Resolve ownership once here, rather than for every checked expression.
          \tfor i, node in tc.a.nodes {
          \t\tif i < tc.a.user_code_start || node.kind != .file || node.value.len == 0
          \t\t\t|| node.value in tc.diagnostic_files {
          \t\t\tcontinue
          \t\t}
          \t\tif types.shadow_roots_own_file(node.value, tc.shadow_diagnostic_root,
          \t\t\ttc.shadow_explicit_roots, tc.shadow_dependency_roots) {
          \t\t\ttc.diagnostic_files[node.value] = true
          \t\t}
          \t}
          }'''
          source = path.read_text()
          assert source.count(old) == 1, 'Expected exactly one unmodified diagnostic selection helper'
          path.write_text(source.replace(old, new))
          PY
          git diff --check
          git diff --stat
      - name: Rebuild compiler
        id: rebuild
        if: always() && steps.patch.outcome == 'success' && steps.bootstrap.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          ./v self 2>&1 | tee /tmp/28696-rebuild.log
      - name: Format regression tests and publish source fix
        if: always() && steps.patch.outcome == 'success'
        run: |
          if test -x ./v; then
            ./v fmt -w vlib/v/driver/submodule_diagnostics_test.v
          fi
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add vlib/v/driver/driver.v vlib/v/driver/submodule_diagnostics_test.v
          git commit -m 'driver: type check project-owned submodules'
          git push origin HEAD:refs/heads/fix/28696-submodule-diagnostics
      - name: Run focused regression tests
        if: always() && steps.rebuild.outcome == 'success'
        run: |
          set -o pipefail
          ./v -silent test vlib/v/driver/submodule_diagnostics_test.v 2>&1 | tee /tmp/28696-after.log
      - name: Compile the reported multi-file reproducer
        if: always() && steps.rebuild.outcome == 'success'
        run: |
          python3 - <<'PY' 2>&1 | tee /tmp/28696-reproducer.log
          from pathlib import Path
          import subprocess
          import tempfile
          compiler = str(Path('v').resolve())
          with tempfile.TemporaryDirectory(prefix='v-issue-28696-') as directory:
              root = Path(directory)
              (root / 'foo').mkdir()
              main = root / 'main.v'
              main.write_text('import foo\n\nfn main() {\n\tprintln(foo.Foo{})\n}\n')
              module = root / 'foo' / 'foo.v'
              source = 'module foo\n\npub struct Foo {\npub mut:\n\tshould_error ThisIsNotARealStruct\n\te MyEnum = .maybe\n}\n\npub enum MyEnum {\n\tyes\n\tno\n}\n'
              module.write_text(source)
              for target in [main, root]:
                  result = subprocess.run([compiler, '-o', str(root / 'program'), str(target)], text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, timeout=120)
                  print(f'Target: {target}\nExit: {result.returncode}\n{result.stdout}', flush=True)
                  assert result.returncode != 0
                  assert 'unknown type' in result.stdout and 'ThisIsNotARealStruct' in result.stdout
                  assert 'unknown enum field `maybe`' in result.stdout
              module.write_text(source.replace('\tshould_error ThisIsNotARealStruct\n', '').replace('.maybe', '.yes'))
              for attempt in range(2):
                  result = subprocess.run([compiler, '-o', str(root / 'program'), str(main)], text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, timeout=120)
                  print(f'Valid source attempt {attempt + 1}\nExit: {result.returncode}\n{result.stdout}', flush=True)
                  assert result.returncode == 0
          PY
      - name: Run driver and type-checker unit tests
        if: always() && steps.rebuild.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          timeout 360 ./v -silent test vlib/v/driver/ vlib/v/types/ 2>&1 | tee /tmp/28696-unit-tests.log
      - name: Run compiler diagnostic fixtures
        if: always() && steps.rebuild.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          timeout 360 ./v -silent vlib/v/compiler_errors_test.v 2>&1 | tee /tmp/28696-compiler-errors.log
      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-28696-validation
          path: /tmp/28696-*.log
          retention-days: 7
