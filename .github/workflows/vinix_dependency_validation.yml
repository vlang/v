name: Vinix native dependency validation
'on':
  push:
    branches:
    - ci/verify-vinix-deps-20261031
permissions:
  contents: read
concurrency:
  group: vinix-deps-${{ github.ref }}
  cancel-in-progress: true
env:
  VJOBS: '2'
jobs:
  vinix-build:
    if: github.ref == 'refs/heads/ci/verify-vinix-deps-20261031'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Build V
      run: make -j4 && ./v symlink
    - name: Install dependencies
      run: '.github/workflows/disable_azure_mirror.sh

        v retry -- sudo apt update

        v retry -- sudo apt install build-essential libarchive-dev -y

        '
    - name: Clone current Vinix
      run: v retry -- git clone --depth=1 --branch master https://github.com/vlang/vinix.git
    - name: Download Vinix kernel dependencies
      run: cd vinix/kernel && v retry -- ./get-deps
    - name: Build the Vinix kernel (debug)
      run: "set -e\ncd vinix/kernel\nmake PROD=false \\\n  CFLAGS=\"-Ulinux -U__linux\
        \ -U__linux__ -U__gnu_linux__ -D__vinix__ -O2 -g -pipe\" \\\n  V=\"$(realpath\
        \ ../../v)\"\nmake clean\n"
    - name: Build the Vinix kernel (prod)
      run: "set -e\ncd vinix/kernel\nmake PROD=true \\\n  CFLAGS=\"-Ulinux -U__linux\
        \ -U__linux__ -U__gnu_linux__ -D__vinix__ -O2 -g -pipe\" \\\n  V=\"$(realpath\
        \ ../../v)\"\nmake clean\n"
    - name: Build util-vinix (debug)
      run: "set -e\ncd vinix/util-vinix\nmake PROD=false \\\n  VFLAGS=\"-os vinix\
        \ -gc none\" \\\n  CFLAGS=\"-Ulinux -U__linux -U__linux__ -U__gnu_linux__\
        \ -D__vinix__ -O2 -g -pipe\" \\\n  V=\"$(realpath ../../v)\"\nmake clean\n"
    - name: Build util-vinix (prod)
      run: "set -e\ncd vinix/util-vinix\nmake PROD=true \\\n  VFLAGS=\"-os vinix -gc\
        \ none\" \\\n  CFLAGS=\"-Ulinux -U__linux -U__linux__ -U__gnu_linux__ -D__vinix__\
        \ -O2 -g -pipe\" \\\n  V=\"$(realpath ../../v)\"\nmake clean\n"
