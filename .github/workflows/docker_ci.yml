name: Docker CI

on:
  workflow_call:

concurrency:
  group: docker-docker_ci-${{ github.ref == 'refs/heads/master' && github.sha || github.ref }}
  cancel-in-progress: true

env:
  V_CI_MUSL: 1

permissions:
  contents: read

jobs:
  docker-alpine-musl-gcc:
    runs-on: ubuntu-24.04
    env:
      # Stop a failing test session at its first failure instead of
      # running the whole suite to completion; the remaining files
      # add no signal.
      VTEST_FAIL_FAST: '1'
    timeout-minutes: 241
    container:
      image: thevlang/vlang:alpine-build
      env:
        VFLAGS: -cc gcc
      volumes:
        - ${{github.workspace}}:/opt/vlang
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Show Environment
        run: |
          echo "PWD:"
          pwd
          echo "ENVIRONMENT:"
          env
          echo "C Compiler:"
          gcc --version
      - name: Add dependencies
        run: apk add libc6-compat gcompat gc gc-dev binutils diffutils elfutils
      - name: Trust mounted checkout for container Git
        run: git config --global --add safe.directory "$(pwd -P)"
      - name: Build V
        run: CC=gcc make && V_CI_SOURCE_BUILD=1 sh .github/workflows/prepare_v.sh
      - name: All code is formatted
        run: ./v -silent test-cleancode
      - name: Run only essential tests
        run: VTEST_JUST_ESSENTIAL=1 ./v -silent test-self

  docker-alpine-musl-tcc:
    runs-on: ubuntu-24.04
    env:
      # Stop a failing test session at its first failure instead of
      # running the whole suite to completion; the remaining files
      # add no signal.
      VTEST_FAIL_FAST: '1'
    timeout-minutes: 241
    container:
      image: thevlang/vlang:alpine-build
      volumes:
        - ${{github.workspace}}:/opt/vlang
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Add dependencies
        run: apk add musl-dev libatomic_ops-dev libatomic openssl libc6-compat gcompat gc gc-dev binutils diffutils elfutils
      - name: Trust mounted checkout for container Git
        run: git config --global --add safe.directory "$(pwd -P)"
      - name: Build V
        run: make && V_CI_SOURCE_BUILD=1 sh .github/workflows/prepare_v.sh
      - name: Check if vpm compiles with tcc
        run: ./v -show-c-output -showcc -no-retry-compilation -cc tcc cmd/tools/vpm
      - name: Run only builtin and math tests
        run: ./v test vlib/builtin

  docker-ubuntu-musl:
    runs-on: ubuntu-24.04
    env:
      # Stop a failing test session at its first failure instead of
      # running the whole suite to completion; the remaining files
      # add no signal.
      VTEST_FAIL_FAST: '1'
    timeout-minutes: 150
    container:
      image: thevlang/vlang:ubuntu-build
      env:
        V_CI_UBUNTU_MUSL: 1
        # Tests that opt into Boehm need a musl-built collector; Ubuntu's system
        # libgc and the prebuilt TCC archive target glibc. GC-none builds are unchanged.
        VFLAGS: -cc musl-gcc -gc none -d use_bundled_libgc
      volumes:
        - ${{github.workspace}}:/opt/vlang
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build V
        run: echo "$VFLAGS" && make -j4 && ./v -prod -cg -o v cmd/v
      - name: Verify `v test` works
        env:
          VTOOLS_CACHE_VERBOSE: '1'
          VTEST_SHOW_CMD: '1'
          VTEST_SHOW_START: '1'
        run: |
          echo "$VFLAGS"
          ./v cmd/tools/test_if_v_test_system_works.v
          ./cmd/tools/test_if_v_test_system_works
      - name: Add dependencies
        run: apt-get update && apt-get install -y libsqlite3-dev pkgconf
      - name: Build musl-native SQLite for V database tests
        run: |
          set -eu
          sqlite_version=3530400
          archive="/tmp/sqlite-autoconf-${sqlite_version}.tar.gz"
          wget -q "https://www.sqlite.org/2026/sqlite-autoconf-${sqlite_version}.tar.gz" -O "$archive"
          echo "0e9483900e92cd5de8fd48d16bf9200145a61f7fd5be542a5ac81d8a9516eb9c  $archive" | sha256sum --check --strict
          tar -C /tmp -xf "$archive"
          cd "/tmp/sqlite-autoconf-${sqlite_version}"
          CC=musl-gcc ./configure --prefix=/opt/musl-sqlite --disable-shared --enable-static --disable-readline
          make -j4
          make install
          export PKG_CONFIG_PATH="/opt/musl-sqlite/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"
          test "$(pkg-config --variable=prefix sqlite3)" = /opt/musl-sqlite
          printf '%s\n' '#include <sqlite3.h>' 'int main(void) { sqlite3 *db = 0; if (sqlite3_open(":memory:", &db) != SQLITE_OK) return 1; return sqlite3_close(db); }' > /tmp/musl-sqlite-smoke.c
          musl-gcc -static $(pkg-config --cflags sqlite3) /tmp/musl-sqlite-smoke.c -o /tmp/musl-sqlite-smoke $(pkg-config --libs sqlite3) -lm
          /tmp/musl-sqlite-smoke
          echo "PKG_CONFIG_PATH=$PKG_CONFIG_PATH" >> "$GITHUB_ENV"
      - name: Build musl-native OpenSSL
        run: |
          wget -q https://github.com/openssl/openssl/releases/download/openssl-3.5.4/openssl-3.5.4.tar.gz -O /tmp/openssl-3.5.4.tar.gz
          echo '967311f84955316969bdb1d8d4b983718ef42338639c621ec4c34fddef355e99  /tmp/openssl-3.5.4.tar.gz' | sha256sum --check --strict
          tar -C /tmp -xf /tmp/openssl-3.5.4.tar.gz
          cd /tmp/openssl-3.5.4
          CC=musl-gcc ./Configure linux-x86_64 no-shared no-tests no-secure-memory no-afalgeng --prefix=/usr/local --libdir=lib64 --openssldir=/usr/local/ssl
          make -j"$(nproc)"
          make install_sw
          export PKG_CONFIG_PATH="/usr/local/lib64/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"
          test "$(pkg-config --variable=prefix openssl)" = /usr/local
          printf '%s\n' '#include <openssl/ssl.h>' 'int main(void) { SSL_CTX *ctx = SSL_CTX_new(TLS_method()); if (!ctx || !OpenSSL_version_num()) return 1; SSL_CTX_free(ctx); return 0; }' > /tmp/musl-openssl-smoke.c
          musl-gcc -static $(pkg-config --cflags openssl) /tmp/musl-openssl-smoke.c -o /tmp/musl-openssl-smoke $(pkg-config --libs --static openssl)
          /tmp/musl-openssl-smoke
          echo "PKG_CONFIG_PATH=$PKG_CONFIG_PATH" >> "$GITHUB_ENV"
      - name: All code is formatted
        run: ./v -silent test-cleancode
      - name: Test V fixed tests
        run: ./v -silent test-self vlib
