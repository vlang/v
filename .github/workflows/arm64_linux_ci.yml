name: ARM64 Linux CI

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths-ignore:
      - '**.md'
      - '**.yml'
      - '!**/arm64_linux_ci.yml'
      - 'cmd/tools/**'
      - '!cmd/tools/builders/**.v'
  pull_request:
    paths:
      - 'cmd/v/**'
      - 'cmd/tools/builders/**.v'
      - 'vlib/arrays/**'
      - 'vlib/builtin/**'
      - 'vlib/encoding/binary/**'
      - 'vlib/os/**'
      - 'vlib/time/**'
      - 'vlib/runtime/**'
      - 'vlib/term/**'
      - 'vlib/net/**'
      - 'vlib/crypto/rand/**'
      - 'vlib/picoev/**'
      - 'vlib/rand/**'
      - 'vlib/strconv/**'
      - 'vlib/strings/**'
      - 'vlib/sync/**'
      - 'vlib/v/**'
      - 'thirdparty/**'
      - 'vc/**'
      - 'v.mod'
      - 'GNUmakefile'
      - 'Makefile'
      - '.github/problem-matchers/**'
      - '!**.md'
      - '!**.yml'
      - '.github/workflows/arm64_linux_ci.yml'

concurrency:
  group: arm64-${{ github.workflow }}-${{ github.ref == 'refs/heads/master' && github.sha || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  arm64_linux:
    # Native ARM64 runner (no QEMU) — fast and accurate for aarch64.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    name: Build on ubuntu-24.04 arm64
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build V
        run: |
          uname -a
          make --version
          gcc --version
          make
          file ./v
          ./v version
      - name: Run smoke tests
        env:
          V_MACOS_V3_NO_FALLBACK: '1'
        run: |
          ./v test vlib/builtin vlib/os vlib/encoding/binary
          ./v test vlib/v/tests/fns/closure_test.v
      - name: fastc backend smoke
        run: |
          ./v -b fastc -o /tmp/hello_fastc examples/hello_world.v && /tmp/hello_fastc

