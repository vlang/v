name: Linux native libc probe regression

on:
  pull_request:
    paths:
      - 'vlib/v/gen/c/linux_core_preamble_test.v'
      - '.github/workflows/linux_native_libc_probe_ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legacy_ubuntu:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: thevlang/vlang:ubuntu-build
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Rebuild V and verify formatting
        run: |
          git config --global --add safe.directory "$(pwd -P)"
          make -j4
          ./v -prod -cg -o v cmd/v
          ./v fmt -w vlib/v/gen/c/linux_core_preamble_test.v
          git diff -- vlib/v/gen/c/linux_core_preamble_test.v
          git diff --exit-code -- vlib/v/gen/c/linux_core_preamble_test.v
          ./v fmt -verify vlib/v/gen/c/linux_core_preamble_test.v
      - name: Original glibc and musl SDK assertions
        run: |
          set -eu
          cc --version
          musl-gcc --version
          VFLAGS='-cc gcc -gc none' ./v -silent -no-retry-compilation vlib/v/gen/c/linux_core_preamble_test.v
          VFLAGS='-cc musl-gcc -gc none -d use_bundled_libgc' ./v -silent -no-retry-compilation vlib/v/gen/c/linux_core_preamble_test.v
      - name: Original SDK fixture with test-self flag isolation
        run: |
          set -eu
          env -u VFLAGS -u VOSARGS ./v -cc gcc -gc none -silent -no-retry-compilation vlib/v/gen/c/linux_core_preamble_test.v
          env -u VFLAGS -u VOSARGS ./v -cc musl-gcc -gc none -d use_bundled_libgc -silent -no-retry-compilation vlib/v/gen/c/linux_core_preamble_test.v
  native_alpine:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: thevlang/vlang:alpine-build
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build V and run the native musl SDK assertions
        run: |
          apk add musl-dev gcc gc gc-dev binutils diffutils elfutils
          git config --global --add safe.directory "$(pwd -P)"
          CC=gcc make && V_CI_SOURCE_BUILD=1 sh .github/workflows/prepare_v.sh
          ./v fmt -w vlib/v/gen/c/linux_core_preamble_test.v
          git diff -- vlib/v/gen/c/linux_core_preamble_test.v
          git diff --exit-code -- vlib/v/gen/c/linux_core_preamble_test.v
          ./v fmt -verify vlib/v/gen/c/linux_core_preamble_test.v
          VFLAGS='-cc gcc -gc none' ./v -silent -no-retry-compilation vlib/v/gen/c/linux_core_preamble_test.v
