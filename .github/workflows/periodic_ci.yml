name: Periodic CI

on:
  schedule:
    - cron: '0 */6 * * *'
  push:
    branches:
      - master
    paths:
      - '**/periodic_ci.yml'
  pull_request:
    paths:
      - '**/periodic_ci.yml'

concurrency:
  group: periodic-${{ github.workflow }}-${{ github.ref == 'refs/heads/master' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  periodic-network:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            cc: tcc
          - os: windows-latest
            cc: msvc
          - os: macos-latest
            cc: clang
      fail-fast: false
    runs-on: ${{ matrix.os }}
    if: github.event_name != 'schedule' || (github.ref == 'refs/heads/master' && github.repository == 'vlang/v')
    timeout-minutes: 30
    env:
      VFLAGS: -cc ${{ matrix.cc }}
      V_CI_PERIODIC: 1
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Build
        if: runner.os != 'Windows'
        run: make -j4 && ./v -showcc -o v cmd/v && ./v doctor
      - name: Build V (Windows)
        if: runner.os == 'Windows'
        run: ./makev.bat -msvc && ./v -o v2.exe cmd/v && ./v2 -showcc -o v.exe cmd/v && ./v doctor
      - name: Install OpenSSL (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install openssl -y --no-progress
          $opensslBin = 'C:\Program Files\OpenSSL\bin'
          $libDir = 'C:\Program Files\OpenSSL\lib\VC\x64\MD'
          Add-Content -Path $env:GITHUB_PATH -Value $opensslBin
          Copy-Item -Path (Join-Path $libDir 'libcrypto.lib') -Destination (Join-Path $libDir 'crypto.lib') -Force
      - name: Test
        run: ./v -d network -silent test-self vlib/net
