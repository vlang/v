name: PR 32364 native Linux review probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      VJOBS: '2'
      V_MACOS_V3_NO_FALLBACK: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Bootstrap the exact review revision
        run: |
          env -u VFLAGS -u VEXE make -j2
          git rev-parse HEAD
          ./v version
      - name: Record pruning for a standalone compiler import
        run: |
          mkdir -p review-probe
          printf 'import v.driver\nfn main() { println(driver.project_backend_flag) }\n' > "$RUNNER_TEMP/main.v"
          env -u VFLAGS -u VEXE ./v -new-compiler -no-retry-compilation -nocache -v -o review-probe/main.c "$RUNNER_TEMP/main.v" > review-probe/generate.log 2>&1
          python3 - <<'PYCODE'
          from pathlib import Path
          c = Path('review-probe/main.c').read_text()
          print('C bytes:', len(c.encode()))
          for symbol in ['driver__run', 'c__gen_expr_lvalue', 'c__FlatGen__gen_fn_items_scoped_batches', 'markused__CallCollector__collect_bodies_scoped_batches', 'parser__Parser__precollect_parallel_comptime_consts', 'types__TypeChecker__check_scoped_batches']:
              print(symbol, ('void ' + symbol + '(') in c)
          PYCODE
      - name: Run the review regression command
        run: |
          env -u VFLAGS -u VEXE ./v -new-compiler -no-retry-compilation -silent test vlib/v/markused/ vlib/v/driver/unused_compiler_import_test.v > review-probe/tests.log 2>&1
      - name: Upload diagnostic logs and C
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pr32364-linux-review-probe
          path: review-probe/
          retention-days: 1
