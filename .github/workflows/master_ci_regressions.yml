name: Master CI regressions

on:
  pull_request:
    paths:
      - 'vlib/v/compiler_tests/**'
      - 'vlib/v/gen/amd64/native_float_literal_test.v'
      - '.github/workflows/master_ci_regressions.yml'
      - '.github/workflows/build_on_ubuntu_25_ci.yml'
      - '.github/workflows/linux_ci.yml'
      - '.github/workflows/macos_ci.yml'
      - '.github/workflows/other_ci.yml'
      - '.github/workflows/tools_ci.yml'
      - '.github/workflows/riscv64_linux_ci.yml'
      - '.github/workflows/sanitized_ci.yml'
      - '.github/workflows/windows_ci_gcc.yml'
      - '.github/workflows/v_apps_and_modules_compile_ci.yml'
      - '.github/workflows/disable_azure_mirror*'
      - '.github/workflows/ci_timeout_contract_test.py'
      - '.github/workflows/prepare_v*'
      - '.github/workflows/setup_windows_tool_cache.ps1'
      - '.github/actions/setup-v/**'
      - '.github/actions/cache-apt-packages-action/**'
      - 'ci/linux_ci.vsh'
      - 'ci/linux_ci_resume_test.sh'
      - 'makev.bat'
      - 'GNUmakefile'
      - 'cmd/tools/vtest_test.v'
  workflow_dispatch:

concurrency:
  group: master-ci-regressions-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contracts:
    name: Linux workflow contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      VJOBS: '2'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check apt source setup
        run: bash .github/workflows/disable_azure_mirror_test.sh
      - name: Check CI task coverage and deadlines
        run: python3 .github/workflows/ci_timeout_contract_test.py
      - name: Check optimized compiler artifact reuse
        run: python3 .github/workflows/prepare_v_test.py
      - name: Build V
        uses: ./.github/actions/setup-v
        with:
          symlink: 'false'
      - name: Validate fixed-array heap sum defaults with GCC and Clang
        timeout-minutes: 10
        run: |
          ./v fmt -verify vlib/v/tests/sumtypes/heap_sum_default_named_like_reflection_struct_test.v
          ./v -cc gcc -silent vlib/v/tests/sumtypes/heap_sum_default_named_like_reflection_struct_test.v
          ./v -cc clang -silent vlib/v/tests/sumtypes/heap_sum_default_named_like_reflection_struct_test.v
          ./v -cc gcc -silent vlib/json2/tests/legacy_json_edge_cases_test.v
          ./v -cc clang -silent vlib/json2/tests/legacy_json_edge_cases_test.v
      # Deliberately inherit the fail-fast setting used by tools_ci. The outer
      # vtest self-test must still count its passing and failing child files.
      - name: Run complete nested vtest fixture under outer fail-fast
        timeout-minutes: 15
        env:
          VTEST_FAIL_FAST: '1'
        run: |
          ./v fmt -verify cmd/tools/vtest_test.v
          ./v -cc gcc -silent cmd/tools/vtest_test.v
          ./v -cc clang -silent cmd/tools/vtest_test.v
      - name: Verify AMD64 floating-point sign bits in debug and production modes
        timeout-minutes: 10
        run: |
          ./v fmt -verify vlib/v/gen/amd64/native_float_literal_test.v
          ./v -cc gcc -silent vlib/v/gen/amd64/native_float_literal_test.v
          ./v -cc clang -silent vlib/v/gen/amd64/native_float_literal_test.v
      - name: Verify AMD64 floating-point sign bits with musl-gcc
        timeout-minutes: 10
        run: |
          sudo apt-get -qq update
          sudo apt-get -qq --no-install-recommends install musl-tools
          ./v -cc musl-gcc -gc none -d use_bundled_libgc -silent vlib/v/gen/amd64/native_float_literal_test.v
      - name: Check Linux task checkpoint and resume behavior
        run: sh ci/linux_ci_resume_test.sh
      - name: Check hosted apt dependencies
        timeout-minutes: 10
        run: |
          bash .github/workflows/disable_azure_mirror.sh
          sudo apt-get -qq update
          sudo apt-get -qq --no-install-recommends install sassc
          sassc --version

  windows:
    name: Windows regressions (${{ matrix.cc }})
    runs-on: ${{ matrix.cc == 'tcc' && 'windows-2022' || 'windows-2025' }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        cc: [tcc, msvc]
    env:
      VJOBS: '2'
      VTEST_FAIL_FAST: '0'
      VFLAGS: -cc ${{ matrix.cc }} -no-retry-compilation
      V_CI_CCOMPILER: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Prepare private tool cache
        run: .\.github\workflows\setup_windows_tool_cache.ps1
      # Both lanes need a production compiler for setup-v; tests keep their
      # explicit matrix compiler through VFLAGS, including nested V builds.
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64
      - name: Bootstrap V
        run: |
          .\makev.bat "-$env:V_CI_CCOMPILER"
          if ($LASTEXITCODE -ne 0) { throw "V bootstrap failed (exit $LASTEXITCODE)" }
      # Check the original Windows path regression with an actual TCC/V
      # bootstrap, rather than relying on a makev.bat string contract.
      - name: Bootstrap TCC in a checkout with punctuation and spaces
        if: matrix.cc == 'tcc'
        timeout-minutes: 20
        shell: pwsh
        run: |
          $caseDir = Join-Path $env:RUNNER_TEMP 'path with some $punctuation, and some spaces'
          git clone --local . "$caseDir"
          if ($LASTEXITCODE -ne 0) { throw "Failed to clone into space-path fixture" }
          Push-Location -LiteralPath $caseDir
          try {
            # Match paths_ci.yml: its native bootstrap does not set VFLAGS.
            Remove-Item Env:VFLAGS -ErrorAction SilentlyContinue
            .\makev.bat -tcc
            if ($LASTEXITCODE -ne 0) { throw "Space-path TCC bootstrap failed (exit $LASTEXITCODE)" }
            .\v.exe -prod -cc gcc self
            if ($LASTEXITCODE -ne 0) { throw "Space-path V self build failed (exit $LASTEXITCODE)" }
            .\v.exe test vlib/builtin vlib/os
            if ($LASTEXITCODE -ne 0) { throw "Space-path V tests failed (exit $LASTEXITCODE)" }
          } finally {
            Pop-Location
          }
      - name: Check Windows TCC bootstrap path argument contract
        if: matrix.cc == 'tcc'
        run: python cmd/tools/makev_test.py
      - name: Prepare optimized V compiler
        id: build
        uses: ./.github/actions/setup-v
        with:
          symlink: 'false'
      - name: Check complex macro identifiers without compiler fallback
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 5
        run: |
          .\v.exe -cc $env:V_CI_CCOMPILER -no-retry-compilation vlib/v/compiler_tests/complex_header_identifier_test.v
          if ($LASTEXITCODE -ne 0) { throw "Complex identifier regression failed (exit $LASTEXITCODE)" }
      - name: Check synthesized entry points and cleanup
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 20
        run: |
          $tests = @(
            'vlib/v/compiler_tests/comptime_top_level_decl_codegen_test.v'
            'vlib/v/compiler_tests/executable_cleanup_test.v'
            'vlib/v/compiler_tests/mixed_lock_codegen_test.v'
          )
          .\v.exe -cc $env:V_CI_CCOMPILER -no-retry-compilation test @tests
          if ($LASTEXITCODE -ne 0) { throw "Entry point regressions failed (exit $LASTEXITCODE)" }
