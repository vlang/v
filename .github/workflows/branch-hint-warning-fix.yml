name: Validate branch hint warning fix

on:
  push:
    branches:
      - fix/checker-likely-parentheses-warning
    paths:
      - .github/workflows/branch-hint-warning-fix.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/checker-likely-parentheses-warning
          fetch-depth: 2
      - name: Apply targeted fix and regression fixture
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('vlib/v/types/checker_tail.v')
          original = path.read_text()
          old = "\tif condition.kind == .paren && condition.value != '__v3_comptime_d' {\n"
          new = (
              "\t// Branch hints also use .paren nodes, but their parentheses are required.\n"
              "\tif condition.kind == .paren && condition.value != '__v3_comptime_d'\n"
              "\t\t&& tc.node_source_starts_with(cond_id, '(') {\n"
          )
          if original.count(old) != 1:
              raise SystemExit('Expected exactly one unchanged if-condition warning guard')
          path.write_text(original.replace(old, new, 1))

          fixture = Path('vlib/v/checker/tests/likely_unlikely_if_conditions.vv')
          expected = fixture.with_suffix('.out')
          if fixture.exists() or expected.exists():
              raise SystemExit('Regression fixture already exists')
          fixture.write_text('''fn hinted_sign(value int) int {
          \tif _unlikely_(value == 0) {
          \t\treturn 0
          \t} else if _likely_(value > 0) {
          \t\treturn 1
          \t}
          \treturn -1
          }

          fn main() {
          \tassert hinted_sign(-1) == -1
          \tassert hinted_sign(0) == 0
          \tassert hinted_sign(1) == 1

          \tvalue := 1
          \tif _likely_(value == 1) {
          \t\tassert value > 0
          \t} else if _unlikely_(value == 0) {
          \t\tassert false
          \t}

          \tlikely := if _likely_(value == 1) { 10 } else { 20 }
          \tunlikely := if _unlikely_(value == 0) { 10 } else { 20 }
          \tassert likely == 10
          \tassert unlikely == 20

          \tif _unlikely_((value == 0)) {
          \t\tassert false
          \t}
          }
          ''')
          expected.write_text('')
          PY
          git diff --check
      - name: Publish fix without the temporary workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/branch-hint-warning-fix.yml
          git add vlib/v/types/checker_tail.v vlib/v/checker/tests/likely_unlikely_if_conditions.vv vlib/v/checker/tests/likely_unlikely_if_conditions.out
          git commit -m 'checker: avoid parentheses warnings for branch hints'
          git push origin HEAD:fix/checker-likely-parentheses-warning
      - name: Build the patched compiler
        run: make
      - name: Verify branch hints produce no diagnostics
        shell: bash
        env:
          VCOLORS: never
        run: |
          ./v -check vlib/v/checker/tests/likely_unlikely_if_conditions.vv > /tmp/branch-hints-check.log 2>&1
          cat /tmp/branch-hints-check.log
          test ! -s /tmp/branch-hints-check.log
          ./v run vlib/v/checker/tests/likely_unlikely_if_conditions.vv
      - name: Verify ordinary parenthesized conditions still warn
        shell: bash
        env:
          VCOLORS: never
        run: |
          ./v -check vlib/v/checker/tests/unnecessary_parenthesis.vv > /tmp/parentheses-check.log 2>&1
          cat /tmp/parentheses-check.log
          test "$(grep -c 'warning: unnecessary' /tmp/parentheses-check.log)" -eq 3
      - name: Run branch-hint and big-integer tests
        run: |
          ./v vlib/v/tests/supports__likely__test.v
          ./v vlib/math/big/big_test.v
          ./v test vlib/math/big
