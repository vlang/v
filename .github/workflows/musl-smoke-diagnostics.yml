name: Musl smoke diagnostics

'on':
  pull_request:
    paths:
      - '.github/workflows/musl-smoke-diagnostics.yml'

permissions:
  contents: read

jobs:
  trace-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      VTEST_FAIL_FAST: '1'
    container:
      image: thevlang/vlang@sha256:6bdb6206d0523c91b4ffeccd7eacecad41c2c9621a3f02da87ace639fd6e5255
      env:
        V_CI_MUSL: 1
        V_CI_UBUNTU_MUSL: 1
        VFLAGS: -cc musl-gcc -gc none
      volumes:
        - ${{ github.workspace }}:/opt/vlang
    steps:
      - name: Checkout the failing source snapshot
        uses: actions/checkout@v7
        with:
          ref: 8636a8fe6c2d285f6bb60ad5686b6ffda61f9835
          persist-credentials: false
      - name: Install the diagnostic tracer
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends --no-upgrade strace
      - name: Build V using the original CI command
        run: make && ./v -cg -o v cmd/v && ./v symlink
      - name: Record toolchain and trace the smoke matrix
        run: |
          git config --global --add safe.directory /__w/v/v
          cc --version
          musl-gcc --version
          nproc
          ulimit -s
          printf 'VJOBS=%s\n' "${VJOBS-unset}"
          ./v cmd/tools/test_if_v_test_system_works.v
          set +e
          (sleep 150; ps -eLo pid,tid,ppid,stat,wchan:32,comm) &
          observer=$!
          timeout --signal=TERM --kill-after=10s 240s strace -f -tt -T -s 80 \
            -e trace=process,desc,futex -o /tmp/musl-smoke.strace \
            ./cmd/tools/test_if_v_test_system_works > /tmp/musl-smoke.log 2>&1
          status=$?
          kill "$observer" 2>/dev/null
          wait "$observer" 2>/dev/null
          cat /tmp/musl-smoke.log
          tail -n 400 /tmp/musl-smoke.strace
          exit "$status"
