name: Temporary issue 28749 validation

on:
  push:
    branches:
      - fix/28749-shared-export-visibility
    paths:
      - .github/workflows/issue_28749_validation.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.repository == 'vlang/v'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VJOBS: 2
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - name: Apply the narrowly scoped driver fix
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 - <<'PY'
          import pathlib
          import subprocess
          path = pathlib.Path('vlib/v/driver/driver.v')
          original = path.read_bytes()
          blob = subprocess.check_output(['git', 'hash-object', str(path)], text=True).strip()
          assert blob == 'b27b1e7dc5af75b8e094ee88cb3df465c4e0432d', blob
          old = b"\t\tif !options.is_liveshared && options.target_os == 'macos' {\n\t\t\tbefore_inputs << '-fvisibility=hidden'"
          new = b"\t\tif !options.is_liveshared && options.target_os in ['linux', 'macos'] {\n\t\t\tbefore_inputs << '-fvisibility=hidden'"
          assert original.count(old) == 1
          path.write_bytes(original.replace(old, new, 1))
          PY
          git diff --check
          git diff -- vlib/v/driver/driver.v
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add vlib/v/driver/driver.v
          git commit -m 'driver: hide unexported symbols in Linux shared libraries'
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"

      - name: Build the current V compiler
        run: make -j2

      - name: Rebuild V from the patched checkout
        run: ./v self

      - name: Format the regression tests
        shell: bash
        run: |
          set -euo pipefail
          ./v fmt -w vlib/v/driver/shared_visibility_test.v vlib/v/tests/shared_library_new_compiler_visibility_test.v
          git diff --check
          if ! git diff --quiet -- vlib/v/driver/shared_visibility_test.v vlib/v/tests/shared_library_new_compiler_visibility_test.v; then
            git add vlib/v/driver/shared_visibility_test.v vlib/v/tests/shared_library_new_compiler_visibility_test.v
            git commit -m 'tests: format shared-library visibility regressions'
            git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
          fi

      - name: Check shared-library flag selection
        run: ./v vlib/v/driver/shared_visibility_test.v

      - name: Check the new compiler shared-library exports and C host
        if: success() || failure()
        run: ./v vlib/v/tests/shared_library_new_compiler_visibility_test.v

      - name: Check the existing shared-library regression with default GC
        if: success() || failure()
        run: ./v vlib/v/tests/shared_library_system_link_test.v

      - name: Check compiler error regressions
        if: success() || failure()
        run: ./v -silent vlib/v/compiler_errors_test.v

      - name: Check C code generation
        if: success() || failure()
        run: ./v -silent test vlib/v/gen/c/
