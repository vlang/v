name: Test selection regressions

on:
  push:
    branches: [master]
    paths:
      - 'cmd/tools/vtest*.v'
      - 'cmd/tools/testing/**'
      - 'cmd/v/**'
      - 'vlib/v/build_constraint/**'
      - 'vlib/v/pref/**'
      - 'vlib/v/util/vflags/**'
      - '.github/workflows/test_selection_ci.yml'
  pull_request:
    paths:
      - 'cmd/tools/vtest*.v'
      - 'cmd/tools/testing/**'
      - 'cmd/v/**'
      - 'vlib/v/build_constraint/**'
      - 'vlib/v/pref/**'
      - 'vlib/v/util/vflags/**'
      - '.github/workflows/test_selection_ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-selection:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            cc: gcc
            build: make
            v: ./v
          - os: macos-14
            cc: clang
            build: make
            v: ./v
          - os: windows-2025
            cc: gcc
            build: .\makev.bat -gcc
            v: ./v.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      VFLAGS: -cc ${{ matrix.cc }}
      VJOBS: '2'
      V_C_ERROR_BUG_REPORT_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7
      - name: Build V
        run: ${{ matrix.build }}
      - name: Check explicit and recursive test selection
        run: ${{ matrix.v }} -new-compiler -gc none cmd/tools/vtest_selection_test.v
