name: Test selection regressions

on:
  workflow_call:

  workflow_dispatch:

concurrency:
  group: test-selection-test_selection_ci-${{ github.ref == 'refs/heads/master' && github.sha || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-selection:
    if: github.ref == 'refs/heads/master'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            cc: gcc
            v: ./v
          - os: macos-15
            cc: clang
            v: ./v
          - os: windows-2025
            cc: gcc
            v: ./v.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      VFLAGS: -cc ${{ matrix.cc }}
      VJOBS: '2'
      V_C_ERROR_BUG_REPORT_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build V
        uses: ./.github/actions/setup-v
        with:
          symlink: 'false'
      - name: Check explicit and recursive test selection
        run: ${{ matrix.v }} -new-compiler -gc none cmd/tools/vtest_selection_test.v
