name: Test selection regressions

on:
  push:
    branches: [master]
    paths:
      - 'cmd/tools/vtest*.v'
      - 'cmd/tools/testing/**'
      - 'cmd/v/**'
      - 'vlib/v/build_constraint/**'
      - 'vlib/v/pref/**'
      - 'vlib/v/util/vflags/**'
      - '.github/workflows/test_selection_ci.yml'
  pull_request:
    paths:
      - 'cmd/tools/vtest*.v'
      - 'cmd/tools/testing/**'
      - 'cmd/v/**'
      - 'vlib/v/build_constraint/**'
      - 'vlib/v/pref/**'
      - 'vlib/v/util/vflags/**'
      - '.github/workflows/test_selection_ci.yml'
  workflow_dispatch:

concurrency:
  group: test-selection-${{ github.workflow }}-${{ github.ref == 'refs/heads/master' && github.sha || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-selection:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            cc: gcc
            build: make
            v: ./v
          - os: macos-14
            cc: clang
            build: make
            v: ./v
          - os: windows-2025
            cc: gcc
            build: .\makev.bat -gcc
            v: ./v.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      VFLAGS: -cc ${{ matrix.cc }}
      VJOBS: '2'
      V_C_ERROR_BUG_REPORT_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7
        id: uses_checkout_v7
        with:
          persist-credentials: false
      - name: Build V
        id: build_v
        if: ${{ success() && !cancelled() && steps.uses_checkout_v7.outcome == 'success' }}
        run: ${{ matrix.build }}
      - name: Check explicit and recursive test selection
        id: check_explicit_and_recursive_test_selection
        if: ${{ success() && !cancelled() && steps.build_v.outcome == 'success' }}
        run: ${{ matrix.v }} -new-compiler -gc none cmd/tools/vtest_selection_test.v
