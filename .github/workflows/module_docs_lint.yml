name: Code CI vlib modules

on:
  workflow_call:

concurrency:
  group: module-docs-lint-module_docs_lint-${{ github.ref == 'refs/heads/master' && github.sha || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-module-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check Formatting
        uses: creyD/prettier_action@8c18391fdc98ed0d884c6345f03975edac71b8f0 # v4.6
        with:
          prettier_options: --check cmd/tools/vdoc/theme
