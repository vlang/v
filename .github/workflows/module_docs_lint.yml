name: Code CI vlib modules

on:
  push:
    branches:
      - master
    paths:
      - '**/cmd/tools/vdoc/theme/**'
  pull_request:
    paths:
      - '**/cmd/tools/vdoc/theme/**'

concurrency:
  group: module-docs-lint-${{ github.workflow }}-${{ github.ref == 'refs/heads/master' && github.sha || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-module-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        id: uses_checkout_v7
        with:
          persist-credentials: false
      - name: Check Formatting
        id: check_formatting
        if: ${{ success() && !cancelled() && steps.uses_checkout_v7.outcome == 'success' }}
        uses: creyD/prettier_action@8c18391fdc98ed0d884c6345f03975edac71b8f0 # v4.6
        with:
          prettier_options: --check cmd/tools/vdoc/theme
