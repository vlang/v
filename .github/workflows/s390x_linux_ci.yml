name: s390 CI

on:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: s390x-s390x_linux_ci-${{ github.ref == 'refs/heads/master' && github.sha || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  s390x_linux:
    if: github.ref == 'refs/heads/master'
    # The host should always be Linux
    runs-on: ubuntu-22.04
    # Embedding the Linux-default V3 compiler makes both bootstrap stages slow under QEMU.
    timeout-minutes: 120
    name: Build on ubuntu-22.04 s390x
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: uraimo/run-on-arch-action@1e2c619f81e6d8609845ea1d2f443a778df1ac68 # v3
        name: Bootstrap and generate the optimized compiler
        with:
          arch: s390x
          distro: ubuntu22.04
          base_image: --platform=linux/s390x s390x/ubuntu:22.04
          # The token tag here is not required, but speeds up builds,
          # by allowing caching of the installed dependencies, which is ~2.5min:
          githubToken: ${{ github.token }}
          shell: /bin/bash
          install: |
            apt-get update -q -y
            apt-get install -q -y make gcc git file coreutils binutils
          run: |
            # The checkout belongs to the host runner, not the container's root user.
            # Scope Git's ownership exception to this mounted repository only.
            git config --global --add safe.directory "$(pwd -P)"
            uname -a
            make --version
            gcc --version
            ls -la
            make
            file ./v
            ls -la ./v
            V_CI_SOURCE_BUILD=1 V_CI_VPROD_STAGE=generate sh .github/workflows/prepare_v.sh
      # The native `gcc -O2` of the generated C takes about 45 minutes under QEMU.
      # Ubuntu's cross compiler on the x86 host is the same gcc release with the
      # same glibc as the s390x container, and finishes in a few minutes.
      - name: Compile the optimized compiler with a cross compiler
        run: |
          set -euo pipefail
          sudo chown -R "$(id -u):$(id -g)" .
          sudo apt-get update -q -y
          sudo apt-get install -q -y gcc-s390x-linux-gnu
          mkdir -p "$RUNNER_TEMP/cross-gcc"
          ln -sf "$(command -v s390x-linux-gnu-gcc)" "$RUNNER_TEMP/cross-gcc/gcc"
          PATH="$RUNNER_TEMP/cross-gcc:$PATH" make --no-print-directory -C vprod.project
          file vprod.project/v
      - uses: uraimo/run-on-arch-action@1e2c619f81e6d8609845ea1d2f443a778df1ac68 # v3
        name: Install the optimized compiler and run tests
        with:
          arch: s390x
          distro: ubuntu22.04
          base_image: --platform=linux/s390x s390x/ubuntu:22.04
          githubToken: ${{ github.token }}
          shell: /bin/bash
          install: |
            apt-get update -q -y
            apt-get install -q -y make gcc git file coreutils binutils
          run: |
            set -euo pipefail
            git config --global --add safe.directory "$(pwd -P)"
            # Installing runs the compiler on s390x first (`v -version`).
            V_CI_SOURCE_BUILD=1 V_CI_VPROD_STAGE=install sh .github/workflows/prepare_v.sh
            # V3 is the default compiler on Linux. Keep bootstrap fallback-compatible,
            # then make ordinary test compilation fail instead of silently retrying V1.
            ./v test vlib/builtin vlib/os vlib/encoding/binary
            ./v test vlib/v/tests/fns/closure_test.v
