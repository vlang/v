name: UI2 cloned-map integration and validation
on:
  push:
    branches: [fix/ui2-cloned-map-alias]
    paths: [.github/workflows/ui2-alias-integration.yml]
permissions:
  contents: read
concurrency:
  group: ui2-alias-integration
  cancel-in-progress: false
jobs:
  integrate-and-test:
    if: github.repository == 'vlang/v' && github.ref == 'refs/heads/fix/ui2-cloned-map-alias'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      VJOBS: 2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Apply only the reviewed checker integration
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object vlib/v/types/checker_comptime.v)" = '7e0baed1b3fbe6c93c056627de7018f3d0a782a7'
          python3 - <<'PY'
          from pathlib import Path
          path = Path('vlib/v/types/checker_comptime.v')
          source = path.read_text()
          start = source.index('fn (mut tc TypeChecker) check_mutable_alias_assignment_lhs(')
          end = source.index('\nfn ', start + 1)
          function = source[start:end]
          old = '\t\tif aliases {'
          new = '\t\tif aliases && !tc.mutable_alias_has_fresh_map_storage(base_id) {'
          assert function.count(old) == 1, 'Unexpected checker source; refusing to edit'
          path.write_text(source[:start] + function.replace(old, new, 1) + source[end:])
          PY
          git diff --check
          git diff -- vlib/v/types/checker_comptime.v
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add vlib/v/types/checker_comptime.v
          git commit -m 'checker: allow independent cloned-map entry replacement'
          git push origin HEAD:refs/heads/fix/ui2-cloned-map-alias
      - name: Build the patched compiler
        run: make -j2
      - name: Format the new helper and regression tests
        shell: bash
        run: |
          set -euo pipefail
          ./v fmt -w vlib/v/types/checker_map_clone_alias.v vlib/v/tests/map_clone_struct_scope_test.v vlib/v/compiler_tests/map_clone_alias_regression_test.v
          git diff --check
          git add vlib/v/types/checker_map_clone_alias.v vlib/v/tests/map_clone_struct_scope_test.v vlib/v/compiler_tests/map_clone_alias_regression_test.v
          if ! git diff --cached --quiet; then
            git commit -m 'checker: format cloned-map regression coverage'
            git push origin HEAD:refs/heads/fix/ui2-cloned-map-alias
          fi
      - name: Test UI2-style cloned recursive map scopes
        run: ./v -silent test vlib/v/tests/map_clone_struct_scope_test.v
      - name: Test nested mutation and escape diagnostics
        run: ./v -silent test vlib/v/compiler_tests/map_clone_alias_regression_test.v
      - name: Test existing fresh-collection alias behavior
        run: ./v -silent test vlib/v/compiler_tests/fresh_collection_builtin_alias_test.v
      - name: Run checker unit tests
        run: ./v -silent test vlib/v/types/
      - name: Run compiler diagnostic tests
        run: ./v -silent vlib/v/compiler_errors_test.v
      - name: Type-check the upstream UI2 users example
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth=1 https://github.com/vlang/ui2 "$RUNNER_TEMP/ui2"
          cd "$RUNNER_TEMP/ui2"
          "$GITHUB_WORKSPACE/v" -check examples/users
