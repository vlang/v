name: ppc64le Linux CI

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths-ignore:
      - '**.md'
      - '**.yml'
      - '!**/ppc64le_linux_ci.yml'
      - 'cmd/tools/**'
      - '!cmd/tools/builders/**.v'
  pull_request:
    paths:
      - 'cmd/v/**'
      - 'cmd/tools/builders/**.v'
      - 'vlib/arrays/**'
      - 'vlib/builtin/**'
      - 'vlib/encoding/binary/**'
      - 'vlib/os/**'
      - 'vlib/time/**'
      - 'vlib/runtime/**'
      - 'vlib/term/**'
      - 'vlib/net/**'
      - 'vlib/crypto/rand/**'
      - 'vlib/picoev/**'
      - 'vlib/rand/**'
      - 'vlib/strconv/**'
      - 'vlib/strings/**'
      - 'vlib/sync/**'
      - 'vlib/v/**'
      - 'thirdparty/**'
      - 'vc/**'
      - 'v.mod'
      - 'GNUmakefile'
      - 'Makefile'
      - '.github/problem-matchers/**'
      - '!**.md'
      - '!**.yml'
      - '.github/workflows/ppc64le_linux_ci.yml'

concurrency:
  group: ppc64le-${{ github.workflow }}-${{ github.ref == 'refs/heads/master' && github.sha || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ppc64le_linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    name: Build on ubuntu-24.04 ppc64le (QEMU)
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: uraimo/run-on-arch-action@1e2c619f81e6d8609845ea1d2f443a778df1ac68 # v3
        name: Run commands
        id: runcmd
        with:
          arch: ppc64le
          distro: ubuntu22.04
          base_image: --platform=linux/ppc64le ppc64le/ubuntu:22.04
          githubToken: ${{ github.token }}
          shell: /bin/bash
          install: |
            apt-get update -q -y
            apt-get install -q -y make gcc git file coreutils binutils
          run: |
            uname -a
            make --version
            gcc --version
            export LDFLAGS=""
            export VFLAGS="-gc none -no-retry-compilation -cc cc"
            make
            file ./v
            ls -la ./v
            export V_MACOS_V3_NO_FALLBACK=1
            ./v test vlib/builtin vlib/os vlib/encoding/binary
            ./v test vlib/v/tests/fns/closure_test.v
