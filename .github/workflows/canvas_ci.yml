name: Canvas Linux CI

on:
  workflow_call:

  pull_request:
    paths:
      - 'vlib/gg/canvas/**'
      - 'vlib/sokol/**'
      - 'thirdparty/sokol/**'
      - 'examples/assets/fonts/**'
      - '.github/workflows/canvas_ci.yml'

concurrency:
  group: canvas-linux-canvas_ci-${{ github.ref == 'refs/heads/master' && github.sha || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  canvas-linux:
    name: Linux canvas (${{ matrix.cc }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - cc: gcc
            flags: ''
          - cc: tcc
            flags: '-d no_sokol_app'
    env:
      LIBGL_ALWAYS_SOFTWARE: 'true'
      EGL_PLATFORM: surfaceless
      VTEST_FAIL_FAST: '1'
      V_MACOS_V3_NO_FALLBACK: '1'
      V_CANVAS_REQUIRE_GLSLANG: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install FreeType and headless OpenGL dependencies
        run: |
          .github/workflows/disable_azure_mirror.sh
          sudo apt-get update
          sudo apt-get install -y libfreetype-dev libegl-dev libgl-dev libgl1-mesa-dri libx11-dev libxi-dev libxcursor-dev glslang-tools
      - name: Build V
        uses: ./.github/actions/setup-v
        with:
          symlink: false
      - name: Run canvas tests without a display server
        run: |
          canvas_vtmp="$(mktemp -d "${RUNNER_TEMP}/v-canvas.XXXXXX")"
          env -u DISPLAY -u WAYLAND_DISPLAY VTMP="$canvas_vtmp" \
            ./v -cc ${{ matrix.cc }} ${{ matrix.flags }} test vlib/gg/canvas
