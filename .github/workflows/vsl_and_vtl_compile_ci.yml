name: VSL and VTL

on:
  push:
    branches:
      - master
    paths-ignore:
      - '**.md'
      - '**.yml'
      - '!**/vsl_and_vtl_compile_ci.yml'
      - 'examples/**'
      - 'cmd/tools/vrepl.v'

concurrency:
  group: vsl-vtl-${{ github.workflow }}-${{ github.ref == 'refs/heads/master' && github.sha || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  module-revisions:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      vsl: ${{ steps.revisions.outputs.vsl }}
      vtl: ${{ steps.revisions.outputs.vtl }}
    steps:
      - name: Resolve upstream revisions once for every backend and shard
        id: revisions
        run: |
          set -euo pipefail
          for module in vsl vtl; do
            module_revision=$(git ls-remote --exit-code "https://github.com/vlang/$module.git" HEAD | cut -f1)
            [[ "$module_revision" =~ ^[0-9a-f]{40}$ ]]
            printf '%s=%s\n' "$module" "$module_revision" >> "$GITHUB_OUTPUT"
          done

  vsl-compiles:
    needs: module-revisions
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-14]
        backend: [pure, cblas]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      VFLAGS: -no-parallel
      VSL_CI_REVISION: ${{ needs.module-revisions.outputs.vsl }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Cache apt packages
        if: runner.os == 'Linux'
        uses: ./.github/actions/cache-apt-packages-action
      - name: Cache Homebrew downloads
        if: runner.os == 'macOS'
        uses: actions/cache@v6
        with:
          path: ~/Library/Caches/Homebrew
          key: brew-${{ matrix.os }}-vsl-${{ hashFiles('.github/workflows/vsl_and_vtl_compile_ci.yml') }}
          restore-keys: |
            brew-${{ matrix.os }}-vsl-
            brew-${{ matrix.os }}-
      - name: Build V
        id: build
        run: make && sudo ./v symlink
      - name: Install dependencies
        run: |
          if [ "$RUNNER_OS" == 'Linux' ]; then
          .github/workflows/disable_azure_mirror.sh
          v retry -- sudo apt -qq update
          v retry -- sudo apt -qq install \
            libgc-dev libgl1-mesa-dev mesa-common-dev liblapacke-dev libopenblas-dev libopenmpi-dev \
            opencl-headers ocl-icd-opencl-dev pocl-opencl-icd \
            libvulkan-dev libxcursor-dev libxi-dev libxrandr-dev \
            libhdf5-cpp-103-1t64 libhdf5-dev libhdf5-mpi-dev hdf5-tools
          else
            v retry brew install coreutils hdf5 open-mpi openblas lapack opencl-headers
          fi
      - name: Install vsl
        run: |
          vsl_dir="$HOME/.vmodules/vsl"
          git init "$vsl_dir"
          git -C "$vsl_dir" remote add origin https://github.com/vlang/vsl.git
          v retry -- git -C "$vsl_dir" fetch --depth=1 origin "$VSL_CI_REVISION:refs/remotes/origin/ci-pinned"
          git -C "$vsl_dir" checkout --detach "$VSL_CI_REVISION"
          v retry -- git -C "$vsl_dir" submodule update --init --recursive --depth=1
          cd "$vsl_dir"
          v retry -- v install
      - name: Skip optional Vulkan examples on macOS
        if: runner.os == 'macOS'
        run: |
          for file in "$HOME"/.vmodules/vsl/examples/*vulkan*/*.v; do
            [ -e "$file" ] || continue
            mv "$file" "${file%.v}_not_ci.v"
          done
      - name: Test with Pure V Backend
        if: matrix.backend == 'pure'
        run: ~/.vmodules/vsl/bin/test
      - name: Test with CBLAS Backend
        if: matrix.backend == 'cblas'
        run: ~/.vmodules/vsl/bin/test --use-cblas --skip-examples

  vtl-compiles:
    needs: module-revisions
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-14]
        backend: [pure, cblas]
        shard: [0, 1, 2]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      VFLAGS: -no-parallel
      VJOBS: 1
      VTL_CI_BACKEND: ${{ matrix.backend }}
      VTL_CI_SHARD_INDEX: ${{ matrix.shard }}
      VTL_CI_SHARD_COUNT: '3'
      VTL_CI_REVISION: ${{ needs.module-revisions.outputs.vtl }}
      # Fixes complaints about $TERM not being set when running the vtl test script
      # (a warning on Linux, but an error on macOS).
      TERM: xterm
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate VTL command sharding
        if: matrix.backend == 'pure' && matrix.shard == 0
        run: python3 cmd/tools/vtl_ci_test.py
      - name: Cache apt packages
        if: runner.os == 'Linux'
        uses: ./.github/actions/cache-apt-packages-action
      - name: Cache Homebrew downloads
        if: runner.os == 'macOS'
        uses: actions/cache@v6
        with:
          path: ~/Library/Caches/Homebrew
          key: brew-${{ matrix.os }}-vtl-${{ hashFiles('.github/workflows/vsl_and_vtl_compile_ci.yml') }}
          restore-keys: |
            brew-${{ matrix.os }}-vtl-
            brew-${{ matrix.os }}-
      - name: Build V
        id: build
        run: make && sudo ./v symlink
      - name: Install dependencies
        run: |
          if [ "$RUNNER_OS" == 'Linux' ]; then
            .github/workflows/disable_azure_mirror.sh
            v retry -- sudo apt -qq update
            v retry -- sudo apt -qq install \
              libgc-dev libgl1-mesa-dev mesa-common-dev liblapacke-dev libopenblas-dev libopenmpi-dev
          else
            v retry brew install coreutils hdf5 open-mpi openblas lapack opencl-headers
          fi
      - name: Install vtl
        run: |
          vtl_dir="$HOME/.vmodules/vtl"
          git init "$vtl_dir"
          git -C "$vtl_dir" remote add origin https://github.com/vlang/vtl.git
          v retry -- git -C "$vtl_dir" fetch --depth=1 origin "$VTL_CI_REVISION:refs/remotes/origin/ci-pinned"
          git -C "$vtl_dir" checkout --detach "$VTL_CI_REVISION"
          v retry -- git -C "$vtl_dir" submodule update --init --recursive --depth=1
          cd "$vtl_dir"
          # Install the pinned VTL manifest's dependencies, including its VSL version.
          v retry -- v install
      - name: Skip optional Vulkan examples on macOS
        if: runner.os == 'macOS'
        run: |
          for file in "$HOME"/.vmodules/vtl/examples/*vulkan*/*.v; do
            [ -e "$file" ] || continue
            mv "$file" "${file%.v}_not_ci.v"
          done
      - name: Test VTL with ${{ matrix.backend }} backend (shard ${{ matrix.shard }})
        run: |
          # Keep upstream's scoped discovery, example builds, and smoke runs.
          # The PATH adapter assigns each target to one job without raising VJOBS.
          shard_bin="$RUNNER_TEMP/vtl-shard-bin"
          mkdir -p "$shard_bin"
          cp ci/vtl_v_shard.py "$shard_bin/v"
          chmod +x "$shard_bin/v"
          export VTL_CI_ROOT="$HOME/.vmodules/vtl"
          export VTL_CI_VEXE="$GITHUB_WORKSPACE/v"
          export VTL_CI_PATH="$PATH"
          export PATH="$shard_bin:$PATH"
          if [ "$VTL_CI_BACKEND" = "pure" ]; then
            ~/.vmodules/vtl/bin/test
          elif [ "$VTL_CI_BACKEND" = "cblas" ]; then
            ~/.vmodules/vtl/bin/test --use-cblas
          else
            echo "Unsupported VTL backend: $VTL_CI_BACKEND" >&2
            exit 1
          fi
