name: RISC-V GC fallback validation
concurrency:
  group: riscv-gc-validation-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  packages: write
jobs:
  riscv64_linux:
    if: github.ref == 'refs/heads/ci/verify-riscv-gc-20261031'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    name: Default GC with riscv64 system compiler
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - uses: uraimo/run-on-arch-action@1e2c619f81e6d8609845ea1d2f443a778df1ac68
      name: Run commands
      id: runcmd
      with:
        arch: riscv64
        distro: ubuntu24.04
        base_image: --platform=linux/riscv64 riscv64/ubuntu:24.04
        githubToken: ${{ github.token }}
        shell: /bin/bash
        install: |
          apt-get update -q -y
          apt-get install -q -y make gcc git file coreutils binutils
        run: |
          set -euo pipefail
          uname -a
          make --version
          gcc --version
          ls -la
          export LDFLAGS="-latomic"
          export VFLAGS="-gc none -no-retry-compilation -cc cc"
          make
          file ./v
          ls -la ./v
          # The explicit system-compiler fallback has no prebuilt GC archive.
          # Build the matching bundled collector once so nested compiler calls
          # and tests that explicitly enable Boehm can use the normal default.
          if [ ! -f thirdparty/tcc/lib/libgc.a ]; then
            grep -Fxq 'mode=system' thirdparty/tcc/.git/vlang-compatible-tcc/metadata
            mkdir -p thirdparty/tcc/lib
            cc -O2 -fPIC -pthread -Ithirdparty/libgc/include \
              -DGC_THREADS=1 -DTHREAD_LOCAL_ALLOC=1 -DGC_BUILTIN_ATOMIC=1 \
              -DALL_INTERIOR_POINTERS=1 -DUSE_MMAP=1 -DUSE_MUNMAP=1 -DHANDLE_FORK=1 \
              -c thirdparty/libgc/gc.c -o thirdparty/tcc/lib/gc.o
            ar rcs thirdparty/tcc/lib/libgc.a thirdparty/tcc/lib/gc.o
            rm thirdparty/tcc/lib/gc.o
          fi
          # -gc none is only for bootstrap, before the collector is available.
          export VFLAGS="-no-retry-compilation -cc cc"
          # V3 is the default compiler on Linux. Keep bootstrap fallback-compatible,
          # then make ordinary test compilation fail instead of silently retrying V1.
          export V_MACOS_V3_NO_FALLBACK=1
          export VJOBS=2
          ./v test vlib/builtin/gc_warn_proc_test.v vlib/builtin/input_rune_iterator_test.v vlib/os/exec_helpers_test.v
          ./v -new-compiler -no-retry-compilation -cc cc -gc boehm run vlib/builtin/testdata/gc_handle_fork.c.v
          ./v test vlib/builtin vlib/os vlib/encoding/binary
          ./v test vlib/v/slow_tests/assembly
          VTEST_ONLY=closure ./v test vlib/v/tests
'on':
  push:
    branches:
    - ci/verify-riscv-gc-20261031
  workflow_dispatch: {}
