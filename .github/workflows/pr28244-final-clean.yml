name: Finalize PR 28244 semantic history

on:
  push:
    branches:
      - v3-ownership-toml-value-copy

permissions:
  contents: write
  pull-requests: write

jobs:
  finalize:
    if: contains(github.event.head_commit.message, '[cleanup-pr-28244-final]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PR_BRANCH: v3-ownership-toml-value-copy
      TEST_SUBJECT: v3: organize borrowed ownership regressions by context
      SOURCE_SUBJECT: v3: model borrowed owned-value copies explicitly
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Locate and publish the validated semantic head
        shell: bash
        run: |
          set -euxo pipefail
          target=''
          for _ in $(seq 1 60); do
            git fetch --force origin \
              "refs/heads/${PR_BRANCH}:refs/remotes/origin/${PR_BRANCH}"
            target=$(git log "origin/${PR_BRANCH}" --format='%H' \
              --grep="^${TEST_SUBJECT}$" -1 || true)
            if [ -n "$target" ]; then break; fi
            sleep 30
          done
          test -n "$target"
          source_commit=$(git rev-parse "${target}^")
          test "$(git log -1 --format='%s' "$source_commit")" = "$SOURCE_SUBJECT"
          test "$(git log -1 --format='%s' "$target")" = "$TEST_SUBJECT"
          git cat-file -e "${target}:vlib/v3/tests/ownership_borrowed_projection_error_test.v"
          git cat-file -e "${target}:vlib/v3/tests/ownership_borrowed_projection_review_test.v"
          git cat-file -e "${target}:vlib/v3/tests/ownership_toml_decode_test.v"
          git cat-file -e "${target}:vlib/v3/tests/testdata/ownership_borrowed_projection/assignments.v.txt"
          git cat-file -e "${target}:vlib/v3/types/checker_ownership_d_ownership.v"
          git diff --check "${target}^" "$target"
          git push --force origin "${target}:refs/heads/${PR_BRANCH}"
          gh pr comment 28244 --body "Published the validated two-commit repair head: \`${target}\`. Temporary repair workflows and marker commits are no longer part of the PR branch."
        env:
          GH_TOKEN: ${{ github.token }}
