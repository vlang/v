name: VC gen

on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - 'vlib/v3/**'
      - '**.vv'
      - '**.out'
      - '**.md'
      - '**.yml'
      - '!**/gen_vc_ci.yml'
      - 'cmd/tools/**'
      - '!cmd/tools/builders/**.v'
  push:
    branches:
      - master
    paths-ignore:
      - 'vlib/v3/**'
      - '**.vv'
      - '**.out'
      - '**.md'
      - '**.yml'
      - '!**/gen_vc_ci.yml'
      - 'cmd/tools/**'
      - '!cmd/tools/builders/**.v'

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: gen_vc-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !contains(github.ref, 'master')}}

jobs:
  build-vc:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Diagnose remaining master failures
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          MASTER_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -uo pipefail
          runs_json="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs?event=push&per_page=100")"
          echo "Master SHA: ${MASTER_SHA}"
          echo '--- workflow summary ---'
          jq -r --arg sha "$MASTER_SHA" '
            .workflow_runs[]
            | select(.head_sha == $sha)
            | [.id, .name, .status, (.conclusion // "-")]
            | @tsv
          ' <<< "$runs_json" | sort -k2,2

          mapfile -t failed_runs < <(
            jq -r --arg sha "$MASTER_SHA" '
              .workflow_runs[]
              | select(.head_sha == $sha)
              | select(.conclusion == "failure" or .conclusion == "timed_out" or .conclusion == "action_required" or .conclusion == "startup_failure")
              | [.id, .name]
              | @tsv
            ' <<< "$runs_json"
          )
          echo "Failed workflow runs: ${#failed_runs[@]}"

          for run in "${failed_runs[@]}"; do
            run_id="${run%%$'\t'*}"
            run_name="${run#*$'\t'}"
            echo "::group::FAILED WORKFLOW: ${run_name} (${run_id})"
            jobs_json="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?per_page=100")"
            jq -r '.jobs[] | [.id, .name, .status, (.conclusion // "-")] | @tsv' <<< "$jobs_json"

            mapfile -t failed_jobs < <(
              jq -r '
                .jobs[]
                | select(.conclusion == "failure" or .conclusion == "timed_out" or .conclusion == "action_required" or .conclusion == "startup_failure")
                | [.id, .name]
                | @tsv
              ' <<< "$jobs_json"
            )
            for job in "${failed_jobs[@]}"; do
              job_id="${job%%$'\t'*}"
              job_name="${job#*$'\t'}"
              log_file="/tmp/master-job-${job_id}.log"
              echo "--- FAILED JOB: ${job_name} (${job_id}) ---"
              if gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/${job_id}/logs" > "$log_file"; then
                echo '--- likely diagnostics ---'
                grep -E -i -C 4 '(^|[^[:alpha:]])(error|fatal|failed|failure|panic|assert|undefined|unknown function|timed out|timeout)([^[:alpha:]]|$)' "$log_file" | tail -n 350 || true
                echo '--- log tail ---'
                tail -n 350 "$log_file"
              else
                echo "Could not download logs for job ${job_id}"
              fi
            done
            echo '::endgroup::'
          done
      - name: Build V
        run: make -j4
      - name: Regenerate v.c and v_win.c
        run: |
          git config --global user.email "vlang-bot@users.noreply.github.com"
          git config --global user.name "vlang-bot"

          COMMIT_HASH="$(git rev-parse HEAD)"
          COMMIT_MSG="$(git log -1 --oneline --pretty='%s' HEAD)"

          rm -rf vc
          ./v retry -- git clone --depth=1 "https://vlang-bot:${{ secrets.VLANG_BOT_SECRET }}@github.com/vlang/vc.git"

          rm -rf vc/v.c vc/v_win.c
          ./v -o vc/v.c     -cross               cmd/v
          ./v -o vc/v_win.c -os windows -cc msvc cmd/v

          sed -i "1s/^/#define V_COMMIT_HASH \"$COMMIT_HASH\"\n/" vc/v.c
          sed -i "1s/^/#define V_COMMIT_HASH \"$COMMIT_HASH\"\n/" vc/v_win.c

          # do some sanity checks for the generated v.c file:
          grep 'Turned ON custom defines: no_backtrace,cross'  vc/v.c
          grep '#define CUSTOM_DEFINE_cross' vc/v.c

          # ensure the generated C files for the compiler, are over 5000 lines long, as a safety measure
          [ "$(wc -l < vc/v.c)" -gt 5000 ]
          [ "$(wc -l < vc/v_win.c)" -gt 5000 ]

          git -C vc add v.c v_win.c
          git -C vc commit -m "[v:master] $COMMIT_HASH - $COMMIT_MSG"

          # in case there are recent commits:
          ./v retry -- git -C vc pull --rebase origin master
          git -C vc log -3

      - name: Deploy
        if: github.event_name == 'push' && github.repository == 'vlang/v' && github.ref == 'refs/heads/master'
        run: git -C vc push || true
