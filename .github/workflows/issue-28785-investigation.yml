name: Issue 28785 investigation
on:
  push:
    branches: ['fix/28785-reflected-method-callbacks']
    paths: ['.github/workflows/issue-28785-investigation.yml']
permissions:
  contents: write
jobs:
  apply-review-fix:
    if: github.repository == 'vlang/v' && github.ref == 'refs/heads/fix/28785-reflected-method-callbacks'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 313cbd42ff79652e6de510f93d31c7348ad5c1d0
      - name: Apply the reviewed source correction to PR 28786 only
        run: |
          set -eu
          branch=fix/28785-reflected-method-callbacks-pr
          expected=313cbd42ff79652e6de510f93d31c7348ad5c1d0
          git fetch origin "$branch"
          test "$(git rev-parse FETCH_HEAD)" = "$expected"
          test "$(git rev-parse HEAD)" = "$expected"
          test "$(git rev-parse HEAD:vlib/v/transform/transform.v)" = da77ed07fa365210961be4d683fab14f16d45290
          python3 - <<'PY'
          from pathlib import Path
          path = Path('vlib/v/transform/transform.v')
          text = path.read_text()
          old = '\t\t\tt.mark_fn_used_name(method_value_name)\n\t\t}\n\t\tmethod_params := t.call_param_types(method_value_name)'
          new = '\t\t\tt.mark_fn_used_name(method_value_name)\n\t\t\t// Interface callbacks also need their concrete dispatch targets when\n\t\t\t// this selector is discovered while transforming a late-used body.\n\t\t\tiface_name := t.resolve_interface_type_name(method_value_name.all_before_last(\'.\'))\n\t\t\tif iface_name.len > 0 {\n\t\t\t\tt.mark_interface_method_implementers_used(iface_name, node.value)\n\t\t\t}\n\t\t}\n\t\tmethod_params := t.call_param_types(method_value_name)'
          assert text.count(old) == 1, 'Expected exactly one method-value retention site'
          path.write_text(text.replace(old, new, 1))
          PY
          git diff --check
          test "$(git diff --name-only)" = vlib/v/transform/transform.v
          git diff -- vlib/v/transform/transform.v
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- vlib/v/transform/transform.v
          git commit -m 'transform: retain concrete interface callback targets in late bodies'
          git push origin HEAD:"$branch"
          echo "Published source correction: $(git rev-parse HEAD)"
