name: macOS strict compiler probe overflow diagnostics
on:
  pull_request:
    paths:
      - '.github/workflows/macos_probe_overflow_diagnostic.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    strategy:
      fail-fast: false
      matrix:
        include:
          - role: original
            revision: cd3df54950546c39c6457897a87bc942375184e9
          - role: current
            revision: 358b5b765da692d6cf95cea2b543cbec8132b51f
    runs-on: macos-26
    timeout-minutes: 45
    env:
      VFLAGS: -cc clang
      VJOBS: '3'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.revision }}
          persist-credentials: false
      - name: Build original optimized compiler from pinned source
        uses: ./.github/actions/setup-v
        with:
          use-prebuilt: 'false'
      - name: Check compiler and original setup
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD
          uname -a
          sysctl hw.ncpu
          ./v version
          printf 'fn main() { println(6 * 7) }\n' > "$RUNNER_TEMP/v3_canary.v"
          ./v -v run "$RUNNER_TEMP/v3_canary.v" > "$RUNNER_TEMP/canary.log" 2>&1
          cat "$RUNNER_TEMP/canary.log"
          grep -F '=== V compiler benchmark ===' "$RUNNER_TEMP/canary.log"
          grep -x '42' "$RUNNER_TEMP/canary.log"
          ./v -d arm64 -silent test vlib/v/gen/fastc/if_condition_arm64_test.v
          ./v run ci/macos_ci.vsh test_symlink
          ./v run ci/macos_ci.vsh v_doctor
      - name: Compare exact strict build with worker-init and serial controls
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/probe-replay"
          out="$RUNNER_TEMP/probe-replay"
          unset V3_NO_LEAN_CGEN_WORKER_INIT
          failed=0
          for iteration in 1 2 3 4 5; do
            for mode in default eager serial; do
              rm -f vstrict1
              log="$out/$iteration-$mode.log"
              rc=0
              case "$mode" in
                default) ./v -cg -cstrict -o vstrict1 cmd/v > "$log" 2>&1 || rc=$? ;;
                eager) V3_NO_LEAN_CGEN_WORKER_INIT=1 ./v -cg -cstrict -o vstrict1 cmd/v > "$log" 2>&1 || rc=$? ;;
                serial) ./v -no-parallel -cg -cstrict -o vstrict1 cmd/v > "$log" 2>&1 || rc=$? ;;
              esac
              printf 'iteration=%s mode=%s status=%s\n' "$iteration" "$mode" "$rc" | tee -a "$out/status.txt"
              cat "$log"
              if [ "$rc" -eq 0 ]; then
                test -x vstrict1
                ./vstrict1 version
              else
                failed=1
              fi
            done
          done
          # A passing control is diagnostic only; it cannot turn a baseline failure green.
          exit "$failed"
      - name: Preserve native results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-probe-${{ matrix.role }}
          path: |
            ${{ runner.temp }}/probe-replay/
            ${{ runner.temp }}/canary.log
