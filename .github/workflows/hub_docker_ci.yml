name: hub_docker_ci

### Publishes the images for a V release tag.
##
### This is the only workflow triggered by a tag, and it is the reason a version
### tag on Docker Hub can be trusted: V_REV is set from github.ref_name, so
### thevlang/vlang:0.5.2 contains V 0.5.2 rather than whatever master was.
### The daily nightly images are published separately, from
### vlang/docker/.github/workflows/nightly_builds.yml, and only carry floating
### tags (:latest, :alpine, :debian, :nix) because they track V master.
##
### The Dockerfiles come from a reviewed, pinned vlang/docker snapshot.
### Preparation checks its recipe hashes, resolves the developer templates,
### and includes the Nix toolchain as an internal stage (no nix-build tag needed).
###
### NB: avoid caching things here, since the action is rare (once per release),
### and the potential benefits are less than the complexity of debugging
### cache invalidation issues...
## Trigger on both new release tags, and on weekly tags.
## Allow for manual override too:
on:
  workflow_dispatch:
    inputs:
      tag:
        description: The V tag to build, e.g. 0.5.2
        required: true
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - 'weekly.*'

concurrency:
  group: 'hub_docker_ci-${{ github.ref }}'
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Both architectures the official images are published for.
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  resolve-bootstrap:
    name: Resolve historical V bootstrap
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      tag: ${{ steps.bootstrap.outputs.tag }}
      manifest: ${{ steps.bootstrap.outputs.manifest }}
      v_source_sha: ${{ steps.bootstrap.outputs.v_source_sha }}
      vc_revision: ${{ steps.bootstrap.outputs.vc_revision }}
      vc_c_sha256: ${{ steps.bootstrap.outputs.vc_c_sha256 }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts/prepare_docker_release.py
          sparse-checkout-cone-mode: false

      - name: Freeze bootstrap for the requested source
        id: bootstrap
        env:
          V_RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          python3 .github/scripts/prepare_docker_release.py \
            --resolve-bootstrap "$V_RELEASE_TAG" \
            --history-dir "$RUNNER_TEMP/bootstrap-history" \
            --bootstrap-output "$RUNNER_TEMP/bootstrap.json" \
            --github-output "$GITHUB_OUTPUT"

  publish-release-images:
    needs: resolve-bootstrap
    name: Publish ${{ matrix.os }} ${{ inputs.tag || github.ref_name }}
    strategy:
      matrix:
        # ubuntu is deliberately absent: :ubuntu-build and :ubuntu-base exist
        # only because CI runs in them, and are built in vlang/docker.
        os: [debian, alpine, nix, static]
      # One broken variant must not stop the others being published.
      fail-fast: false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BOOTSTRAP_MANIFEST: ${{ needs.resolve-bootstrap.outputs.manifest }}
      RESOLVED_TAG: ${{ needs.resolve-bootstrap.outputs.tag }}
    steps:
      - name: Check out release preparation
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check out pinned image recipes
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          repository: 'vlang/docker'
          ref: 4cfc69eb8ea27b1d1e3abf13dccc6b3ae0fd5046
          path: docker-release-source

      - name: Prepare all release recipes
        run: |
          set -euo pipefail
          printf '%s\n' "$BOOTSTRAP_MANIFEST" > "$RUNNER_TEMP/bootstrap.json"
          python3 .github/scripts/prepare_docker_release.py \
            --source docker-release-source \
            --output docker-release-source/.release \
            --release-tag "$RESOLVED_TAG" \
            --bootstrap-manifest "$RUNNER_TEMP/bootstrap.json"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to hub.docker.com
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Create & bootstrap persistent builder
        run: |
          docker buildx create --name gh-builder --driver docker-container --use
          docker buildx inspect --bootstrap

      - name: Resolve the tag being published
        id: tag
        env:
          V_RELEASE_TAG: ${{ needs.resolve-bootstrap.outputs.tag }}
        run: |
          set -euo pipefail
          tag="$V_RELEASE_TAG"
          if [[ ${#tag} -gt 120 ]] || ! [[ "$tag" =~ ^([0-9]+\.[0-9]+\.[0-9]+|weekly\.[A-Za-z0-9_.-]+)$ ]]; then
            echo "expected a release or weekly V tag that fits the image tags" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: generate tags conditionally
        id: gen_tags
        env:
          V_RELEASE_TAG: ${{ steps.tag.outputs.tag }}
          IMAGE_VARIANT: ${{ matrix.os }}
        run: |
          tag="$V_RELEASE_TAG"
          case "$IMAGE_VARIANT" in
            debian)
              # debian is the default variant, so it owns the unqualified tags.
              echo 'TAGS=thevlang/vlang:latest,thevlang/vlang:debian,thevlang/vlang:'"$tag"',thevlang/vlang:debian-'"$tag" >> "$GITHUB_OUTPUT"
              ;;
            static)
              echo 'TAGS=thevlang/vlang:static-'"$tag" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo 'TAGS=thevlang/vlang:'"$IMAGE_VARIANT"',thevlang/vlang:'"$IMAGE_VARIANT"'-'"$tag" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        name: Build and deploy v image
        with:
          builder: gh-builder
          context: docker-release-source
          platforms: ${{ env.PLATFORMS }}
          # The tag being released, so the image contains exactly that version.
          build-args: |
            USER=thevlang
            V_REV=${{ steps.tag.outputs.tag }}
            V_SOURCE_SHA=${{ needs.resolve-bootstrap.outputs.v_source_sha }}
            VC_REV=${{ needs.resolve-bootstrap.outputs.vc_revision }}
            VC_C_SHA256=${{ needs.resolve-bootstrap.outputs.vc_c_sha256 }}
          tags: ${{ steps.gen_tags.outputs.TAGS }}
          file: docker-release-source/.release/Dockerfile.${{ matrix.os }}
          labels: |
            org.opencontainers.image.title=thevlang/vlang:${{ matrix.os }}-${{ steps.tag.outputs.tag }}
            org.opencontainers.image.version=${{ steps.tag.outputs.tag }}
            org.opencontainers.image.revision=${{ steps.tag.outputs.tag }}
            org.opencontainers.image.source=https://github.com/vlang/docker
            org.opencontainers.image.url=https://hub.docker.com/r/thevlang/vlang
            org.opencontainers.image.licenses=MIT
          push: true

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        name: Build and deploy developer build
        if: matrix.os != 'static'
        with:
          builder: gh-builder
          context: docker-release-source
          platforms: ${{ env.PLATFORMS }}
          build-args: |
            USER=thevlang
            V_REV=${{ steps.tag.outputs.tag }}
            V_SOURCE_SHA=${{ needs.resolve-bootstrap.outputs.v_source_sha }}
            VC_REV=${{ needs.resolve-bootstrap.outputs.vc_revision }}
            VC_C_SHA256=${{ needs.resolve-bootstrap.outputs.vc_c_sha256 }}
          tags: thevlang/vlang:${{ matrix.os }}-dev
          file: docker-release-source/.release/Dockerfile.${{ matrix.os }}.dev-full
          labels: |
            org.opencontainers.image.title=thevlang/vlang:${{ matrix.os }}-dev
            org.opencontainers.image.version=${{ steps.tag.outputs.tag }}
            org.opencontainers.image.revision=${{ steps.tag.outputs.tag }}
            org.opencontainers.image.source=https://github.com/vlang/docker
            org.opencontainers.image.licenses=MIT
          push: true
