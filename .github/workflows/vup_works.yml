name: Upgrading from a previous release with v up works

on:
  workflow_call:

concurrency:
  group: vup-vup_works-${{ github.ref == 'refs/heads/master' && github.sha || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  v-up-works-nix:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            zip: v_linux.zip
          - os: macos-15-intel
            zip: v_macos_x86_64.zip
          - os: macos-latest
            zip: v_macos_arm64.zip
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      VDIR: /tmp/v_from_release_zip
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build v
        uses: ./.github/actions/setup-v
        with:
          version: true

      - name: Build the current updater
        # The current updater imports newer stdlib modules that are absent from older ZIPs.
        # Keep its executable outside the extracted checkout so updating cannot replace it.
        run: ./v -o "$RUNNER_TEMP/vup-current" cmd/tools/vup.v

      - name: Download latest release ZIP
        run: |
          curl --fail --location --silent --show-error \
            --connect-timeout 15 \
            --max-time 180 \
            --retry 5 \
            --retry-all-errors \
            --retry-delay 2 \
            --retry-max-time 600 \
            --output "${{ matrix.zip }}" \
            "https://github.com/vlang/v/releases/latest/download/${{ matrix.zip }}"
          shasum -a 256 "${{ matrix.zip }}"

      - name: Extract ZIP 1, no changes
        run: |
          rm -rf "$VDIR"
          bash .github/workflows/extract_v_release.sh "${{ matrix.zip }}" "$VDIR"
          cd "$VDIR/v"
          ./v version
          ./v up
          echo "Updated ./v version: $(./v version) | Current   v version: $(v version)"

      - name: Extract ZIP 2, with local changes
        run: |
          rm -rf "$VDIR"
          bash .github/workflows/extract_v_release.sh "${{ matrix.zip }}" "$VDIR"
          touch "$VDIR/v/vlib/v/pref/local_file_not_present_in_master.c.v" && rm "$VDIR/v/examples/hello_world.v"
          cd "$VDIR/v"
          ./v version
          ./v up
          echo "Updated ./v version: $(./v version) | Current   v version: $(v version)"

      - name: Extract ZIP 3, run the current updater on the released compiler
        run: |
          rm -rf "$VDIR"
          bash .github/workflows/extract_v_release.sh "${{ matrix.zip }}" "$VDIR"
          cd "$VDIR/v"
          ./v version
          VEXE="$PWD/v" "$RUNNER_TEMP/vup-current"
          echo "Updated ./v version: $(./v version) | Current   v version: $(v version)"

      - name: Extract ZIP 4, run the current updater with local changes
        run: |
          rm -rf "$VDIR"
          bash .github/workflows/extract_v_release.sh "${{ matrix.zip }}" "$VDIR"
          touch "$VDIR/v/vlib/v/pref/local_file_not_present_in_master.c.v" && rm "$VDIR/v/examples/hello_world.v"
          cd "$VDIR/v"
          ./v version
          VEXE="$PWD/v" "$RUNNER_TEMP/vup-current"
          echo "Updated ./v version: $(./v version) | Current   v version: $(v version)"
