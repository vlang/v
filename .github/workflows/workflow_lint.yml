name: Workflow Lint

## Note: to install `prettier` locally, see https://prettier.io/docs/en/install,
## or just: `npm install --save-dev --save-exact prettier`

## If you already have `prettier` installed, to run it locally,
## just run: `npx prettier --check **.yml` .

on:
  push:
    branches:
      - master
    paths:
      - '**.yml'
  pull_request:
    paths:
      - '**.yml'

concurrency:
  group: workflow-lint-${{ github.workflow }}-${{ github.ref == 'refs/heads/master' && github.sha || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-yml-workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify formatting
        uses: creyD/prettier_action@8c18391fdc98ed0d884c6345f03975edac71b8f0 # v4.6
        with:
          prettier_options: --check **.yml
