name: More extensive but slower tests

on:
  push:
    branches:
      - master
    paths-ignore:
      - '**.md'
      - '**.yml'
      - '!**/more_extensive_but_slower_tests_ci.yml'
      - 'examples/**'
      - 'cmd/tools/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - '**.yml'
      - '!**/more_extensive_but_slower_tests_ci.yml'
      - 'examples/**'
      - 'cmd/tools/**'

concurrency:
  group: slower_tests-${{ github.workflow }}-${{ github.ref == 'refs/heads/master' && github.sha || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  more-tests:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Stop a failing test session at its first failure instead of
      # running the whole suite to completion; the remaining files
      # add no signal.
      VTEST_FAIL_FAST: '1'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        id: uses_checkout_v7
        with:
          persist-credentials: false

      - name: Build V
        if: runner.os != 'Windows'
        run: make -j4 && ./v symlink
      - name: Build V (Windows)
        if: runner.os == 'Windows'
        run: ./makev.bat && ./v symlink

      - name: Run additional crypto tests
        id: run_additional_crypto_tests
        if: ${{ success() && !cancelled() && steps.uses_checkout_v7.outcome == 'success' }}
        run: |
          v retry -- git clone --depth 1 https://github.com/vlang/slower_tests
          v test slower_tests/
