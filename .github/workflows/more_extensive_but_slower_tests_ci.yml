name: More extensive but slower tests

on:
  workflow_call:

concurrency:
  group: slower_tests-more_extensive_but_slower_tests_ci-${{ github.ref == 'refs/heads/master' && github.sha || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  more-tests:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Stop a failing test session at its first failure instead of
      # running the whole suite to completion; the remaining files
      # add no signal.
      VTEST_FAIL_FAST: '1'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build V
        if: runner.os != 'Windows'
        uses: ./.github/actions/setup-v
      - name: Build V (Windows)
        if: runner.os == 'Windows'
        uses: ./.github/actions/setup-v

      - name: Run additional crypto tests
        run: |
          v retry -- git clone --depth 1 https://github.com/vlang/slower_tests
          v test slower_tests/
