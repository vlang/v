name: Issue 28673 final review
on:
  push:
    branches: [work/28673-c-field-names]
permissions:
  contents: read
jobs:
  refine:
    runs-on: ubuntu-slim
    permissions:
      contents: write
    steps:
      - uses: actions/github-script@v8
        with:
          script: |
            const repo = context.repo;
            const branch = 'fix/28673-c-field-names';
            const expected = '4f788d06db5bdcd08aef7503dda25c3c1b593edb';
            const {data: ref} = await github.rest.git.getRef({...repo, ref: `heads/${branch}`});
            if (ref.object.sha !== expected) throw new Error('The fix branch changed; refusing to overwrite it');
            const path = 'vlib/v/gen/c/cleanc.v';
            const {data: file} = await github.rest.repos.getContent({...repo, path, ref: expected});
            if (file.sha !== 'c3ecc79e97ae45d99d4a0a5871756897dcc16cd2') throw new Error('Unexpected source blob');
            const source = Buffer.from(file.content, 'base64').toString('utf8');
            const signature = 'fn (mut g FlatGen) sizeof_selector_target(base string, fields []string) string {';
            const start = source.indexOf(signature);
            const end = source.indexOf('\n}', start) + 2;
            if (start < 0 || end <= start) throw new Error('Cannot locate sizeof selector helper');
            const replacement = [
              signature,
              '\tmut expr := c_name(base)',
              '\tmut cur := g.sizeof_selector_base_type(base)',
              '\tfor field in fields {',
              '\t\tmut arrow := false',
              '\t\tmut field_name := c_field_name(field)',
              '\t\tif typ := cur {',
              '\t\t\t// An alias may stand for the pointer, so resolve it before',
              '\t\t\t// choosing the member-access operator.',
              '\t\t\tif cgen_unalias_type(typ) is types.Pointer {',
              '\t\t\t\tarrow = true',
              '\t\t\t}',
              '\t\t\tif field.starts_with(\'@\') {',
              '\t\t\t\tfield_name = g.field_c_name(typ, field)',
              '\t\t\t}',
              '\t\t}',
              '\t\texpr += if arrow { \'->${field_name}\' } else { \'.${field_name}\' }',
              '\t\tcur = g.sizeof_selector_field_type(cur, field)',
              '\t}',
              '\treturn expr',
              '}'
            ].join('\n');
            const content = source.slice(0, start) + replacement + source.slice(end);
            const {data: result} = await github.rest.repos.createOrUpdateFileContents({
              ...repo, path, branch, sha: file.sha,
              message: 'cgen: retain non-escaped sizeof member naming',
              content: Buffer.from(content).toString('base64')
            });
            core.info(`Refined fix: ${result.commit.sha}`);
