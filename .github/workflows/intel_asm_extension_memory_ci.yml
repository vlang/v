name: Intel extension move memory widths
on:
  pull_request:
    paths:
      - 'vlib/v/gen/c/stmt.v'
      - 'vlib/v/gen/c/stmt_test.v'
      - 'vlib/v/slow_tests/assembly/**'
      - '.github/workflows/intel_asm_extension_memory_ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  legacy:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container:
      image: thevlang/vlang:ubuntu-build
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fd7a9522667adac06f9b02d201fcb1f6b65faf1e
          path: baseline
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          path: candidate
          persist-credentials: false
      - name: Reproduce original assembler failure on the failing revision
        working-directory: baseline
        run: |
          set -eu
          git config --global --add safe.directory "$(pwd -P)"
          test "$(git rev-parse HEAD)" = fd7a9522667adac06f9b02d201fcb1f6b65faf1e
          gcc --version
          as --version
          make -j4
          ./v -prod -cg -o v cmd/v
          fixture=vlib/v/slow_tests/assembly/asm_intel_gcc_suffix_test.amd64.v
          rc=0
          env -u VFLAGS -u VOSARGS ./v -cc musl-gcc -gc none -d use_bundled_libgc -silent -cc gcc -no-retry-compilation -keepc -showcc "$fixture" > ../baseline.log 2>&1 || rc=$?
          cat ../baseline.log
          test "$rc" -ne 0
          grep -F 'ambiguous operand size for' ../baseline.log
          grep -F movswq ../baseline.log
      - name: Rebuild candidate and verify original regression
        working-directory: candidate
        run: |
          set -eu
          git config --global --add safe.directory "$(pwd -P)"
          make -j4
          ./v -prod -cg -o v cmd/v
          ./v fmt -w vlib/v/gen/c/stmt.v vlib/v/gen/c/stmt_test.v
          git diff -- vlib/v/gen/c/stmt.v vlib/v/gen/c/stmt_test.v
          git diff --exit-code -- vlib/v/gen/c/stmt.v vlib/v/gen/c/stmt_test.v
          ./v fmt -verify vlib/v/gen/c/stmt.v vlib/v/gen/c/stmt_test.v
          fixture=vlib/v/slow_tests/assembly/asm_intel_gcc_suffix_test.amd64.v
          env -u VFLAGS -u VOSARGS ./v -cc musl-gcc -gc none -d use_bundled_libgc -silent -cc gcc -no-retry-compilation -o ../candidate.c "$fixture"
          grep -nE 'mov(zx|sx|sxd) .* ptr' ../candidate.c
          rc=0
          env -u VFLAGS -u VOSARGS ./v -cc musl-gcc -gc none -d use_bundled_libgc -silent -cc gcc -no-retry-compilation -keepc -showcc "$fixture" > ../candidate.log 2>&1 || rc=$?
          cat ../candidate.log
          test "$rc" -eq 0
          ./v -cc gcc -gc none -silent -no-retry-compilation vlib/v/gen/c/stmt_test.v
          ./v -cc gcc -gc none -silent -no-retry-compilation test vlib/v/slow_tests/assembly/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: legacy-original-assembler-log
          path: |
            baseline.log
            candidate.log
            candidate.c
  modern:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/cache-apt-packages-action
      - uses: ./.github/actions/setup-v
      - name: Rebuild and verify focused regressions
        run: |
          set -eu
          ./v self
          ./v fmt -verify vlib/v/gen/c/stmt.v vlib/v/gen/c/stmt_test.v
          ./v -cc gcc -no-retry-compilation -silent vlib/v/slow_tests/assembly/asm_intel_gcc_suffix_test.amd64.v
          ./v -cc gcc -no-retry-compilation -silent vlib/v/gen/c/stmt_test.v
          ./v -cc gcc -silent test vlib/v/slow_tests/assembly/
      - name: Full compiler and C backend tests
        run: |
          set -eu
          ./v run ci/linux_ci.vsh install_dependencies_for_examples_and_tools_gcc
          ./v -silent vlib/v/compiler_errors_test.v
          ./v -silent test vlib/v/
          ./v -silent test vlib/v/gen/c/
