name: sdl CI

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - 'vlib/**'
      - 'thirdparty/**'
      - 'cmd/tools/builders/**.v'
      - 'cmd/tools/vshader.v'
      - '**/sdl_ci.yml'
      - '!**.md'
  pull_request:
    paths:
      - 'vlib/**'
      - 'thirdparty/**'
      - 'cmd/tools/builders/**.v'
      - 'cmd/tools/vshader.v'
      - '**/sdl_ci.yml'
      - '!**.md'

concurrency:
  group: sdl-${{ github.workflow }}-${{ github.ref == 'refs/heads/master' && github.sha || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  v-compiles-sdl-examples:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # Stop a failing test session at its first failure instead of
      # running the whole suite to completion; the remaining files
      # add no signal.
      VTEST_FAIL_FAST: '1'
      VFLAGS: -cc tcc
    steps:
      - uses: actions/checkout@v7
        id: uses_checkout_v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/cache-apt-packages-action
        id: uses_cache_apt_packages_action
        if: ${{ success() && !cancelled() && steps.uses_checkout_v7.outcome == 'success' }}
      - name: Build V
        id: build_v
        if: ${{ success() && !cancelled() && steps.uses_cache_apt_packages_action.outcome == 'success' }}
        run: make && sudo ./v symlink

      - name: Install dependencies
        id: install_dependencies
        if: ${{ success() && !cancelled() && steps.build_v.outcome == 'success' }}
        run: |
          .github/workflows/disable_azure_mirror.sh		
          v retry 'sudo apt update'
          v retry 'sudo apt install -y libsdl2-dev libsdl2-ttf-dev'
          v retry 'sudo apt install -y libsdl2-mixer-dev libsdl2-image-dev'

      - name: Clone sdl into .vmodules
        id: clone_sdl_into_vmodules
        if: ${{ success() && !cancelled() && steps.install_dependencies.outcome == 'success' }}
        run: |
          v retry 'git clone --filter=blob:none https://github.com/vlang/sdl'
          cd sdl
          mkdir -p ~/.vmodules
          ln -s "$(pwd)" ~/.vmodules/sdl

      - name: Ensure SDL setup works
        id: ensure_sdl_setup_works
        if: ${{ success() && !cancelled() && steps.clone_sdl_into_vmodules.outcome == 'success' }}
        run: ./v ~/.vmodules/sdl/setup.vsh

      - name: Run tests
        id: run_tests
        if: ${{ success() && !cancelled() && steps.ensure_sdl_setup_works.outcome == 'success' }}
        run: ./v test sdl

      - name: Build sdl shared
        id: build_sdl_shared
        if: ${{ success() && !cancelled() && steps.run_tests.outcome == 'success' }}
        run: ./v -shared -g sdl

      - name: Build sdl examples
        id: build_sdl_examples
        if: ${{ success() && !cancelled() && steps.build_sdl_shared.outcome == 'success' }}
        run: |
          v shader sdl/examples/sdl_opengl_and_sokol
          v should-compile-all sdl/examples/
          ~/.vmodules/sdl/examples/versions/main

      - name: Check SDL works, when installed through vpm
        id: check_sdl_works_when_installed_through_vpm
        if: ${{ success() && !cancelled() && steps.build_sdl_examples.outcome == 'success' }}
        run: |
          rm -rf sdl/
          rm -rf ~/.vmodules/sdl
          v retry 'v install sdl'
          ls -la ~/.vmodules/sdl/
          v ~/.vmodules/sdl/setup.vsh
          v run ~/.vmodules/sdl/examples/versions
