name: PR 28244 rewrite diagnostic

on:
  push:
    branches:
      - v3-ownership-toml-value-copy

permissions:
  contents: read

jobs:
  diagnose-rebase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v3-ownership-toml-value-copy
          fetch-depth: 0
      - name: Apply net PR diff to current master
        shell: bash
        run: |
          set -euxo pipefail
          old_base=cbf4e8509630da710d04cc9fd0f777761ebe55a7
          old_head=$(git rev-parse HEAD)
          git fetch origin master
          git diff --binary --full-index "$old_base" "$old_head" -- . ':(exclude).github/workflows/pr-28244-rewrite.yml' > /tmp/pr-28244.patch
          git checkout --detach origin/master
          if ! git apply --3way --index /tmp/pr-28244.patch; then
            git status --short
            git diff --name-only --diff-filter=U
            exit 1
          fi
          git status --short
