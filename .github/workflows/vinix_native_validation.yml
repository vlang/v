name: Vinix native build validation
'on':
  push:
    branches:
      - ci/verify-vinix-native-20261031
permissions:
  contents: read
concurrency:
  group: vinix-native-${{ github.ref }}
  cancel-in-progress: true
env:
  VJOBS: '2'
jobs:
  vinix-build:
    if: github.ref == 'refs/heads/ci/verify-vinix-native-20261031'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build V
        run: make -j4 && ./v symlink
      - name: Install dependencies
        run: |
          .github/workflows/disable_azure_mirror.sh
          v retry -- sudo apt update
          v retry -- sudo apt install build-essential -y
      - name: Clone current Vinix
        run: v retry -- git clone --depth=1 --branch master https://github.com/vlang/vinix.git
      - name: Download Vinix kernel dependencies
        run: cd vinix/kernel && v retry -- ./get-deps
      - name: Build the Vinix kernel (debug)
        run: |
          set -e
          cd vinix/kernel
          make PROD=false \
            CFLAGS="-Ulinux -U__linux -U__linux__ -U__gnu_linux__ -D__vinix__ -O2 -g -pipe" \
            V="$(realpath ../../v)"
          make clean
      - name: Build the Vinix kernel (prod)
        run: |
          set -e
          cd vinix/kernel
          make PROD=true \
            CFLAGS="-Ulinux -U__linux -U__linux__ -U__gnu_linux__ -D__vinix__ -O2 -g -pipe" \
            V="$(realpath ../../v)"
          make clean
      - name: Build util-vinix (debug)
        run: |
          set -e
          cd vinix/util-vinix
          make PROD=false \
            VFLAGS="-os vinix -gc none" \
            CFLAGS="-Ulinux -U__linux -U__linux__ -U__gnu_linux__ -D__vinix__ -O2 -g -pipe" \
            V="$(realpath ../../v)"
          make clean
      - name: Build util-vinix (prod)
        run: |
          set -e
          cd vinix/util-vinix
          make PROD=true \
            VFLAGS="-os vinix -gc none" \
            CFLAGS="-Ulinux -U__linux -U__linux__ -U__gnu_linux__ -D__vinix__ -O2 -g -pipe" \
            V="$(realpath ../../v)"
          make clean
