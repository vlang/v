name: Windows bootstrap contracts

on:
  workflow_call:

  workflow_dispatch:

concurrency:
  group: makev-${{ github.workflow }}-${{ github.ref == 'refs/heads/master' && github.sha || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bootstrap-contracts:
    if: github.ref == 'refs/heads/master'
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check out bundled TCC for the native bootstrap regression
        if: runner.os == 'Windows'
        uses: actions/checkout@v7
        with:
          repository: vlang/tccbin
          ref: thirdparty-windows-amd64
          path: thirdparty/tcc
          persist-credentials: false
      - name: Test bootstrap configuration and batch error handling
        run: python cmd/tools/makev_test.py
      - name: Test Windows CI build failures and W3 integrity pins
        if: ${{ !cancelled() }}
        run: python cmd/tools/windows_ci_test.py
      - name: Test Win32 W4 integrity pins and ordered manifests
        if: ${{ !cancelled() }}
        run: python cmd/tools/windows_w4_ci_test.py
