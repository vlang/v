name: Windows bootstrap contracts

on:
  push:
    branches: [master]
    paths:
      - 'makev.bat'
      - '.github/workflows/windows_ci_gcc.yml'
      - '.github/workflows/windows_ci_msvc.yml'
      - '.github/workflows/windows_ci_tcc.yml'
      - '.github/workflows/run_multiwindow_win32_w3_green.ps1'
      - '.github/workflows/run_multiwindow_win32_w4.ps1'
      - 'vlib/x/multiwindow/testdata/win32_nonreadback_test_oracle.h'
      - 'vlib/gg/testdata/multiwindow_win32_clipboard_no_optin_probe.v'
      - 'vlib/x/multiwindow/service_backend.v'
      - 'vlib/x/multiwindow/event_delivery.v'
      - 'vlib/x/multiwindow/win32_backend.c.v'
      - 'vlib/x/multiwindow/win32_service_backend.c.v'
      - 'vlib/x/multiwindow/win32_service_native.h'
      - 'vlib/x/multiwindow/service_native_win32_contract_red_test.v'
      - 'vlib/gg/multiwindow_win32_public_services_contract_windows_test.v'
      - 'vlib/x/multiwindow/event_sequence_exhaustion_test.v'
      - '.github/workflows/makev_ci.yml'
  pull_request:
    paths:
      - 'makev.bat'
      - '.github/workflows/windows_ci_gcc.yml'
      - '.github/workflows/windows_ci_msvc.yml'
      - '.github/workflows/windows_ci_tcc.yml'
      - '.github/workflows/run_multiwindow_win32_w3_green.ps1'
      - '.github/workflows/run_multiwindow_win32_w4.ps1'
      - 'vlib/x/multiwindow/testdata/win32_nonreadback_test_oracle.h'
      - 'vlib/gg/testdata/multiwindow_win32_clipboard_no_optin_probe.v'
      - 'vlib/x/multiwindow/service_backend.v'
      - 'vlib/x/multiwindow/event_delivery.v'
      - 'vlib/x/multiwindow/win32_backend.c.v'
      - 'vlib/x/multiwindow/win32_service_backend.c.v'
      - 'vlib/x/multiwindow/win32_service_native.h'
      - 'vlib/x/multiwindow/service_native_win32_contract_red_test.v'
      - 'vlib/gg/multiwindow_win32_public_services_contract_windows_test.v'
      - 'vlib/x/multiwindow/event_sequence_exhaustion_test.v'
      - '.github/workflows/makev_ci.yml'
  workflow_dispatch:

concurrency:
  group: makev-${{ github.workflow }}-${{ github.ref == 'refs/heads/master' && github.sha || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bootstrap-contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check out bundled TCC for the native bootstrap regression
        if: runner.os == 'Windows'
        uses: actions/checkout@v7
        with:
          repository: vlang/tccbin
          ref: thirdparty-windows-amd64
          path: thirdparty/tcc
          persist-credentials: false
      - name: Bootstrap contract tests removed (were Python-based)
        run: echo "skipped"
