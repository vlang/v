name: Windows bootstrap contracts

on:
  push:
    branches: [master]
    paths:
      - 'makev.bat'
      - 'cmd/tools/makev_test.py'
      - 'cmd/tools/windows_ci_test.py'
      - 'vlib/v/pref/pkgconfig_test.v'
      - 'vlib/v/tests/comptime/comptime_if_pkgconfig_test.v'
      - '.github/workflows/setup_windows_tool_cache.ps1'
      - '.github/workflows/windows_ci_gcc.yml'
      - '.github/workflows/windows_ci_msvc.yml'
      - '.github/workflows/windows_ci_tcc.yml'
      - '.github/workflows/run_multiwindow_win32_w3_green.ps1'
      - '.github/workflows/run_multiwindow_win32_w4.ps1'
      - 'cmd/tools/windows_w4_ci_test.py'
      - 'vlib/x/multiwindow/testdata/win32_nonreadback_test_oracle.h'
      - 'vlib/gg/testdata/multiwindow_win32_clipboard_no_optin_probe.v'
      - 'vlib/x/multiwindow/service_backend.v'
      - 'vlib/x/multiwindow/event_delivery.v'
      - 'vlib/x/multiwindow/win32_backend.c.v'
      - 'vlib/x/multiwindow/win32_service_backend.c.v'
      - 'vlib/x/multiwindow/win32_service_native.h'
      - 'vlib/x/multiwindow/service_native_win32_contract_red_test.v'
      - 'vlib/gg/multiwindow_win32_public_services_contract_windows_test.v'
      - 'vlib/x/multiwindow/event_sequence_exhaustion_test.v'
      - 'vlib/gg/testdata/multiwindow_win32_raw_input_w5_a1_public_red_test.v'
      - 'vlib/x/multiwindow/testdata/win32_raw_input_w5_a1_oracle.h'
      - 'vlib/x/multiwindow/testdata/win32_raw_input_w5_preflight.h'
      - 'vlib/x/multiwindow/testdata/win32_raw_input_w5_preflight.c'
      - '.github/workflows/run_multiwindow_win32_w5_a0.ps1'
      - 'vlib/gg/multiwindow_d_gg_multiwindow.v'
      - 'vlib/gg/multiwindow_notd_gg_multiwindow.v'
      - 'vlib/gg/multiwindow_service_types.v'
      - 'vlib/x/multiwindow/app.v'
      - 'vlib/x/multiwindow/types.v'
      - 'vlib/x/multiwindow/backend.v'
      - 'vlib/x/multiwindow/service_api.v'
      - 'vlib/x/multiwindow/service_types.v'
      - 'vlib/x/multiwindow/service_registry.v'
      - 'vlib/x/multiwindow/event_dispatch_d_gg_multiwindow.v'
      - 'vlib/x/multiwindow/win32_backend_helpers.h'
      - '.github/workflows/run_multiwindow_win32_w5_a1.ps1'
      - '.github/workflows/makev_ci.yml'
  workflow_dispatch:

concurrency:
  group: makev-${{ github.workflow }}-${{ github.ref == 'refs/heads/master' && github.sha || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bootstrap-contracts:
    if: github.ref == 'refs/heads/master'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check out bundled TCC for the native bootstrap regression
        if: runner.os == 'Windows'
        uses: actions/checkout@v7
        with:
          repository: vlang/tccbin
          ref: thirdparty-windows-amd64
          path: thirdparty/tcc
          persist-credentials: false
      - name: Test bootstrap configuration and batch error handling
        run: python cmd/tools/makev_test.py
      - name: Test Windows CI build failures and W3 integrity pins
        if: ${{ !cancelled() }}
        run: python cmd/tools/windows_ci_test.py
      - name: Test Win32 W4 integrity pins and ordered manifests
        if: ${{ !cancelled() }}
        run: python cmd/tools/windows_w4_ci_test.py
